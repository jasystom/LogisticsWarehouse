const LANGS={fr:['🇫🇷','Français'],en:['🇬🇧','English'],es:['🇪🇸','Español'],de:['🇩🇪','Deutsch'],pt:['🇵🇹','Português']};
const LOCALE={fr:'fr-FR',en:'en-GB',es:'es-ES',de:'de-DE',pt:'pt-PT'};
const I18N={"en": {"Un CDI coûte un recrutement (annonces, entretiens, intégration), un salaire versé même quand l’activité baisse, et des indemnités en cas de licenciement. L’intérim coûte plus cher à l’heure (le « coefficient » de l’agence), mais il s’adapte aux pics : saisons, promotions, absences. Les bons managers gardent un <b>socle de CDI</b> pour la charge régulière et utilisent l’intérim pour les variations, en le réservant à l’avance.": "A permanent contract (CDI) costs a recruitment (job ads, interviews, onboarding), a salary paid even when activity drops, and severance pay if you have to let someone go. Temp work costs more per hour (the agency’s “markup”), but it adapts to peaks: seasons, promotions, absences. Good managers keep a <b>core of permanent staff</b> for the regular workload and use temps for the fluctuations, booking them in advance.", "Sur téléphone : joystick à gauche pour marcher, gros bouton orange pour agir. Sur ordinateur : flèches ou ZQSD, et Espace. Approche-toi d’une palette, d’un emplacement, d’un poste ou du quai : le bouton indique l’action possible. Ton vrai métier de chef : régler les seuils de commande, planifier les équipes, prendre les bonnes décisions face aux imprévus, et tenir tes indicateurs au bilan du vendredi.": "On a phone: joystick on the left to walk, big orange button to act. On a computer: arrow keys or WASD, and Space. Walk up to a pallet, a location, a workstation or the dock: the button shows the available action. Your real job as a manager: set reorder points, plan the shifts, make the right calls when the unexpected happens, and hit your KPIs at the Friday review.", "Les problèmes se voient sur le terrain avant de se voir dans les chiffres. Le <b>point d’équipe</b> de 5 minutes devant le tableau (objectifs, sécurité, priorités) et les discussions avec les opérateurs font remonter les idées et les difficultés. C’est le principe du « Gemba » du Lean : aller voir là où la valeur se crée.": "Problems show up on the floor before they show up in the numbers. The 5-minute <b>team huddle</b> in front of the board (goals, safety, priorities) and chats with operators bring ideas and difficulties to the surface. That’s the Lean principle of “Gemba”: go and see where the value is created.", "Ordres de grandeur inspirés de l’INRS (métiers de la logistique), de la CRAMIF et de guides professionnels sur les indicateurs d’entrepôt et l’automatisation. Graphismes : packs « Factory Kit », « Conveyor Kit », « Car Kit », « Mini Characters » et « Tower Defense Kit » de Kenney (kenney.nl), licence CC0.": "Orders of magnitude inspired by the INRS (logistics jobs), the CRAMIF and professional guides on warehouse KPIs and automation. Graphics: “Factory Kit”, “Conveyor Kit”, “Car Kit”, “Mini Characters” and “Tower Defense Kit” packs by Kenney (kenney.nl), CC0 license.", "Les manutentions manuelles sont la <b>première cause d’accidents</b> en logistique, et les troubles musculo-squelettiques la première maladie professionnelle (INRS). Prévention : aides à la manutention, articles lourds à mi-hauteur, rotation des postes, formation gestes et postures, pauses.": "Manual handling is the <b>leading cause of accidents</b> in logistics, and musculoskeletal disorders are the leading occupational disease (INRS). Prevention: handling aids, heavy items at mid-height, job rotation, manual handling training, breaks.", " jours de salaire d’indemnités s’il faut s’en séparer — mais il progresse et reste. <b>Intérim</b> : plus cher à la journée, sans engagement ; réservé pour la semaine au planning (×1,35) ou en urgence aujourd’hui (×1,6, pas garanti). Un bon intérimaire peut passer en CDI après 3 jours.": " days’ salary in severance if you have to let them go — but they improve and stay. <b>Temp work</b>: more expensive per day, no commitment; booked for the week in the schedule (×1.35) or as an emergency today (×1.6, not guaranteed). A good temp worker can move to a permanent contract after 3 days.", "Environ 20 % des articles font 80 % des ventes (classe A), les suivants jusqu’à 95 % (B), le reste (C). Placer les A près de l’emballage et à hauteur d’homme (la « zone d’or ») réduit les déplacements de <b>15 à 30 %</b>. À refaire régulièrement : les ventes changent avec les saisons.": "About 20% of items make 80% of sales (class A), the next ones up to 95% (B), the rest (C). Placing A items near packing and at waist-to-shoulder height (the “golden zone”) cuts travel by <b>15 to 30%</b>. Redo it regularly: sales change with the seasons.", "Le logiciel de gestion d’entrepôt connaît chaque adresse et chaque carton en temps réel, guide les rangements et propose les réapprovisionnements. Mais <b>il applique tes règles</b> : de mauvais seuils ou une mauvaise règle de rangement donnent de mauvais résultats, plus vite.": "The warehouse management software knows every address and every carton in real time, guides put-away and suggests replenishments. But <b>it applies your rules</b>: bad reorder points or a bad put-away rule give bad results, faster.", "Avec l’expérience seule, un salarié plafonne vite. La <b>formation</b> le fait progresser : plus rapide, moins d’erreurs, plus motivé. Un parcours (formation métier, CACES, chef d’équipe) fidélise aussi les meilleurs, et coûte moins cher qu’un recrutement.": "With experience alone, an employee quickly plateaus. <b>Training</b> helps them progress: faster, fewer errors, more motivated. A career path (job training, CACES, team leader) also retains the best people, and costs less than a recruitment.", "Un écart apparaît à chaque erreur de rangement, casse non déclarée ou erreur de prélèvement. Objectif : <b>plus de 98 à 99 % de précision</b>. L’<b>inventaire tournant</b> recompte un peu chaque jour au lieu de fermer l’entrepôt pour un inventaire complet.": "A discrepancy appears with every put-away error, unreported breakage or picking error. Target: <b>over 98 to 99% accuracy</b>. A <b>cycle count</b> recounts a little every day instead of closing the warehouse for a full stocktake.", "Le stock de <b>prélèvement</b> est au sol ou à hauteur d’homme ; la <b>réserve</b> est en hauteur, accessible au chariot élévateur. Le <b>réapprovisionnement</b> descend la réserve avant que l’emplacement de picking soit vide, sinon le préparateur attend.": "<b>Picking</b> stock sits on the floor or at waist height; the <b>reserve</b> is up high, reachable by forklift. <b>Replenishment</b> brings reserve stock down before the picking location runs empty, otherwise the picker waits.", "Stocker coûte cher : en moyenne <b>20 à 25 % de la valeur du stock par an</b> (argent immobilisé, assurance, place, casse, obsolescence). Trop de stock vide la trésorerie ; pas assez provoque des ruptures. Dans le jeu : 0,2 % de la valeur par jour.": "Holding stock is expensive: on average <b>20 to 25% of stock value per year</b> (tied-up cash, insurance, space, breakage, obsolescence). Too much stock drains cash; too little causes stockouts. In the game: 0.2% of the value per day.", "Quand on commande en réaction aux ruptures (« vite, commandons le double ! »), les variations s’amplifient chez le fournisseur : c’est l’<b>effet coup de fouet</b> du célèbre Beer Game. Mieux vaut des règles stables, basées sur la vraie demande.": "When you order in reaction to stockouts (“quick, let’s order double!”), the swings get amplified at the supplier: that’s the <b>bullwhip effect</b> of the famous Beer Game. Stable rules based on real demand are better.", "La demande varie d’une semaine à l’autre. La prévision part de l’historique et des tendances, mais elle est toujours un peu fausse : c’est pour ça qu’on garde un stock de sécurité, et qu’on <b>revoit ses seuils quand la saison change</b>.": "Demand varies from week to week. The forecast starts from history and trends, but it’s always a bit wrong: that’s why you keep safety stock, and <b>review your reorder points when the season changes</b>.", "Absentéisme = jours d’absence ÷ jours de travail prévus. Le moral, la pénibilité, les horaires décalés et la reconnaissance pèsent directement dessus. Un départ coûte un recrutement, une formation et des semaines de productivité réduite.": "Absenteeism = days absent ÷ scheduled working days. Morale, physical strain, unsocial hours and recognition weigh directly on it. A departure costs a recruitment, training and weeks of reduced productivity.", "Conduire un chariot élévateur demande une formation <b>CACES R489</b> et une autorisation de conduite de l’employeur. Les racks se contrôlent régulièrement : un montant heurté doit être signalé et réparé, sinon la structure peut céder.": "Driving a forklift requires <b>CACES R489</b> training and a driving authorization from the employer. Racks are inspected regularly: a damaged upright must be reported and repaired, or the structure may give way.", "On contrôle chaque livraison avant de signer. Une anomalie se note sur le bon de livraison avec des <b>réserves précises</b> (« 6 cartons écrasés »), puis se confirme au transporteur. Sans réserve, le recours devient très difficile.": "Every delivery is checked before signing. An anomaly is noted on the delivery note with <b>specific reservations</b> (“6 crushed cartons”), then confirmed to the carrier. Without reservations, a claim becomes very difficult.", "Réception → stockage → préparation (le « picking ») → emballage → expédition. La préparation pèse 50 à 70 % des coûts d’exploitation d’un entrepôt e-commerce, surtout à cause des déplacements : c’est là que se gagne la productivité.": "Receiving → storage → order preparation (“picking”) → packing → shipping. Picking accounts for 50 to 70% of an e-commerce warehouse’s operating costs, mostly because of travel: that’s where productivity is won.", "Mais attention : un robot coûte cher, il faut d’abord l’intégrer au système, et il met quelques jours à atteindre son plein rendement. Il ne se fatigue pas… mais il tombe en panne. Calculez bien votre retour sur investissement.": "But watch out: a robot is expensive, it first has to be integrated into the system, and it takes a few days to reach full output. It doesn’t get tired… but it breaks down. Work out your return on investment carefully.", "Stock en temps réel, scan des emplacements (3 fois moins d’erreurs de rangement) et commandes fournisseurs automatiques selon TES seuils. Deux jours d’apprentissage après l’installation (−15 % de productivité).": "Real-time stock, location scanning (3 times fewer put-away errors) and automatic supplier orders based on YOUR reorder points. Two days of learning after installation (−15% productivity).", "Les articles ne se vendent pas tous autant : un même seuil pour toute la gamme fait des ruptures sur les meilleures ventes et du stock qui dort sur les autres. <button class=\"btn sm\" data-act=\"rpsug\" data-c=\"": "Not all items sell equally: a single reorder point for the whole range causes stockouts on best-sellers and idle stock on the others. <button class=\"btn sm\" data-act=\"rpsug\" data-c=\"", "Le camion a déposé des palettes en <b>réception</b> (zone bleue, au fond à gauche). Va prendre des cartons avec le <b>bouton d’action</b>. Chaque couleur d’étiquette correspond à une gamme (ici : Librairie).": "The truck has dropped pallets in <b>receiving</b> (blue zone, back left). Go pick up cartons with the <b>action button</b>. Each label color matches a product range (here: Books).", "Enfin, avec une chargée de communication, vous pourrez lancer les grands événements : soldes, Black Friday, Noël. Objectifs : 14 gammes, 6 robots, un événement réussi, moins de 1,5 % d’erreurs et 80 000 €.": "Finally, with a communications officer, you’ll be able to launch big events: sales, Black Friday, Christmas. Goals: 14 ranges, 6 robots, one successful event, under 1.5% errors and €80,000.", "On compare aux heures disponibles (effectif × durée × rendement, moins les absences). L’intérim réservé à l’avance coûte moins cher et arrive formé ; l’intérim du jour même coûte plus et n’est pas garanti.": "It’s compared with available hours (headcount × duration × efficiency, minus absences). Temps booked in advance cost less and arrive trained; same-day temps cost more and aren’t guaranteed.", "4 étoiles de satisfaction ! Le siège a de grands projets pour vous. Lancez les 8 gammes, gardez 4,3 ★, visez 15 000 € de trésorerie… et tenez une vraie semaine : 92 % de service, moins de 8 % de ruptures.": "4-star satisfaction! Head office has big plans for you. Launch all 8 ranges, keep 4.3 ★, aim for €15,000 in cash… and hold up for a real week: 92% service level, under 8% stockouts.", "Nouveaux défis : des produits frais à garder au froid, des équipes à ménager, des absences imprévues. Objectifs : 10 gammes, 4,3 ★, 20 000 €, et une semaine à plus de 90 % de service avec peu de ruptures.": "New challenges: fresh products to keep cold, teams to look after, unexpected absences. Goals: 10 ranges, 4.3 ★, €20,000, and a week above 90% service level with few stockouts.", "Installés de nuit. 3 niveaux par emplacement : bas et milieu pour le picking, haut en réserve (chariot élévateur et CACES). Débloque les caristes. À faire contrôler : un montant heurté doit être réparé.": "Installed overnight. 3 levels per location: bottom and middle for picking, top for reserve (forklift and CACES). Unlocks forklift drivers. Get them inspected: a damaged upright must be repaired.", "Il manque des bras ? <b>Réserve des intérimaires</b> pour la semaine (moins cher et garanti), ou prévois des <b>heures supplémentaires</b> (plus de fatigue et d’accidents). Planning : Bureau › Équipe.": "Short of hands? <b>Book temp workers</b> for the week (cheaper and guaranteed), or plan <b>overtime</b> (more fatigue and accidents). Schedule: Office › Team.", "(On Time In Full) = commandes livrées à l’heure, complètes et sans erreur ÷ commandes à servir. C’est l’indicateur que le client regarde en premier. Une commande annulée ou fausse compte comme ratée.": "(On Time In Full) = orders delivered on time, complete and error-free ÷ orders due. It’s the KPI the customer looks at first. A cancelled or wrong order counts as failed.", "Une commande arrive (en haut à droite) ! <b>Prélève</b> l’article demandé : tu le sors de son carton et le mets dans un bac gris. Un point d’exclamation jaune indique l’emplacement où il se trouve.": "An order has arrived (top right)! <b>Pick</b> the requested item: take it out of its carton and put it in a grey tote. A yellow exclamation mark shows the location where it is.", "Exemple : un article se vend 6 fois par jour, le fournisseur livre en une demi-journée → 3 unités consommées pendant l’attente. Si tu recommandes sous 3, tu tombes en rupture avant la livraison.": "Example: an item sells 6 times a day, the supplier delivers in half a day → 3 units consumed during the wait. If you reorder below 3, you run out before the delivery.", "Chaque emplacement a maintenant <b>3 niveaux</b> : bas et milieu pour le <b>picking</b>, à portée de main, et le <b>haut</b> qui sert de <b>réserve</b>. Seul un chariot élévateur l’atteint.": "Each location now has <b>3 levels</b>: bottom and middle for <b>picking</b>, within reach, and the <b>top</b> one used as <b>reserve</b>. Only a forklift can reach it.", "Pour les ménager : une <b>salle de pause</b> (Améliorer), des <b>primes</b> et des <b>formations</b> (Équipe), et des plannings équilibrés. Les équipes du soir pèsent un peu sur le moral.": "To look after them: a <b>break room</b> (Upgrade), <b>bonuses</b> and <b>training</b> (Team), and balanced schedules. Evening shifts weigh a little on morale.", ", avec z = 1,28 pour 90 % de service, 1,65 pour 95 %, 2,33 pour 99 %. Les derniers points de service coûtent beaucoup de stock : 99 % demande presque deux fois plus de sécurité que 90 %.": ", with z = 1.28 for 90% service, 1.65 for 95%, 2.33 for 99%. The last points of service level cost a lot of stock: 99% needs almost twice as much safety stock as 90%.", "Ici, tout part par <b>vaisseau</b>. Il décolle toutes les 3 heures : chaque commande indique sa fenêtre de lancement. Charge les colis dans les <b>sas</b> (zone verte) avant son départ.": "Here, everything leaves by <b>spaceship</b>. It launches every 3 hours: each order shows its launch window. Load the parcels into the <b>airlocks</b> (green zone) before it departs.", "La prévention paie : <b>formation gestes et postures</b>, <b>aides à la manutention</b>, <b>rotation des postes</b>, pauses. Fatigue et heures sup font grimper les accidents du travail.": "Prevention pays: <b>manual handling training</b>, <b>handling aids</b>, <b>job rotation</b>, breaks. Fatigue and overtime drive up workplace accidents.", "Dans le bureau, onglet <b>Stock</b>, choisis le fournisseur de chaque gamme : <b>Standard</b> (prochain créneau), <b>Express</b> (+25 %, 1 h) ou <b>Import</b> (−30 %, par conteneur).": "In the office, <b>Stock</b> tab, choose each range’s supplier: <b>Standard</b> (next slot), <b>Express</b> (+25%, 1 h) or <b>Import</b> (−30%, by container).", "Deux jours d’apprentissage : l’équipe est un peu plus lente le temps de prendre le scanner en main. Le module <b>ABC</b> (Améliorer) range les meilleures ventes près de l’emballage.": "Two days of learning: the team is a bit slower while getting used to the scanner. The <b>ABC</b> module (Upgrade) stores the best-sellers near packing.", "Trois nouveautés. Un : vous pouvez choisir vos fournisseurs. L’import maritime coûte 30 % moins cher, mais arrive en conteneur, au rythme des navires… et la douane peut en bloquer.": "Three new things. One: you can choose your suppliers. Sea import costs 30% less, but arrives by container, at the pace of the ships… and customs can hold some.", "Range ces cartons fournisseur dans un <b>emplacement de stockage</b> (zone jaune) : approche-toi et appuie sur Action. Chaque emplacement accueille une seule référence par niveau.": "Store these supplier cartons in a <b>storage location</b> (yellow zone): walk up and press Action. Each location holds a single SKU per level.", "Ton WMS est en service. Il passe les commandes fournisseurs tout seul… <b>selon les seuils que tu as réglés</b>. Trop bas : ruptures. Trop hauts : du stock qui dort et qui coûte.": "Your WMS is up and running. It places supplier orders by itself… <b>based on the reorder points you set</b>. Too low: stockouts. Too high: idle stock that costs money.", "Ici l’entrepôt tourne de <b>6 h à minuit</b>, en trois équipes de 6 heures : <b>matin</b>, <b>après-midi</b> et <b>soir</b>. Chaque salarié ne travaille que pendant son équipe.": "Here the warehouse runs from <b>6 am to midnight</b>, in three 6-hour shifts: <b>morning</b>, <b>afternoon</b> and <b>evening</b>. Each employee only works during their shift.", "Bonjour ! Nadia, ressources humaines. Je m’occupe des absences et des intérimaires, et je garde un œil sur le moral de tout le monde. Vous, concentrez-vous sur l’organisation.": "Hello! Nadia, human resources. I handle absences and temp workers, and I keep an eye on everyone’s morale. You focus on the organization.", "Attention : votre fournisseur ne livre qu’à heures fixes, avec trois heures de délai. Réglez vos seuils de commande dans le Bureau, onglet Stock, avant de tomber en rupture.": "Careful: your supplier only delivers at fixed times, with a three-hour lead time. Set your reorder points in the Office, Stock tab, before you run out.", "La chambre froide (en bas à droite) accueille les gammes <b>Frais</b> (étiquette verte claire) et <b>Surgelés</b> (bleu clair). Lance la gamme Frais au bureau, onglet Stock.": "The cold room (bottom right) holds the <b>Fresh food</b> (light green label) and <b>Frozen food</b> (light blue) ranges. Launch the Fresh food range in the office, Stock tab.", "Les préparateurs à pied ne prennent qu’en bas et au milieu. Quand le bas se vide, descends la réserve : bouton <b>« Réapprovisionner »</b>, mains vides devant l’emplacement.": "Pickers on foot only take from the bottom and middle. When the bottom runs empty, bring down the reserve: <b>“Replenish”</b> button, empty-handed in front of the location.", "Chaque matin, quelqu’un peut manquer à l’appel. Un <b>intérimaire</b> le remplace pour la journée, plus cher et moins rapide. Sinon, c’est toi qui compenses sur le terrain.": "Every morning, someone may not show up. A <b>temp worker</b> replaces them for the day, more expensive and slower. Otherwise, you make up for it on the floor.", "Chaque vendredi, après le bilan, tu prépares la semaine suivante : la prévision des ventes donne la <b>charge</b> en heures, à comparer à la <b>capacité</b> de tes équipes.": "Every Friday, after the review, you prepare the following week: the sales forecast gives the <b>workload</b> in hours, to compare with your teams’ <b>capacity</b>.", "Les écarts viennent surtout des erreurs de rangement. Le <b>WMS</b> (scan) les réduit beaucoup, et l’<b>inventaire tournant</b> (Bureau › Stock) remet les compteurs à jour.": "Discrepancies come mostly from put-away errors. The <b>WMS</b> (scanning) greatly reduces them, and a <b>cycle count</b> (Office › Stock) brings the counters back up to date.", "Chaque vendredi, vous préparerez le planning de la semaine suivante. Et surveillez la santé des équipes : en logistique, les accidents et le mal de dos coûtent très cher.": "Every Friday, you’ll prepare the following week’s schedule. And watch your teams’ health: in logistics, accidents and back pain are very costly.", "Chaque salarié a une jauge de <b>pénibilité</b>. Porter, se pencher, répéter les mêmes gestes : à 100 %, c’est l’arrêt maladie pour TMS (troubles musculo-squelettiques).": "Each employee has a <b>physical strain</b> gauge. Carrying, bending, repeating the same movements: at 100%, it’s sick leave for MSD (musculoskeletal disorders).", "Avec le <b>bureau agrandi</b>, tu pourras recruter une <b>responsable RH</b> : elle appelle les intérimaires toute seule, moins cher, et soigne le moral de l’équipe.": "With the <b>expanded office</b>, you’ll be able to hire an <b>HR manager</b>: she calls in temp workers by herself, at a lower cost, and looks after the team’s morale.", "J’aime cet état d’esprit. Mais un bon chef d’entrepôt, ça se mesure : chaque vendredi soir, je regarderai vos indicateurs. Taux de service, erreurs, stock, résultat.": "I like that attitude. But a good warehouse manager is measured: every Friday evening, I’ll look at your KPIs. Service level, errors, stock, results.", "Je ne vais pas vous mentir : il est vide, et il n’y a que vous. Mais les commandes en ligne explosent, et je veux faire de ce site notre meilleur centre logistique.": "I won’t lie to you: it’s empty, and there’s only you. But online orders are booming, and I want to make this site our best logistics center.", "Un robot peut tomber en <b>panne</b> : un panneau rouge apparaît au-dessus. Va le <b>réparer</b> (bouton d’action), ou recrute un <b>technicien de maintenance</b>.": "A robot can <b>break down</b>: a red sign appears above it. Go and <b>repair</b> it (action button), or hire a <b>maintenance technician</b>.", "Va devant le camion et appuie sur <b>Décharger</b>, puis pose les cartons sur une palette de réception ou range-les directement. Tes réceptionnaires le font aussi.": "Go in front of the truck and press <b>Unload</b>, then put the cartons on a receiving pallet or store them directly. Your receiving clerks do it too.", "Ton fournisseur livre à heures fixes : <b>9 h, 12 h et 15 h</b>, avec 3 h de délai minimum. Si tu attends la rupture pour commander, tes clients attendront aussi.": "Your supplier delivers at fixed times: <b>9 am, 12 pm and 3 pm</b>, with a 3 h minimum lead time. If you wait for a stockout to order, your customers will wait too.", "Trois vols partent chaque jour : <b>10 h, 15 h et 20 h</b>. Les commandes <b>express</b> (étiquette ✈) rapportent 60 % de plus, mais doivent partir avec leur vol.": "Three flights leave every day: <b>10 am, 3 pm and 8 pm</b>. <b>Express</b> orders (✈ label) earn 60% more, but must leave on their flight.", "Un préparateur a trouvé un emplacement vide alors que le système indiquait du stock : c’est un <b>écart d’inventaire</b>. Il perd du temps et le carton est perdu.": "A picker found an empty location while the system showed stock: that’s an <b>inventory discrepancy</b>. They waste time and the carton is lost.", "Un salarié se fatigue en travaillant : sous 50 % d’énergie, il ralentit. Un moral bas le ralentit aussi, augmente les absences… et peut le pousser à démissionner.": "An employee gets tired as they work: below 50% energy, they slow down. Low morale slows them down too, increases absences… and can push them to quit.", "Ici, on tourne de 6 h à minuit, en trois équipes : matin, après-midi et soir. Vous ne pourrez pas tout faire vous-même. Votre vrai métier devient l’organisation.": "Here, we run from 6 am to midnight, in three shifts: morning, afternoon and evening. You won’t be able to do everything yourself. Your real job becomes organization.", "Ici, pas de camion : un vaisseau cargo s’amarre toutes les 3 heures, pendant une fenêtre de lancement. Tous les colis doivent être dans les sas avant son départ.": "No truck here: a cargo ship docks every 3 hours, during a launch window. All parcels must be in the airlocks before it departs.", "Ouvre le <b>Bureau › Stock</b> : pour chaque gamme, règle un <b>seuil de commande</b> et une <b>quantité</b>. Le bouton « Appliquer » reprend le conseil calculé.": "Open the <b>Office › Stock</b>: for each range, set a <b>reorder point</b> and a <b>quantity</b>. The “Apply” button uses the calculated recommendation.", "Parfois, la <b>douane</b> retient un conteneur pendant 3 heures. Tu peux payer 150 € pour le libérer tout de suite, ou prendre un <b>transitaire</b> (Améliorer).": "Sometimes <b>customs</b> holds a container for 3 hours. You can pay €150 to release it right away, or hire a <b>customs broker</b> (Upgrade).", "Un camion fournisseur est à quai (devant la réception). Le chauffeur décharge seul, mais lentement : au-delà d’une heure à quai, l’attente est facturée (30 €/h).": "A supplier truck is at the dock (in front of receiving). The driver unloads alone, but slowly: beyond one hour at the dock, waiting time is charged (€30/h).", "Au début de chaque poste, un <b>point d’équipe</b> de 5 minutes devant le tableau : objectifs, sécurité, priorités. L’équipe démarre plus vite et plus motivée.": "At the start of each shift, a 5-minute <b>team huddle</b> in front of the board: goals, safety, priorities. The team gets going faster and more motivated.", "Ton bureau s’agrandit : un poste de <b>responsable RH</b> est disponible (Bureau › Équipe). Elle gère les absences et fait monter le moral de tous chaque jour.": "Your office is expanding: an <b>HR manager</b> position is available (Office › Team). She handles absences and lifts everyone’s morale every day.", "Un client a reçu un mauvais article : retour, renvoi, satisfaction en baisse. Les intérimaires et les salariés fatigués ou peu formés se trompent plus souvent.": "A customer received the wrong item: return, reshipment, satisfaction down. Temp workers and tired or poorly trained employees make mistakes more often.", "Va à la <b>zone de recharge</b> (marquée au sol) et appuie sur <b>Contrôler mon chariot</b>. Tes caristes y font leur contrôle et y rechargent leurs batteries.": "Go to the <b>charging area</b> (marked on the floor) and press <b>Inspect my forklift</b>. Your forklift drivers do their inspection and charge their batteries there.", "Le logiciel qui pilote robots et machines. Indispensable avant d’acheter un robot ou un tri automatique (l’intégration coûte souvent autant que les machines).": "The software that runs robots and machines. Essential before buying a robot or an automatic sorter (integration often costs as much as the machines).", "Pour les petites commandes du coin, vous aurez une flotte de drones : livraison en 20 minutes. Et un stockage vertical automatisé, si vous en avez les moyens.": "For small local orders, you’ll have a fleet of drones: delivery in 20 minutes. And automated vertical storage, if you can afford it.", ". Une erreur coûte un retour, un renvoi et la confiance du client. Remèdes : contrôle au poste d’emballage, scan des codes-barres, pick-to-light, formation.": ". An error costs a return, a reshipment and the customer’s trust. Remedies: checks at the packing station, barcode scanning, pick-to-light, training.", "Deux dangers : l’apesanteur, qui fait flotter les cartons mal arrimés, et l’oxygène. Plus l’équipage est nombreux, plus il en consomme. Surveillez la jauge.": "Two dangers: zero gravity, which makes poorly secured cartons float, and oxygen. The bigger the crew, the more it consumes. Watch the gauge.", "Margaux peut programmer un <b>événement</b> pour le lendemain (bureau, onglet Commandes) : soldes, Black Friday ou Noël. Les commandes explosent ce jour-là.": "Margaux can schedule an <b>event</b> for the next day (office, Orders tab): sales, Black Friday or Christmas. Orders explode that day.", "Des cartons se sont détachés et <b>flottent</b> dans l’allée. Rattrape-les avant 2 heures, sinon ils sont perdus. Tes réceptionnaires s’en chargent aussi.": "Some cartons have come loose and are <b>floating</b> in the aisle. Catch them within 2 hours, or they’re lost. Your receiving clerks handle it too.", "Chaque <b>vendredi soir</b>, Mme Laurent fait le bilan de la semaine : taux de service, ruptures, erreurs, précision du stock et résultat d’exploitation.": "Every <b>Friday evening</b>, Ms Laurent reviews the week: service level, stockouts, errors, stock accuracy and operating result.", "Margaux, communication. Donnez-moi un jour de préparation, et je vous remplis les carnets de commandes. Soldes, Black Friday ou Noël : à vous de choisir.": "Margaux, communications. Give me one day of preparation, and I’ll fill your order books. Sales, Black Friday or Christmas: your choice.", ") : il prélève jour et nuit, sans salaire. Montée en charge : 50 % le premier jour, plein rendement en 5 jours. Maintenance 25 €/jour, énergie, pannes.": "): it picks day and night, without a salary. Ramp-up: 50% on the first day, full output in 5 days. Maintenance €25/day, energy, breakdowns.", "Le hub tourne comme une horloge. Le siège a une nouvelle idée : un centre entièrement automatisé, près de Paris. Vous êtes la personne qu’il nous faut.": "The hub runs like clockwork. Head office has a new idea: a fully automated center, near Paris. You’re the person we need.", "Le soir, les commandes en ligne sont plus nombreuses : recrute au moins une personne dans l’<b>équipe du soir</b> (prime de soirée : +25 % de salaire).": "In the evening, there are more online orders: hire at least one person for the <b>evening shift</b> (evening bonus: +25% salary).", "Un chauffeur ne prend jamais une palette qui n’est pas <b>filmée</b> (sinon les colis tombent). Mains vides, devant le quai : <b>Filmer la palette</b>.": "A driver never takes a pallet that isn’t <b>stretch-wrapped</b> (otherwise parcels fall off). Empty-handed, in front of the dock: <b>Wrap the pallet</b>.", "Marco, cariste. Je m’occupe de la réserve en hauteur et je descends le stock quand les niveaux bas se vident. Vos préparateurs ne manqueront de rien.": "Marco, forklift driver. I look after the high reserve and bring stock down when the low levels empty. Your pickers won’t run short of anything.", "Trois vols par jour : 10 h, 15 h et 20 h. Les colis express, marqués d’un avion, doivent être chargés dans les conteneurs aériens avant le décollage.": "Three flights a day: 10 am, 3 pm and 8 pm. Express parcels, marked with a plane, must be loaded into the air containers before takeoff.", "Puis appuie sur <b>« Commander les articles sous le seuil »</b>. Avec un WMS, ces commandes partiront toutes seules, mais toujours selon TES seuils.": "Then press <b>“Order items below reorder point”</b>. With a WMS, these orders will go out automatically, but always based on YOUR reorder points.", "du prix, et il n’atteint son plein rendement qu’après plusieurs semaines (40 à 60 % le premier mois). La maintenance coûte 10 à 15 % du prix par an.": "of the price, and it only reaches full output after several weeks (40 to 60% in the first month). Maintenance costs 10 to 15% of the price per year.", "Hors du froid, un produit frais s’abîme en <b>2 heures</b> sur une palette, et en 1 h 30 si on le transporte. Range-le vite dans la chambre froide.": "Out of the cold, a fresh product spoils in <b>2 hours</b> on a pallet, and in 1 h 30 if it’s being carried. Store it quickly in the cold room.", "Les <b>fiches du manager</b> (Bureau › Pilotage) expliquent les formules : point de commande, stock de sécurité… Elles se débloquent au fil du jeu.": "The <b>manager’s cards</b> (Office › Dashboard) explain the formulas: reorder point, safety stock… They unlock as the game goes on.", "Une commande standard arrive au premier créneau situé au moins 3 h plus tard. Prévois donc le stock nécessaire pendant ce délai : c’est le rôle du": "A standard order arrives at the first slot at least 3 h later. So plan the stock needed during that lead time: that’s the role of the", "Chaque colis est vérifié avant fermeture : 90 % des erreurs de préparation sont rattrapées, mais l’emballage prend environ 15 % de temps en plus.": "Every parcel is checked before closing: 90% of picking errors are caught, but packing takes about 15% longer.", "L’intérim réservé arrive chaque matin pour toute la semaine (×1,35 sur le salaire). En urgence, le jour même, il coûte ×1,6 et n’est pas garanti.": "Booked temps arrive every morning for the whole week (×1.35 on salary). In an emergency, on the same day, they cost ×1.6 and aren’t guaranteed.", "Un colis qui rate son vol attend le suivant et perd 30 % de sa valeur. Un vol complet (4 colis ou plus) parti sans retard compte pour l’objectif.": "A parcel that misses its flight waits for the next one and loses 30% of its value. A full flight (4 parcels or more) leaving on time counts toward the goal.", "Active le <b>contrôle qualité au poste d’emballage</b> (Bureau › Stock › Règles) : il rattrape 90 % des erreurs, mais l’emballage est plus lent.": "Turn on <b>quality control at the packing station</b> (Office › Stock › Rules): it catches 90% of errors, but packing is slower.", "Avant d’utiliser un chariot élévateur, on le contrôle chaque jour : freins, fourches, klaxon, fuites. C’est obligatoire, et ça évite les pannes.": "Before using a forklift, it’s inspected every day: brakes, forks, horn, leaks. It’s mandatory, and it prevents breakdowns.", "Chaque carton a une <b>date limite</b> : 3 jours pour le frais, 12 pour le surgelé. Commande juste ce qu’il faut, sinon il finira à la poubelle.": "Each carton has a <b>use-by date</b>: 3 days for fresh, 12 for frozen. Order just what you need, or it’ll end up in the bin.", "Les objectifs du palier se vérifient sur <b>une semaine complète</b> : accélérer le temps ne suffit pas. Suis-les dans <b>Bureau › Pilotage</b>.": "Tier goals are checked over <b>a full week</b>: speeding up time isn’t enough. Track them in <b>Office › Dashboard</b>.", "Des élévateurs automatiques servent tous les niveaux à hauteur d’homme : tout le monde accède au niveau haut, et chaque niveau gagne 6 cartons.": "Automatic lifts serve every level at waist height: everyone can reach the top level, and each level gains 6 cartons.", "Deux : les entreprises. Recrutez une commerciale, et elle décrochera des contrats B2B : des palettes entières à livrer avant une heure précise.": "Two: businesses. Hire a sales rep, and she’ll land B2B contracts: whole pallets to deliver before a set time.", "Lyon-Est est devenue la meilleure plateforme du réseau. Le siège prépare déjà la suite : un hub portuaire, avec des conteneurs du monde entier…": "Lyon-Est has become the best platform in the network. Head office is already preparing what’s next: a port hub, with containers from all over the world…", "Le goulot d’étranglement est l’étape où les commandes s’accumulent : c’est là qu’il faut ajouter des bras, un poste ou changer l’organisation.": "The bottleneck is the step where orders pile up: that’s where you need to add hands, a workstation or change the organization.", "Paris-Sud, 5 h 55. Un hangar blanc immaculé, un sol bleu, et un léger bourdonnement électrique. Les robots attendent leurs premières missions.": "Paris-Sud, 5:55 am. A spotless white hangar, a blue floor, and a faint electric hum. The robots are waiting for their first missions.", "Ton premier <b>robot préparateur</b> est en service. Il travaille jour et nuit, sans salaire, mais il consomme de l’énergie (charges du soir).": "Your first <b>picking robot</b> is in service. It works day and night, without a salary, but it uses energy (evening costs).", "Les articles les plus vendus (classe A) sont rangés près de l’emballage, les moins vendus (C) au fond. Moins de marche pour les préparateurs.": "The best-selling items (class A) are stored near packing, the slowest sellers (C) at the back. Less walking for the pickers.", "Rassemble les articles sur la <b>palette B2B</b> (zone orange, près de l’emballage). Tes préparateurs aident quand ils n’ont pas de commande.": "Gather the items on the <b>B2B pallet</b> (orange zone, near packing). Your pickers help when they have no order.", "Tu peux aussi <b>parler à chaque opérateur</b> : approche-toi, mains vides. Ils te disent comment ils vont… et ce qui coince sur le terrain.": "You can also <b>talk to each operator</b>: walk up, empty-handed. They tell you how they’re doing… and what’s getting stuck on the floor.", "Un chariot élévateur et ta formation CACES R489 (obligatoire pour le conduire) : 12 cartons, plus rapide, et accès au niveau haut des racks.": "A forklift and your CACES R489 training (mandatory to drive it): 12 cartons, faster, and access to the top level of the racks.", "Aujourd’hui, vous dirigez la logistique de Colibox de la Terre jusqu’aux étoiles. Le conseil d’administration vous nomme directeur général.": "Today, you run Colibox’s logistics from Earth to the stars. The board of directors appoints you CEO.", "Bonne nouvelle : tu peux maintenant recruter des <b>caristes</b> (Bureau › Équipe). Ils rangent en réserve et réapprovisionnent tout seuls.": "Good news: you can now hire <b>forklift drivers</b> (Office › Team). They store in reserve and replenish on their own.", "Charge les colis express dans les <b>conteneurs aériens</b> (zone rouge du quai). Le convoyeur et le tri automatique savent aussi le faire.": "Load express parcels into the <b>air containers</b> (red zone of the dock). The conveyor and the automatic sorter can do it too.", "La chambre froide est prête. Le frais rapporte peu par article, mais les clients en commandent tous les jours. Attention aux dates limites.": "The cold room is ready. Fresh food earns little per item, but customers order it every day. Watch the use-by dates.", "À gauche, les <b>baies à conteneurs</b>. Toutes les 4 heures, un navire y dépose les conteneurs de tes commandes en <b>import maritime</b>.": "On the left, the <b>container bays</b>. Every 4 hours, a ship drops off the containers for your <b>sea import</b> orders.", "Dernière étape : le <b>bureau</b> (à gauche, ou le bouton « Bureau » en haut) sert à commander du stock, recruter et améliorer l’entrepôt.": "Last step: the <b>office</b> (on the left, or the “Office” button at the top) is used to order stock, hire staff and upgrade the warehouse.", "Chef, la réception déborde : le camion attend et le stock n’arrive plus en rayon. Il nous faut un réceptionnaire de plus, ou un cariste.": "Boss, receiving is overflowing: the truck is waiting and stock isn’t reaching the shelves anymore. We need one more receiving clerk, or a forklift driver.", "Cinq minutes debout devant le tableau : chacun sait quoi faire, et l’équipe démarre plus soudée (+5 % de rythme sur ce poste, moral +3).": "Five minutes standing in front of the board: everyone knows what to do, and the team starts more united (+5% pace on this shift, morale +3).", "Trois : négociez avec vos fournisseurs. Objectifs : 12 gammes, 8 contrats B2B livrés, 4,3 ★, 35 000 € et un stock fiable à plus de 97 %.": "Three: negotiate with your suppliers. Goals: 12 ranges, 8 B2B contracts delivered, 4.3 ★, €35,000 and stock over 97% accurate.", "Chef, je ne vais pas vous mentir, l’ambiance est tendue. On enchaîne sans souffler… Une salle de pause ou une prime, ça ferait du bien.": "Boss, I won’t lie to you, the mood is tense. We keep going without a breather… A break room or a bonus would do us good.", "Nouvelles gammes aussi : la pharmacie, avec un contrôle qualité à l’emballage, et le luxe, qui doit être rangé dans une cage sécurisée.": "New ranges too: pharmacy, with quality control at packing, and luxury, which must be stored in a secure cage.", "Prépare-toi : du stock en avance, toutes les équipes au complet. Moins de 15 % d’annulations, et l’événement est une réussite (+0,3 ★).": "Get ready: stock in advance, every shift fully staffed. Under 15% cancellations, and the event is a success (+0.3 ★).", "Les représentants du personnel demandent une hausse de salaire : « On tient la cadence, on veut que ça se voie sur la fiche de paie. »": "Staff representatives are asking for a pay rise: “We’re keeping up the pace, we want to see it on our payslips.”", "Palette complète : <b>filme-la</b> (ou laisse faire un expéditeur). Elle partira avec le prochain camion. Attention à l’heure limite !": "Pallet complete: <b>wrap it</b> (or let a shipping clerk do it). It’ll leave with the next truck. Watch the cut-off time!", "Tes drones livrent les petites commandes urgentes (une seule pièce, étiquette « drone ») en 20 minutes. Elles rapportent 30 % de plus.": "Your drones deliver small urgent orders (a single item, “drone” label) in 20 minutes. They earn 30% more.", "Titulaire du CACES R489, conduit un chariot élévateur : range en réserve (niveau haut) et réapprovisionne les emplacements de picking.": "Holds the CACES R489, drives a forklift: stores in reserve (top level) and replenishes the picking locations.", "Calcule pour chaque article un seuil et une quantité de commande à partir de ses ventes réelles et du niveau de service que tu vises.": "For each item, calculate a reorder point and an order quantity from its actual sales and the service level you’re aiming for.", "Chaque membre d’équipage consomme de l’oxygène. Sous 30 %, tout le monde ralentit et le moral chute. La jauge est en haut de l’écran.": "Each crew member consumes oxygen. Below 30%, everyone slows down and morale drops. The gauge is at the top of the screen.", "Range un carton tout en haut avec ton chariot : approche-toi d’un emplacement et range, le chariot remplit d’abord le bas puis monte.": "Store a carton at the very top with your forklift: walk up to a location and store; the forklift fills the bottom first, then goes up.", "démissionné. Un moral trop bas pendant plusieurs jours fait fuir les gens : pense aux pauses, aux primes et aux plannings équilibrés.": "quit. Morale that’s too low for several days drives people away: think of breaks, bonuses and balanced schedules.", "Achète des <b>cartouches</b> (onglet Améliorer) ou installe un <b>recycleur d’oxygène</b>. Au niveau 3, la station devient autonome.": "Buy <b>cartridges</b> (Upgrade tab) or install an <b>oxygen recycler</b>. At level 3, the station becomes self-sufficient.", "Apporte le bac au <b>poste d’emballage</b> (la machine à droite) : l’article y est mis dans un carton d’expédition, c’est ton colis.": "Bring the tote to the <b>packing station</b> (the machine on the right): the item is put into a shipping box there — that’s your parcel.", "Pose les colis marqués « drone » sur la <b>piste des drones</b> (en bas). Les drones décollent seuls, puis se rechargent 15 minutes.": "Put the parcels marked “drone” on the <b>drone pad</b> (at the bottom). Drones take off by themselves, then recharge for 15 minutes.", "Chef, une palette B2B doit partir dans moins de deux heures ! Si on la rate, le client paiera moins… et il ne nous rappellera pas.": "Boss, a B2B pallet has to leave in less than two hours! If we miss it, the client will pay less… and won’t call us back.", "Monte ton colis sur une <b>palette d’expédition</b> du quai (zone verte). Un camion part toutes les 30 minutes avec les palettes.": "Put your parcel on a <b>shipping pallet</b> at the dock (green zone). A truck leaves every 30 minutes with the pallets.", "Le chauffeur décharge une palette : 6 cartons sont écrasés, le film est déchiré. Il attend ta signature sur le bon de livraison.": "The driver unloads a pallet: 6 cartons are crushed, the wrap is torn. He’s waiting for your signature on the delivery note.", "Lyon-Est, 5 h 50. Trois quais, des semi-remorques qui manœuvrent, une chambre froide qui ronronne. Les néons s’allument un à un.": "Lyon-Est, 5:50 am. Three docks, semi-trailers maneuvering, a humming cold room. The neon lights come on one by one.", "Quand une équipe part, la suivante prend la relève. Pour finir le palier, il te faudra <b>3 équipes d’au moins 2 personnes</b>.": "When one shift leaves, the next takes over. To finish the tier, you’ll need <b>3 shifts of at least 2 people</b>.", "Zone artisanale de Valmont, 7 h 58. Un vieil entrepôt aux murs lavande, un parking vide… et une pancarte : « Colibox recrute ».": "Valmont business park, 7:58 am. An old warehouse with lavender walls, an empty parking lot… and a sign: “Colibox is hiring”.", ") est sous l’objectif : trop de commandes en retard ou annulées. Regarde où ça coince : réception, préparation ou emballage ?": ") is below target: too many late or cancelled orders. Look where things are getting stuck: receiving, picking or packing?", "Sofia, commerciale. J’ai déjà trois clients en tête : un hôtel, une mairie, un camping. Je vous envoie les offres au bureau !": "Sofia, sales. I already have three clients in mind: a hotel, a town hall, a campsite. I’ll send the offers to your office!", "Sofia va décrocher des <b>contrats B2B</b> : des commandes d’entreprises, à valider dans le bureau, onglet <b>Commandes</b>.": "Sofia will land <b>B2B contracts</b>: business orders, to approve in the office, <b>Orders</b> tab.", "Après plusieurs accidents, l’inspection du travail visite le site : formation, équipements, organisation… tout est vérifié.": "After several accidents, the labor inspectorate is visiting the site: training, equipment, organization… everything gets checked.", "La <b>maintenance préventive</b> divise les pannes par deux, et les <b>panneaux solaires</b> allègent la facture d’énergie.": "<b>Preventive maintenance</b> halves breakdowns, and <b>solar panels</b> lighten the energy bill.", "On y est. La première station logistique en orbite. Colibox livre désormais la Lune, Mars… et tous ceux qui vivent là-haut.": "Here we are. The first logistics station in orbit. Colibox now delivers to the Moon, Mars… and everyone living up there.", "Un trieur envoie chaque colis directement à sa bonne destination (quai, avion, piste des drones), plus besoin d’expéditeur.": "A sorter sends each parcel straight to its destination (dock, plane, drone pad), no shipping clerk needed.", "Cent trente lancements parfaits plus tard, le dernier vaisseau de la journée s’éloigne vers Mars dans un éclat de lumière.": "One hundred and thirty perfect launches later, the day’s last ship heads off toward Mars in a burst of light.", "Contrôle douanier sur ce conteneur. Il restera fermé quelques heures… à moins que vous ne régliez les frais tout de suite.": "Customs inspection on this container. It’ll stay sealed for a few hours… unless you pay the fees right away.", "Le siège vient de me nommer directrice nationale. Et j’ai besoin de vous à Lyon-Est : notre nouvelle plateforme régionale.": "Head office has just appointed me national director. And I need you at Lyon-Est: our new regional platform.", "La gamme <b>Luxe</b> se range uniquement dans la <b>cage sécurisée</b> (à gauche). Équipe-la au bureau avant de l’ouvrir.": "The <b>Luxury</b> range is stored only in the <b>secure cage</b> (on the left). Equip it in the office before opening it.", "Premier colis livré ! Nos clients adorent les livraisons rapides : chaque colis à l’heure fait monter votre satisfaction.": "First parcel delivered! Our customers love fast deliveries: every parcel on time raises your satisfaction.", "Roissy, zone cargo, 5 h 30. Le grondement des réacteurs couvre tout. Sur le tarmac, un avion-cargo attend, soute ouverte.": "Roissy, cargo zone, 5:30 am. The roar of jet engines drowns everything out. On the tarmac, a cargo plane waits, hold open.", "Des emplacements de picking sont vides alors qu’il reste du stock en réserve. Il faudrait descendre la réserve plus tôt.": "Picking locations are empty while there’s still stock in reserve. The reserve should be brought down sooner.", "Fos-sur-Mer, 5 h 45. L’odeur de sel, le cri des mouettes, et un porte-conteneurs qui manœuvre lentement le long du quai.": "Fos-sur-Mer, 5:45 am. The smell of salt, the cry of gulls, and a container ship slowly maneuvering along the quay.", "Voici le centre le plus moderne de Colibox. Ici, vous pourrez tout automatiser : préparation, réception, emballage, tri.": "This is Colibox’s most modern center. Here, you can automate everything: picking, receiving, packing, sorting.", "des lignes de commande sont arrivées sans stock. Revois tes seuils de commande : délai fournisseur et stock de sécurité.": "of order lines arrived without stock. Review your reorder points: supplier lead time and safety stock.", "Les palettes d’expédition pleines sont filmées automatiquement, et toutes les palettes juste avant le départ du camion.": "Full shipping pallets are wrapped automatically, and all pallets just before the truck leaves.", "Parfait ! Vous avez fait tout le circuit d’une commande. À partir de maintenant, les clients vont commander en continu.": "Perfect! You’ve done the whole circuit of an order. From now on, customers will order continuously.", "Quand un conteneur arrive, va le <b>dépoter</b> : approche-toi de sa porte et prends les cartons comme sur une palette.": "When a container arrives, go and <b>unstuff</b> it: walk up to its door and take the cartons as from a pallet.", "Sans WMS, c’est toi qui déclenches les commandes : bouton « Commander les articles sous le seuil » dans chaque gamme.": "Without a WMS, you trigger the orders: “Order items below reorder point” button in each range.", ": recrutement coûteux (annonces, entretiens), arrive dans 2 jours, payé même les jours calmes et pendant ses arrêts,": ": costly recruitment (ads, interviews), arrives in 2 days, paid even on quiet days and during sick leave,", "Chef… on a dû jeter des produits frais. Il faut les ranger au froid plus vite, et ne pas trop en commander d’avance.": "Boss… we had to throw away fresh products. They need to go into the cold faster, and we shouldn’t order too much in advance.", "Un gros client annonce un audit demain : il vérifiera tes erreurs de préparation et la propreté (5S) de l’entrepôt.": "A big client announces an audit tomorrow: they’ll check your picking errors and the warehouse’s tidiness (5S).", "Une vraie équipe du soir ! C’est là que les clients commandent le plus : vous allez le sentir dans la satisfaction.": "A real evening shift! That’s when customers order the most: you’ll feel it in satisfaction.", "Pour le faire baisser : moins de déplacements (ABC), moins d’attentes (réappro, flux équilibrés), moins d’erreurs.": "To bring it down: less travel (ABC), less waiting (replenishment, balanced flows), fewer errors.", "On tombe souvent sur des emplacements vides alors que l’écran dit qu’il y a du stock. Un inventaire serait utile.": "We keep finding empty locations even though the screen says there’s stock. A stock count would help.", "Les premiers colis de Lyon-Est sont partis ! Les semi-remorques passent toutes les 15 minutes, on a de la marge.": "Lyon-Est’s first parcels have left! The semi-trailers come by every 15 minutes, we have some slack.", "Chef, il y a des cartons qui volent dans l’allée ! Je les attrape, mais il faudrait vraiment arrimer ces racks.": "Boss, there are cartons flying in the aisle! I’m catching them, but we really need to secure these racks.", "Je me souviens de vous, seul dans ce petit entrepôt lavande de Valmont, avec un transpalette et trois palettes.": "I remember you, alone in that little lavender warehouse in Valmont, with a pallet jack and three pallets.", "Station Horizon, orbite basse. 400 kilomètres sous vos pieds, la Terre tourne lentement, bleue et silencieuse.": "Horizon Station, low orbit. 400 kilometers beneath your feet, the Earth turns slowly, blue and silent.", "Un chariot élévateur ! Vous allez pouvoir stocker en hauteur. Les racks sont maintenant disponibles au bureau.": "A forklift! You’ll be able to store up high. Racks are now available in the office.", "Ouvre le <b>Bureau</b>, onglet <b>Équipe</b> : tu y vois chaque équipe, avec l’énergie et le moral de chacun.": "Open the <b>Office</b>, <b>Team</b> tab: you’ll see each shift there, with everyone’s energy and morale.", "Apporte ici les colis emballés pour monter les palettes d’expédition : un camion part toutes les 30 minutes.": "Bring packed parcels here to build the shipping pallets: a truck leaves every 30 minutes.", "Il fait 36 °C dans l’entrepôt. Les équipes se fatiguent beaucoup plus vite et le risque d’accident augmente.": "It’s 36 °C in the warehouse. Teams get tired much faster and the risk of accidents goes up.", "J’ai mal au dos depuis quelques jours… Porter et me pencher toute la journée, ça commence à faire beaucoup.": "My back’s been hurting for a few days… Carrying and bending all day long is starting to be a lot.", "Recrute une chargée de communication (bureau agrandi niveau 3) pour organiser soldes, Black Friday et Noël.": "Hire a communications officer (expanded office level 3) to organize sales, Black Friday and Christmas.", "Trois quais, des semi-remorques et une chambre froide. L’entrepôt tourne de 6 h à minuit en trois équipes.": "Three docks, semi-trailers and a cold room. The warehouse runs from 6 am to midnight in three shifts.", "Un intérimaire coûte 60 % de plus et travaille moins vite. Sinon, c’est à toi de compenser sur le terrain.": "A temp worker costs 60% more and works slower. Otherwise, it’s up to you to make up for it on the floor.", "Bienvenue au hub portuaire ! D’ici, Colibox importe des meubles et du matériel de jardin du monde entier.": "Welcome to the port hub! From here, Colibox imports furniture and garden equipment from all over the world.", "Merci d’avoir joué à Warehouse. Tu peux continuer à faire tourner la station aussi longtemps que tu veux.": "Thanks for playing Warehouse. You can keep the station running as long as you like.", "Six mois plus tard. Valmont est devenu le site modèle de Colibox, et le téléphone sonne un dimanche soir.": "Six months later. Valmont has become Colibox’s model site, and the phone rings one Sunday evening.", "Le convoyeur tourne : vos colis partent seuls vers le quai. On commence à parler de votre site au siège.": "The conveyor is running: your parcels head to the dock on their own. Head office is starting to talk about your site.", "Les articles de <b>pharmacie</b> demandent un contrôle qualité : leur emballage prend 3 minutes de plus.": "<b>Pharmacy</b> items require quality control: packing them takes 3 more minutes.", "Un peu de comptage chaque jour (50 à 120 €/jour) : la précision du stock remonte au lieu de se dégrader.": "A bit of counting every day (€50 to €120/day): stock accuracy goes up instead of deteriorating.", "Le WMS commande seul chaque article dont le stock (y compris ce qui est en route) passe sous son seuil.": "The WMS automatically orders every item whose stock (including what’s on the way) falls below its reorder point.", "Beaucoup de commandes attendent un article en rupture. Les seuils de commande sont peut-être trop bas.": "Many orders are waiting for an out-of-stock item. The reorder points may be too low.", "Les transports en commun seront en grève demain : plusieurs salariés risquent de ne pas pouvoir venir.": "There’s a public transport strike tomorrow: several employees may not be able to come in.", "Pour la suite, le siège regarde vers le ciel : une base aérienne, des drones… On en reparle très vite.": "For what’s next, head office is looking to the sky: an air base, drones… We’ll talk about it very soon.", "Un montant de rack est tordu : le risque d’accident est multiplié par 1,8 tant qu’il n’est pas réparé.": "A rack upright is bent: the accident risk is multiplied by 1.8 until it’s repaired.", "Un transitaire s’occupe des formalités : les contrôles douaniers sont rares et ne durent qu’une heure.": "A customs broker handles the formalities: customs inspections are rare and only last one hour.", "Une influenceuse vient de parler de vos produits. Le service client prévoit +40 % de commandes demain.": "An influencer just talked about your products. Customer service expects +40% orders tomorrow.", "devient chef d’équipe : il épaule son équipe (+5 % de rythme, moral meilleur) contre +15 % de salaire.": "becomes team leader: they support their shift (+5% pace, better morale) for +15% salary.", "L’oxygène baisse dangereusement. L’équipe s’essouffle : il faut des cartouches ou un recycleur, vite.": "Oxygen is dangerously low. The team is running out of breath: we need cartridges or a recycler, fast.", "Objectif final : 18 gammes, 130 lancements réussis, 4,3 ★ et 250 000 €. Après ça… vous aurez tout vu.": "Final goal: 18 ranges, 130 successful launches, 4.3 ★ and €250,000. After that… you’ll have seen it all.", "Bastien, maintenance. Un robot qui tousse, un tapis qui grince : je m’en occupe. Vous, vous pilotez.": "Bastien, maintenance. A coughing robot, a squeaky belt: I’ll handle it. You run the show.", "Le chariot élévateur fuit et refuse de lever. Sans lui, personne n’accède au niveau haut des racks.": "The forklift is leaking and won’t lift. Without it, nobody can reach the top level of the racks.", "Ton chariot n’a pas été contrôlé : une fuite hydraulique n’a pas été vue, il est immobilisé demain.": "Your forklift wasn’t inspected: a hydraulic leak went unnoticed, it’s out of service tomorrow.", "Vous voilà dans la cour des grands : la livraison express mondiale. Ici, l’avion n’attend personne.": "Welcome to the big leagues: global express delivery. Here, the plane waits for no one.", "Gère les absences (intérimaires appelés automatiquement), suit le moral et l’améliore chaque jour.": "Handles absences (temp workers called in automatically), tracks morale and improves it every day.", "Les <b>racks magnétiques</b> (Améliorer) gardent les cartons arrimés : cinq fois moins de dérives.": "<b>Magnetic racks</b> (Upgrade) keep cartons secured: five times less drifting.", "Aïe, des colis express ont raté leur vol. Les clients vont les recevoir plus tard… et moins cher.": "Ouch, some express parcels missed their flight. Customers will get them later… and for less.", "est arrêté 5 jours : troubles musculo-squelettiques. La pénibilité de son poste était trop forte.": "is off work for 5 days: musculoskeletal disorders. The physical strain of their job was too high.", "La logistique est plus accidentogène que la moyenne, et les accidents y sont plus graves (INRS).": "Logistics has more accidents than average, and they’re more serious there (INRS).", "Le camion fournisseur attend depuis plus d’une heure : frais d’immobilisation facturés (30 €/h).": "The supplier truck has been waiting for over an hour: demurrage fees charged (€30/h).", "Objectifs : 16 gammes, 90 vols complets à l’heure, 400 livraisons par drone, 4,3 ★ et 200 000 €.": "Goals: 16 ranges, 90 full flights on time, 400 drone deliveries, 4.3 ★ and €200,000.", "Bonjour ! Je suis Mme Laurent, directrice régionale de Colibox. Bienvenue dans votre entrepôt.": "Hello! I’m Ms Laurent, regional director at Colibox. Welcome to your warehouse.", "Tables élévatrices, préhenseurs, tapis anti-fatigue : la pénibilité des postes baisse de 40 %.": "Lift tables, grippers, anti-fatigue mats: workstation physical strain drops by 40%.", "Un centre robotisé rentable, des clients ravis et des équipes sereines. Je suis fière de vous.": "A profitable robotic center, delighted customers and calm teams. I’m proud of you.", "du travail cette semaine. La fatigue, les heures sup et les racks abîmés augmentent le risque.": "this week. Fatigue, overtime and damaged racks increase the risk.", "Chef, regardez la taille de ces conteneurs… On va avoir besoin de bras pour dépoter tout ça !": "Boss, look at the size of these containers… We’re going to need hands to unstuff all that!", "Honnêtement, je ne me sens pas trop reconnu ici. On fait le boulot, mais personne ne le voit.": "Honestly, I don’t feel very appreciated here. We do the job, but nobody sees it.", "La banque te laisse jusqu’à demain soir pour repasser au-dessus de −300 €. Limite les achats.": "The bank gives you until tomorrow evening to get back above −€300. Limit your purchases.", "commandes de plus par jour une fois lancée (démarrage progressif sur 5 jours) · marge moyenne": "more orders per day once launched (gradual start over 5 days) · average margin", "Ça déborde ! Pensez à recruter au bureau : un préparateur et un emballeur vous soulageraient.": "It’s overflowing! Think about hiring at the office: a picker and a packer would help you out.", "Recrute une commerciale (bureau agrandi niveau 2) pour décrocher des contrats d’entreprises.": "Hire a sales rep (expanded office level 2) to land business contracts.", "Un chariot a heurté un montant de rack : il est tordu. Les racks abîmés peuvent s’effondrer.": "A forklift hit a rack upright: it’s bent. Damaged racks can collapse.", "Décroche des contrats B2B : de grosses commandes d’entreprises, livrées sur palette filmée.": "Land B2B contracts: big business orders, delivered on stretch-wrapped pallets.", "Un carton trop lourd (plus de 25 kg), on le porte à deux ou avec une aide à la manutention.": "A carton that’s too heavy (over 25 kg) is carried by two people or with a handling aid.", "Les caristes viennent ici recharger leur chariot et faire leur contrôle avant utilisation.": "Forklift drivers come here to charge their forklift and do their pre-use inspection.", "Très belle semaine : clients servis, équipes en forme, comptes au vert. Continue comme ça.": "Great week: customers served, teams in good shape, accounts in the green. Keep it up.", "Vous avez fait de Roissy une référence mondiale. Il ne reste qu’une frontière à franchir…": "You’ve made Roissy a world benchmark. Only one frontier remains…", "Chef ! J’ai demandé ma mutation, avec quelques anciens de Valmont. On ne vous lâche pas.": "Boss! I asked for a transfer, along with a few old hands from Valmont. We’re sticking with you.", "La trésorerie est restée dans le rouge deux jours de suite. La direction ferme le site.": "Cash stayed in the red two days in a row. Management is closing the site.", "Les équipements sont livrés et installés de nuit : ils fonctionnent le lendemain matin.": "Equipment is delivered and installed overnight: it works the next morning.", "Prélève les articles des commandes (niveaux bas et milieu) et les dépose à l’emballage.": "Picks order items (bottom and middle levels) and drops them off at packing.", "Toutes les palettes sont pleines ou filmées : filme-les, ou attends le prochain départ.": "All pallets are full or wrapped: wrap them, or wait for the next departure.", "Recompter une partie des emplacements remet la précision du stock à jour (actuellement": "Recounting some of the locations brings stock accuracy up to date (currently", "Réserves notées sur le bon de livraison : le fournisseur rembourse les cartons abîmés.": "Reservations noted on the delivery note: the supplier refunds the damaged cartons.", "Le premier drone est revenu sans une égratignure. Je surveille les batteries, promis.": "The first drone came back without a scratch. I’m keeping an eye on the batteries, promise.", "Ton chariot a été contrôlé aujourd’hui. Les caristes rechargent ici leurs batteries.": "Your forklift was inspected today. Forklift drivers charge their batteries here.", "Un avion rien que pour nos colis… Chef, vous vous rendez compte d’où on est partis ?": "A plane just for our parcels… Boss, do you realize where we started from?", ": les préparateurs trouvent des emplacements vides. Fais des inventaires tournants.": ": pickers are finding empty locations. Do cycle counts.", "Le chauffeur refuse les palettes non filmées : elles attendront le prochain départ.": "The driver refuses unwrapped pallets: they’ll wait for the next departure.", "Toutes les palettes B2B sont occupées : agrandis la zone B2B ou termine un contrat.": "All B2B pallets are in use: expand the B2B zone or finish a contract.", "Accepte un contrat B2B au bureau (onglet Commandes) pour préparer une palette ici.": "Accept a B2B contract at the office (Orders tab) to prepare a pallet here.", "Chariots : on ne circule jamais dans une allée où travaille un préparateur à pied.": "Forklifts: never drive in an aisle where a picker on foot is working.", "Chef ! Un des robots s’est figé au milieu de l’allée. On fait quoi, on le pousse ?": "Boss! One of the robots froze in the middle of the aisle. What do we do, push it?", "Port de charges : on plie les jambes, le dos reste droit, la charge près du corps.": "Lifting loads: bend your legs, keep your back straight, the load close to your body.", "pour la journée : il recompte une trentaine d’emplacements sans ralentir l’équipe.": "for the day: they recount about thirty locations without slowing the team down.", "Gratuit pour l’instant, mais risque d’accident ×1,8 tant que ce n’est pas réparé.": "Free for now, but accident risk ×1.8 until it’s repaired.", "Inventaire : 8 emplacements à recompter (📋). Va devant et appuie sur « Compter ».": "Stock count: 8 locations to recount (📋). Go in front and press “Count”.", "Les salariés fatigués y récupèrent leur énergie, et le moral remonte chaque jour.": "Tired employees recover their energy here, and morale goes up every day.", "Produits futuristes, apesanteur et un vaisseau qui vient chercher la marchandise.": "Futuristic products, zero gravity and a spaceship that comes to collect the goods.", "Des robots… Bon. Tant qu’ils ne prennent pas ma place à la machine à café, chef.": "Robots… Well. As long as they don’t take my place at the coffee machine, boss.", "Lance d’abord ton activité actuelle correctement : taux de service de la semaine": "First get your current operation running properly: weekly service level", "Rien n’entre en stock, le fournisseur la reprend et relivre au prochain créneau.": "Nothing goes into stock, the supplier takes it back and redelivers at the next slot.", "Je vous en reparle très vite. En attendant, profitez : vous l’avez bien mérité.": "I’ll tell you more very soon. In the meantime, enjoy it: you’ve earned it.", "Taux d’erreur = lignes fausses ÷ lignes préparées. Les bons entrepôts sont sous": "Error rate = wrong lines ÷ lines picked. Good warehouses are below", "Un petit hangar, un camion, et toi. Tu apprends tout le circuit d’une commande.": "A small hangar, a truck, and you. You learn the whole circuit of an order.", ": chaque retour coûte cher. Contrôle au poste d’emballage, formation, ou scan.": ": every return is expensive. Checks at the packing station, training, or scanning.", "Toutes les baies sont occupées : les conteneurs attendront le prochain navire.": "All bays are occupied: the containers will wait for the next ship.", "\">Calculer article par article</button> (ventes récentes, délai fournisseur, ": "\">Calculate item by item</button> (recent sales, supplier lead time, ", "Le ravitaillement arrive par <b>navette</b>, à la réception, comme un camion.": "Supplies arrive by <b>shuttle</b>, at receiving, like a truck.", "Réception, stockage, préparation, emballage, expédition… je m’occupe de tout.": "Receiving, storage, picking, packing, shipping… I handle it all.", "Un montant de rack heurté se signale tout de suite, même s’il a l’air solide.": "A damaged rack upright is reported immediately, even if it looks solid.", "Conteneurs, grues et douane. Les grosses commandes des entreprises arrivent.": "Containers, cranes and customs. Big business orders are coming in.", "Un client a reçu un mauvais article. Il est furieux sur les réseaux sociaux.": "A customer received the wrong item. They’re furious on social media.", "Chaussures de sécurité et gilet obligatoires dans les zones de circulation.": "Safety shoes and high-vis vest mandatory in traffic areas.", "Je maîtrise bien mon poste maintenant. J’aimerais apprendre plus, me former": "I’ve got a good handle on my job now. I’d like to learn more, get training", "Le camion fournisseur attend à quai depuis un moment, il faut le décharger.": "The supplier truck has been waiting at the dock for a while, it needs unloading.", "Seuils et quantités réglés article par article d’après les ventes récentes.": "Reorder points and quantities set item by item based on recent sales.", "+15 % de capacité, salaires +25 %, fatigue et risque d’accident en hausse.": "+15% capacity, salaries +25%, fatigue and accident risk up.", "Des voyants guident chaque prélèvement : erreurs −65 %, préparation +10 %.": "Lights guide each pick: errors −65%, picking +10%.", "Les objectifs « sur une semaine » sont vérifiés au bilan du vendredi soir.": "“Over one week” goals are checked at the Friday evening review.", "Taux de fréquence = accidents avec arrêt × 1 000 000 ÷ heures travaillées.": "Frequency rate = lost-time accidents × 1,000,000 ÷ hours worked.", "Bonjour chef ! Je m’occupe de la réception, vous pouvez compter sur moi.": "Hello boss! I handle receiving, you can count on me.", "L’agence ne peut pas envoyer plus de 3 personnes par équipe aujourd’hui.": "The agency can’t send more than 3 people per shift today.", "Organise les grands événements commerciaux : soldes, Black Friday, Noël.": "Organizes the big commercial events: sales, Black Friday, Christmas.", "Premier vol complet et à l’heure ! À Roissy, la ponctualité, c’est tout.": "First full flight, on time! At Roissy, punctuality is everything.", ") est en préparation : tu peux continuer à faire tourner cet entrepôt.": ") is in preparation: you can keep running this warehouse.", "8 emplacements marqués 📋 : va devant chacun et appuie sur « Compter ».": "8 locations marked 📋: go in front of each one and press “Count”.", "Je suis épuisé, chef. Je n’ai pas arrêté depuis le début de mon poste.": "I’m exhausted, boss. I haven’t stopped since the start of my shift.", "là où il y a de la place (sans règle). Le module ABC du WMS change ça.": "wherever there’s space (no rule). The WMS ABC module changes that.", "passera son CACES R489 demain et après-demain, puis deviendra cariste.": "will take their CACES R489 tomorrow and the day after, then become a forklift driver.", ") : ils livrent en 20 minutes les petites commandes urgentes du coin.": "): they deliver small urgent local orders in 20 minutes.", "La réception est pleine : le camion attend qu’on libère des palettes.": "Receiving is full: the truck is waiting for pallets to be freed up.", "Préparez votre combinaison. Le siège construit une station en orbite.": "Get your spacesuit ready. Head office is building a station in orbit.", "Robots (intégration WCS, montée en charge, retour sur investissement)": "Robots (WCS integration, ramp-up, return on investment)", "Tapis anti-fatigue, rehausse : 150 €. Sa pénibilité baisse fortement.": "Anti-fatigue mat, raised platform: €150. Their physical strain drops sharply.", ") se plaint du dos depuis plusie
