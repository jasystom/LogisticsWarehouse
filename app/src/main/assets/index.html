hursday", "Lundi": "Monday", "Manga": "Manga", "Mardi": "Tuesday", "Matin": "Morning", "Moral": "Morale", "Pause": "Pause", "Plaid": "Throw blanket", "Plein": "Full", "Poste": "Station", "Rayon": "Section", "Space": "Space", "Sport": "Sports", "Stock": "Stock", "aucun": "none", "avion": "plane", "prête": "ready", "rangé": "stored", "s ont": "s have", "Écart": "Discrepancy", "échec": "failure", "Jean": "Jeans", "Luxe": "Luxury", "Mode": "Fashion", "Pull": "Sweater", "Quai": "Dock", "Soir": "Evening", "Vase": "Vase", "Vide": "Empty", "jeté": "thrown away", "Bas": "Bottom", "Léa": "Léa", "Sas": "Airlock", "Toi": "You", "Vol": "Flight", "non": "no", "oui": "yes", "vol": "flight", "Des cartons flottent dans l’allée, rattrape-les !": "Boxes are floating in the aisle, catch them!", "Un carton flotte dans l’allée, rattrape-le !": "A box is floating in the aisle, catch it!", "gammes": "ranges"}, "es": {"Un CDI coûte un recrutement (annonces, entretiens, intégration), un salaire versé même quand l’activité baisse, et des indemnités en cas de licenciement. L’intérim coûte plus cher à l’heure (le « coefficient » de l’agence), mais il s’adapte aux pics : saisons, promotions, absences. Les bons managers gardent un <b>socle de CDI</b> pour la charge régulière et utilisent l’intérim pour les variations, en le réservant à l’avance.": "Un contrato indefinido (CDI) cuesta un proceso de selección (anuncios, entrevistas, integración), un salario pagado incluso cuando baja la actividad, e indemnizaciones en caso de despido. El trabajo temporal cuesta más por hora (el «coeficiente» de la ETT), pero se adapta a los picos: temporadas, promociones, ausencias. Los buenos responsables mantienen una <b>base de contratos indefinidos</b> para la carga regular y usan el trabajo temporal para las variaciones, reservándolo con antelación.", "Sur téléphone : joystick à gauche pour marcher, gros bouton orange pour agir. Sur ordinateur : flèches ou ZQSD, et Espace. Approche-toi d’une palette, d’un emplacement, d’un poste ou du quai : le bouton indique l’action possible. Ton vrai métier de chef : régler les seuils de commande, planifier les équipes, prendre les bonnes décisions face aux imprévus, et tenir tes indicateurs au bilan du vendredi.": "En el móvil: joystick a la izquierda para caminar, botón naranja grande para actuar. En el ordenador: flechas o WASD, y Espacio. Acércate a un palé, una ubicación, un puesto o el muelle: el botón indica la acción posible. Tu verdadero trabajo de jefe: ajustar los puntos de pedido, planificar los equipos, tomar las decisiones correctas ante los imprevistos y cumplir tus indicadores en el balance del viernes.", "Les problèmes se voient sur le terrain avant de se voir dans les chiffres. Le <b>point d’équipe</b> de 5 minutes devant le tableau (objectifs, sécurité, priorités) et les discussions avec les opérateurs font remonter les idées et les difficultés. C’est le principe du « Gemba » du Lean : aller voir là où la valeur se crée.": "Los problemas se ven sobre el terreno antes de verse en las cifras. La <b>reunión de equipo</b> de 5 minutos delante del tablero (objetivos, seguridad, prioridades) y las conversaciones con los operarios hacen aflorar las ideas y las dificultades. Es el principio del «Gemba» del Lean: ir a ver allí donde se crea el valor.", "Ordres de grandeur inspirés de l’INRS (métiers de la logistique), de la CRAMIF et de guides professionnels sur les indicateurs d’entrepôt et l’automatisation. Graphismes : packs « Factory Kit », « Conveyor Kit », « Car Kit », « Mini Characters » et « Tower Defense Kit » de Kenney (kenney.nl), licence CC0.": "Órdenes de magnitud inspirados en el INRS (oficios de la logística), la CRAMIF y guías profesionales sobre los indicadores de almacén y la automatización. Gráficos: packs «Factory Kit», «Conveyor Kit», «Car Kit», «Mini Characters» y «Tower Defense Kit» de Kenney (kenney.nl), licencia CC0.", "Les manutentions manuelles sont la <b>première cause d’accidents</b> en logistique, et les troubles musculo-squelettiques la première maladie professionnelle (INRS). Prévention : aides à la manutention, articles lourds à mi-hauteur, rotation des postes, formation gestes et postures, pauses.": "La manipulación manual de cargas es la <b>primera causa de accidentes</b> en logística, y los trastornos musculoesqueléticos la primera enfermedad profesional (INRS). Prevención: ayudas a la manipulación, artículos pesados a media altura, rotación de puestos, formación en posturas y movimientos, pausas.", " jours de salaire d’indemnités s’il faut s’en séparer — mais il progresse et reste. <b>Intérim</b> : plus cher à la journée, sans engagement ; réservé pour la semaine au planning (×1,35) ou en urgence aujourd’hui (×1,6, pas garanti). Un bon intérimaire peut passer en CDI après 3 jours.": " días de salario de indemnización si hay que prescindir de él, pero progresa y se queda. <b>Temporal (ETT)</b>: más caro por día, sin compromiso; reservado para la semana en la planificación (×1,35) o de urgencia hoy (×1,6, no garantizado). Un buen temporal puede pasar a indefinido tras 3 días.", "Environ 20 % des articles font 80 % des ventes (classe A), les suivants jusqu’à 95 % (B), le reste (C). Placer les A près de l’emballage et à hauteur d’homme (la « zone d’or ») réduit les déplacements de <b>15 à 30 %</b>. À refaire régulièrement : les ventes changent avec les saisons.": "Alrededor del 20 % de los artículos hacen el 80 % de las ventas (clase A), los siguientes hasta el 95 % (B), y el resto (C). Colocar los A cerca del embalaje y a la altura de la mano (la «zona dorada») reduce los desplazamientos entre un <b>15 y un 30 %</b>. Hay que repetirlo con regularidad: las ventas cambian con las temporadas.", "Le logiciel de gestion d’entrepôt connaît chaque adresse et chaque carton en temps réel, guide les rangements et propose les réapprovisionnements. Mais <b>il applique tes règles</b> : de mauvais seuils ou une mauvaise règle de rangement donnent de mauvais résultats, plus vite.": "El software de gestión de almacén conoce cada ubicación y cada caja en tiempo real, guía las ubicaciones y propone las reposiciones. Pero <b>aplica tus reglas</b>: unos puntos de pedido o una regla de ubicación malos dan malos resultados, más rápido.", "Avec l’expérience seule, un salarié plafonne vite. La <b>formation</b> le fait progresser : plus rapide, moins d’erreurs, plus motivé. Un parcours (formation métier, CACES, chef d’équipe) fidélise aussi les meilleurs, et coûte moins cher qu’un recrutement.": "Solo con la experiencia, un empleado se estanca rápido. La <b>formación</b> le hace progresar: más rápido, menos errores, más motivado. Un itinerario (formación del oficio, CACES, jefe de equipo) también fideliza a los mejores, y cuesta menos que una contratación.", "Un écart apparaît à chaque erreur de rangement, casse non déclarée ou erreur de prélèvement. Objectif : <b>plus de 98 à 99 % de précision</b>. L’<b>inventaire tournant</b> recompte un peu chaque jour au lieu de fermer l’entrepôt pour un inventaire complet.": "Aparece una diferencia con cada error de ubicación, rotura no declarada o error de extracción. Objetivo: <b>más del 98 al 99 % de precisión</b>. El <b>inventario cíclico</b> recuenta un poco cada día en lugar de cerrar el almacén para un inventario completo.", "Le stock de <b>prélèvement</b> est au sol ou à hauteur d’homme ; la <b>réserve</b> est en hauteur, accessible au chariot élévateur. Le <b>réapprovisionnement</b> descend la réserve avant que l’emplacement de picking soit vide, sinon le préparateur attend.": "El stock de <b>picking</b> está en el suelo o a la altura de la mano; la <b>reserva</b> está en altura, accesible con la carretilla elevadora. La <b>reposición</b> baja la reserva antes de que la ubicación de picking se vacíe; si no, el preparador espera.", "Stocker coûte cher : en moyenne <b>20 à 25 % de la valeur du stock par an</b> (argent immobilisé, assurance, place, casse, obsolescence). Trop de stock vide la trésorerie ; pas assez provoque des ruptures. Dans le jeu : 0,2 % de la valeur par jour.": "Almacenar sale caro: de media <b>entre un 20 y un 25 % del valor del stock al año</b> (dinero inmovilizado, seguro, espacio, roturas, obsolescencia). Demasiado stock vacía la tesorería; demasiado poco provoca roturas de stock. En el juego: 0,2 % del valor al día.", "Quand on commande en réaction aux ruptures (« vite, commandons le double ! »), les variations s’amplifient chez le fournisseur : c’est l’<b>effet coup de fouet</b> du célèbre Beer Game. Mieux vaut des règles stables, basées sur la vraie demande.": "Cuando se pide como reacción a las roturas de stock («¡rápido, pidamos el doble!»), las variaciones se amplifican en el proveedor: es el <b>efecto látigo</b> del famoso Beer Game. Más vale tener reglas estables, basadas en la demanda real.", "La demande varie d’une semaine à l’autre. La prévision part de l’historique et des tendances, mais elle est toujours un peu fausse : c’est pour ça qu’on garde un stock de sécurité, et qu’on <b>revoit ses seuils quand la saison change</b>.": "La demanda varía de una semana a otra. La previsión parte del histórico y de las tendencias, pero siempre es un poco errónea: por eso se mantiene un stock de seguridad y se <b>revisan los puntos de pedido cuando cambia la temporada</b>.", "Absentéisme = jours d’absence ÷ jours de travail prévus. Le moral, la pénibilité, les horaires décalés et la reconnaissance pèsent directement dessus. Un départ coûte un recrutement, une formation et des semaines de productivité réduite.": "Absentismo = días de ausencia ÷ días de trabajo previstos. La moral, la penosidad, los horarios a turnos y el reconocimiento influyen directamente en él. Una baja voluntaria cuesta una contratación, una formación y semanas de productividad reducida.", "Conduire un chariot élévateur demande une formation <b>CACES R489</b> et une autorisation de conduite de l’employeur. Les racks se contrôlent régulièrement : un montant heurté doit être signalé et réparé, sinon la structure peut céder.": "Conducir una carretilla elevadora exige una formación <b>CACES R489</b> y una autorización de conducción del empresario. Las estanterías se revisan con regularidad: un montante golpeado debe notificarse y repararse; si no, la estructura puede ceder.", "On contrôle chaque livraison avant de signer. Une anomalie se note sur le bon de livraison avec des <b>réserves précises</b> (« 6 cartons écrasés »), puis se confirme au transporteur. Sans réserve, le recours devient très difficile.": "Cada entrega se controla antes de firmar. Una anomalía se anota en el albarán de entrega con <b>reservas precisas</b> («6 cajas aplastadas») y luego se confirma al transportista. Sin reservas, la reclamación se vuelve muy difícil.", "Réception → stockage → préparation (le « picking ») → emballage → expédition. La préparation pèse 50 à 70 % des coûts d’exploitation d’un entrepôt e-commerce, surtout à cause des déplacements : c’est là que se gagne la productivité.": "Recepción → almacenamiento → preparación (el «picking») → embalaje → expedición. La preparación supone entre el 50 y el 70 % de los costes de explotación de un almacén de e-commerce, sobre todo por los desplazamientos: ahí es donde se gana productividad.", "Mais attention : un robot coûte cher, il faut d’abord l’intégrer au système, et il met quelques jours à atteindre son plein rendement. Il ne se fatigue pas… mais il tombe en panne. Calculez bien votre retour sur investissement.": "Pero cuidado: un robot es caro, primero hay que integrarlo en el sistema y tarda unos días en alcanzar su pleno rendimiento. No se cansa… pero se avería. Calcule bien su retorno de la inversión.", "Stock en temps réel, scan des emplacements (3 fois moins d’erreurs de rangement) et commandes fournisseurs automatiques selon TES seuils. Deux jours d’apprentissage après l’installation (−15 % de productivité).": "Stock en tiempo real, escaneo de ubicaciones (3 veces menos errores de ubicación) y pedidos automáticos a proveedores según TUS puntos de pedido. Dos días de aprendizaje tras la instalación (−15 % de productividad).", "Les articles ne se vendent pas tous autant : un même seuil pour toute la gamme fait des ruptures sur les meilleures ventes et du stock qui dort sur les autres. <button class=\"btn sm\" data-act=\"rpsug\" data-c=\"": "No todos los artículos se venden igual: un mismo punto de pedido para toda la gama provoca roturas en los más vendidos y stock dormido en los demás. <button class=\"btn sm\" data-act=\"rpsug\" data-c=\"", "Le camion a déposé des palettes en <b>réception</b> (zone bleue, au fond à gauche). Va prendre des cartons avec le <b>bouton d’action</b>. Chaque couleur d’étiquette correspond à une gamme (ici : Librairie).": "El camión ha dejado palés en <b>recepción</b> (zona azul, al fondo a la izquierda). Ve a coger cajas con el <b>botón de acción</b>. Cada color de etiqueta corresponde a una gama (aquí: Librería).", "Enfin, avec une chargée de communication, vous pourrez lancer les grands événements : soldes, Black Friday, Noël. Objectifs : 14 gammes, 6 robots, un événement réussi, moins de 1,5 % d’erreurs et 80 000 €.": "Por último, con una responsable de comunicación, podrá lanzar los grandes eventos: rebajas, Black Friday, Navidad. Objetivos: 14 gamas, 6 robots, un evento con éxito, menos del 1,5 % de errores y 80 000 €.", "On compare aux heures disponibles (effectif × durée × rendement, moins les absences). L’intérim réservé à l’avance coûte moins cher et arrive formé ; l’intérim du jour même coûte plus et n’est pas garanti.": "Se compara con las horas disponibles (plantilla × duración × rendimiento, menos las ausencias). El temporal reservado con antelación cuesta menos y llega formado; el temporal del mismo día cuesta más y no está garantizado.", "4 étoiles de satisfaction ! Le siège a de grands projets pour vous. Lancez les 8 gammes, gardez 4,3 ★, visez 15 000 € de trésorerie… et tenez une vraie semaine : 92 % de service, moins de 8 % de ruptures.": "¡4 estrellas de satisfacción! La sede tiene grandes proyectos para usted. Lance las 8 gamas, mantenga 4,3 ★, apunte a 15 000 € de tesorería… y aguante una semana de verdad: 92 % de servicio, menos de un 8 % de roturas.", "Nouveaux défis : des produits frais à garder au froid, des équipes à ménager, des absences imprévues. Objectifs : 10 gammes, 4,3 ★, 20 000 €, et une semaine à plus de 90 % de service avec peu de ruptures.": "Nuevos retos: productos frescos que hay que mantener en frío, equipos a los que cuidar, ausencias imprevistas. Objetivos: 10 gamas, 4,3 ★, 20 000 € y una semana con más del 90 % de servicio y pocas roturas.", "Installés de nuit. 3 niveaux par emplacement : bas et milieu pour le picking, haut en réserve (chariot élévateur et CACES). Débloque les caristes. À faire contrôler : un montant heurté doit être réparé.": "Instaladas por la noche. 3 niveles por ubicación: bajo y medio para el picking, alto como reserva (carretilla elevadora y CACES). Desbloquea a los carretilleros. Hay que revisarlas: un montante golpeado debe repararse.", "Il manque des bras ? <b>Réserve des intérimaires</b> pour la semaine (moins cher et garanti), ou prévois des <b>heures supplémentaires</b> (plus de fatigue et d’accidents). Planning : Bureau › Équipe.": "¿Faltan brazos? <b>Reserva temporales</b> para la semana (más barato y garantizado), o prevé <b>horas extra</b> (más fatiga y accidentes). Planificación: Oficina › Equipo.", "(On Time In Full) = commandes livrées à l’heure, complètes et sans erreur ÷ commandes à servir. C’est l’indicateur que le client regarde en premier. Une commande annulée ou fausse compte comme ratée.": "(On Time In Full) = pedidos entregados a tiempo, completos y sin errores ÷ pedidos por servir. Es el indicador que el cliente mira primero. Un pedido cancelado o erróneo cuenta como fallido.", "Une commande arrive (en haut à droite) ! <b>Prélève</b> l’article demandé : tu le sors de son carton et le mets dans un bac gris. Un point d’exclamation jaune indique l’emplacement où il se trouve.": "¡Llega un pedido (arriba a la derecha)! <b>Extrae</b> el artículo solicitado: lo sacas de su caja y lo pones en una cubeta gris. Un signo de exclamación amarillo indica la ubicación donde se encuentra.", "Exemple : un article se vend 6 fois par jour, le fournisseur livre en une demi-journée → 3 unités consommées pendant l’attente. Si tu recommandes sous 3, tu tombes en rupture avant la livraison.": "Ejemplo: un artículo se vende 6 veces al día y el proveedor entrega en medio día → se consumen 3 unidades durante la espera. Si vuelves a pedir por debajo de 3, te quedas en rotura antes de la entrega.", "Chaque emplacement a maintenant <b>3 niveaux</b> : bas et milieu pour le <b>picking</b>, à portée de main, et le <b>haut</b> qui sert de <b>réserve</b>. Seul un chariot élévateur l’atteint.": "Cada ubicación tiene ahora <b>3 niveles</b>: bajo y medio para el <b>picking</b>, al alcance de la mano, y el <b>alto</b>, que sirve de <b>reserva</b>. Solo una carretilla elevadora llega a él.", "Pour les ménager : une <b>salle de pause</b> (Améliorer), des <b>primes</b> et des <b>formations</b> (Équipe), et des plannings équilibrés. Les équipes du soir pèsent un peu sur le moral.": "Para cuidarlos: una <b>sala de descanso</b> (Mejorar), <b>primas</b> y <b>formaciones</b> (Equipo), y planificaciones equilibradas. Los turnos de noche pesan un poco en la moral.", ", avec z = 1,28 pour 90 % de service, 1,65 pour 95 %, 2,33 pour 99 %. Les derniers points de service coûtent beaucoup de stock : 99 % demande presque deux fois plus de sécurité que 90 %.": ", con z = 1,28 para un 90 % de servicio, 1,65 para un 95 %, 2,33 para un 99 %. Los últimos puntos de servicio cuestan mucho stock: el 99 % exige casi el doble de seguridad que el 90 %.", "Ici, tout part par <b>vaisseau</b>. Il décolle toutes les 3 heures : chaque commande indique sa fenêtre de lancement. Charge les colis dans les <b>sas</b> (zone verte) avant son départ.": "Aquí todo sale en <b>nave</b>. Despega cada 3 horas: cada pedido indica su ventana de lanzamiento. Carga los paquetes en las <b>esclusas</b> (zona verde) antes de su salida.", "La prévention paie : <b>formation gestes et postures</b>, <b>aides à la manutention</b>, <b>rotation des postes</b>, pauses. Fatigue et heures sup font grimper les accidents du travail.": "La prevención compensa: <b>formación en posturas y movimientos</b>, <b>ayudas a la manipulación</b>, <b>rotación de puestos</b>, pausas. La fatiga y las horas extra disparan los accidentes laborales.", "Dans le bureau, onglet <b>Stock</b>, choisis le fournisseur de chaque gamme : <b>Standard</b> (prochain créneau), <b>Express</b> (+25 %, 1 h) ou <b>Import</b> (−30 %, par conteneur).": "En la oficina, pestaña <b>Stock</b>, elige el proveedor de cada gama: <b>Estándar</b> (próxima franja), <b>Exprés</b> (+25 %, 1 h) o <b>Importación</b> (−30 %, por contenedor).", "Deux jours d’apprentissage : l’équipe est un peu plus lente le temps de prendre le scanner en main. Le module <b>ABC</b> (Améliorer) range les meilleures ventes près de l’emballage.": "Dos días de aprendizaje: el equipo va un poco más lento mientras se hace con el escáner. El módulo <b>ABC</b> (Mejorar) coloca los más vendidos cerca del embalaje.", "Trois nouveautés. Un : vous pouvez choisir vos fournisseurs. L’import maritime coûte 30 % moins cher, mais arrive en conteneur, au rythme des navires… et la douane peut en bloquer.": "Tres novedades. Una: puede elegir sus proveedores. La importación marítima cuesta un 30 % menos, pero llega en contenedor, al ritmo de los barcos… y la aduana puede retenerlos.", "Range ces cartons fournisseur dans un <b>emplacement de stockage</b> (zone jaune) : approche-toi et appuie sur Action. Chaque emplacement accueille une seule référence par niveau.": "Guarda estas cajas del proveedor en una <b>ubicación de almacenamiento</b> (zona amarilla): acércate y pulsa Acción. Cada ubicación admite una sola referencia por nivel.", "Ton WMS est en service. Il passe les commandes fournisseurs tout seul… <b>selon les seuils que tu as réglés</b>. Trop bas : ruptures. Trop hauts : du stock qui dort et qui coûte.": "Tu WMS está en servicio. Hace los pedidos a proveedores él solo… <b>según los puntos de pedido que hayas ajustado</b>. Demasiado bajos: roturas. Demasiado altos: stock dormido que cuesta.", "Ici l’entrepôt tourne de <b>6 h à minuit</b>, en trois équipes de 6 heures : <b>matin</b>, <b>après-midi</b> et <b>soir</b>. Chaque salarié ne travaille que pendant son équipe.": "Aquí el almacén funciona de <b>6 h a medianoche</b>, en tres turnos de 6 horas: <b>mañana</b>, <b>tarde</b> y <b>noche</b>. Cada empleado solo trabaja durante su turno.", "Bonjour ! Nadia, ressources humaines. Je m’occupe des absences et des intérimaires, et je garde un œil sur le moral de tout le monde. Vous, concentrez-vous sur l’organisation.": "¡Buenos días! Nadia, recursos humanos. Me ocupo de las ausencias y de los temporales, y vigilo la moral de todo el mundo. Usted, concéntrese en la organización.", "Attention : votre fournisseur ne livre qu’à heures fixes, avec trois heures de délai. Réglez vos seuils de commande dans le Bureau, onglet Stock, avant de tomber en rupture.": "Atención: su proveedor solo entrega a horas fijas, con tres horas de plazo. Ajuste sus puntos de pedido en la Oficina, pestaña Stock, antes de quedarse en rotura.", "La chambre froide (en bas à droite) accueille les gammes <b>Frais</b> (étiquette verte claire) et <b>Surgelés</b> (bleu clair). Lance la gamme Frais au bureau, onglet Stock.": "La cámara frigorífica (abajo a la derecha) acoge las gamas <b>Frescos</b> (etiqueta verde claro) y <b>Congelados</b> (azul claro). Lanza la gama Frescos en la oficina, pestaña Stock.", "Les préparateurs à pied ne prennent qu’en bas et au milieu. Quand le bas se vide, descends la réserve : bouton <b>« Réapprovisionner »</b>, mains vides devant l’emplacement.": "Los preparadores a pie solo cogen de abajo y del medio. Cuando el nivel bajo se vacía, baja la reserva: botón <b>«Reponer»</b>, con las manos vacías delante de la ubicación.", "Chaque matin, quelqu’un peut manquer à l’appel. Un <b>intérimaire</b> le remplace pour la journée, plus cher et moins rapide. Sinon, c’est toi qui compenses sur le terrain.": "Cada mañana, alguien puede faltar. Un <b>temporal</b> lo sustituye durante el día, más caro y menos rápido. Si no, eres tú quien compensa sobre el terreno.", "Chaque vendredi, après le bilan, tu prépares la semaine suivante : la prévision des ventes donne la <b>charge</b> en heures, à comparer à la <b>capacité</b> de tes équipes.": "Cada viernes, después del balance, preparas la semana siguiente: la previsión de ventas da la <b>carga</b> en horas, que se compara con la <b>capacidad</b> de tus equipos.", "Les écarts viennent surtout des erreurs de rangement. Le <b>WMS</b> (scan) les réduit beaucoup, et l’<b>inventaire tournant</b> (Bureau › Stock) remet les compteurs à jour.": "Las diferencias vienen sobre todo de los errores de ubicación. El <b>WMS</b> (escaneo) las reduce mucho, y el <b>inventario cíclico</b> (Oficina › Stock) pone los contadores al día.", "Chaque vendredi, vous préparerez le planning de la semaine suivante. Et surveillez la santé des équipes : en logistique, les accidents et le mal de dos coûtent très cher.": "Cada viernes preparará la planificación de la semana siguiente. Y vigile la salud de los equipos: en logística, los accidentes y el dolor de espalda salen muy caros.", "Chaque salarié a une jauge de <b>pénibilité</b>. Porter, se pencher, répéter les mêmes gestes : à 100 %, c’est l’arrêt maladie pour TMS (troubles musculo-squelettiques).": "Cada empleado tiene un indicador de <b>penosidad</b>. Cargar, agacharse, repetir los mismos gestos: al 100 %, es la baja por TME (trastornos musculoesqueléticos).", "Avec le <b>bureau agrandi</b>, tu pourras recruter une <b>responsable RH</b> : elle appelle les intérimaires toute seule, moins cher, et soigne le moral de l’équipe.": "Con la <b>oficina ampliada</b>, podrás contratar a una <b>responsable de RR. HH.</b>: llama ella sola a los temporales, más barato, y cuida la moral del equipo.", "J’aime cet état d’esprit. Mais un bon chef d’entrepôt, ça se mesure : chaque vendredi soir, je regarderai vos indicateurs. Taux de service, erreurs, stock, résultat.": "Me gusta esa actitud. Pero un buen jefe de almacén se mide: cada viernes por la tarde miraré sus indicadores. Nivel de servicio, errores, stock, resultado.", "Je ne vais pas vous mentir : il est vide, et il n’y a que vous. Mais les commandes en ligne explosent, et je veux faire de ce site notre meilleur centre logistique.": "No voy a mentirle: está vacío y solo está usted. Pero los pedidos en línea se disparan, y quiero hacer de este sitio nuestro mejor centro logístico.", "Un robot peut tomber en <b>panne</b> : un panneau rouge apparaît au-dessus. Va le <b>réparer</b> (bouton d’action), ou recrute un <b>technicien de maintenance</b>.": "Un robot puede <b>averiarse</b>: aparece un panel rojo encima. Ve a <b>repararlo</b> (botón de acción), o contrata a un <b>técnico de mantenimiento</b>.", "Va devant le camion et appuie sur <b>Décharger</b>, puis pose les cartons sur une palette de réception ou range-les directement. Tes réceptionnaires le font aussi.": "Ve delante del camión y pulsa <b>Descargar</b>, luego deja las cajas en un palé de recepción o guárdalas directamente. Tus recepcionistas también lo hacen.", "Ton fournisseur livre à heures fixes : <b>9 h, 12 h et 15 h</b>, avec 3 h de délai minimum. Si tu attends la rupture pour commander, tes clients attendront aussi.": "Tu proveedor entrega a horas fijas: <b>9 h, 12 h y 15 h</b>, con 3 h de plazo mínimo. Si esperas a la rotura para pedir, tus clientes también esperarán.", "Trois vols partent chaque jour : <b>10 h, 15 h et 20 h</b>. Les commandes <b>express</b> (étiquette ✈) rapportent 60 % de plus, mais doivent partir avec leur vol.": "Cada día salen tres vuelos: <b>10 h, 15 h y 20 h</b>. Los pedidos <b>exprés</b> (etiqueta ✈) rinden un 60 % más, pero deben salir en su vuelo.", "Un préparateur a trouvé un emplacement vide alors que le système indiquait du stock : c’est un <b>écart d’inventaire</b>. Il perd du temps et le carton est perdu.": "Un preparador ha encontrado una ubicación vacía cuando el sistema indicaba stock: es una <b>diferencia de inventario</b>. Pierde tiempo y la caja se pierde.", "Un salarié se fatigue en travaillant : sous 50 % d’énergie, il ralentit. Un moral bas le ralentit aussi, augmente les absences… et peut le pousser à démissionner.": "Un empleado se cansa trabajando: por debajo del 50 % de energía, se ralentiza. Una moral baja también lo ralentiza, aumenta las ausencias… y puede empujarlo a dimitir.", "Ici, on tourne de 6 h à minuit, en trois équipes : matin, après-midi et soir. Vous ne pourrez pas tout faire vous-même. Votre vrai métier devient l’organisation.": "Aquí se trabaja de 6 h a medianoche, en tres turnos: mañana, tarde y noche. No podrá hacerlo todo usted mismo. Su verdadero trabajo pasa a ser la organización.", "Ici, pas de camion : un vaisseau cargo s’amarre toutes les 3 heures, pendant une fenêtre de lancement. Tous les colis doivent être dans les sas avant son départ.": "Aquí no hay camión: una nave de carga se acopla cada 3 horas, durante una ventana de lanzamiento. Todos los paquetes deben estar en las esclusas antes de su salida.", "Ouvre le <b>Bureau › Stock</b> : pour chaque gamme, règle un <b>seuil de commande</b> et une <b>quantité</b>. Le bouton « Appliquer » reprend le conseil calculé.": "Abre la <b>Oficina › Stock</b>: para cada gama, ajusta un <b>punto de pedido</b> y una <b>cantidad</b>. El botón «Aplicar» retoma la recomendación calculada.", "Parfois, la <b>douane</b> retient un conteneur pendant 3 heures. Tu peux payer 150 € pour le libérer tout de suite, ou prendre un <b>transitaire</b> (Améliorer).": "A veces, la <b>aduana</b> retiene un contenedor durante 3 horas. Puedes pagar 150 € para liberarlo enseguida, o contratar a un <b>transitario</b> (Mejorar).", "Un camion fournisseur est à quai (devant la réception). Le chauffeur décharge seul, mais lentement : au-delà d’une heure à quai, l’attente est facturée (30 €/h).": "Un camión de proveedor está en el muelle (delante de la recepción). El conductor descarga solo, pero despacio: pasada una hora en el muelle, la espera se factura (30 €/h).", "Au début de chaque poste, un <b>point d’équipe</b> de 5 minutes devant le tableau : objectifs, sécurité, priorités. L’équipe démarre plus vite et plus motivée.": "Al inicio de cada turno, una <b>reunión de equipo</b> de 5 minutos delante del tablero: objetivos, seguridad, prioridades. El equipo arranca más rápido y más motivado.", "Ton bureau s’agrandit : un poste de <b>responsable RH</b> est disponible (Bureau › Équipe). Elle gère les absences et fait monter le moral de tous chaque jour.": "Tu oficina se amplía: hay un puesto de <b>responsable de RR. HH.</b> disponible (Oficina › Equipo). Gestiona las ausencias y sube la moral de todos cada día.", "Un client a reçu un mauvais article : retour, renvoi, satisfaction en baisse. Les intérimaires et les salariés fatigués ou peu formés se trompent plus souvent.": "Un cliente ha recibido un artículo equivocado: devolución, reenvío, satisfacción a la baja. Los temporales y los empleados cansados o poco formados se equivocan más a menudo.", "Va à la <b>zone de recharge</b> (marquée au sol) et appuie sur <b>Contrôler mon chariot</b>. Tes caristes y font leur contrôle et y rechargent leurs batteries.": "Ve a la <b>zona de carga</b> (marcada en el suelo) y pulsa <b>Revisar mi carretilla</b>. Tus carretilleros hacen ahí su revisión y recargan sus baterías.", "Le logiciel qui pilote robots et machines. Indispensable avant d’acheter un robot ou un tri automatique (l’intégration coûte souvent autant que les machines).": "El software que controla robots y máquinas. Imprescindible antes de comprar un robot o un clasificador automático (la integración suele costar tanto como las máquinas).", "Pour les petites commandes du coin, vous aurez une flotte de drones : livraison en 20 minutes. Et un stockage vertical automatisé, si vous en avez les moyens.": "Para los pequeños pedidos de la zona, tendrá una flota de drones: entrega en 20 minutos. Y un almacenamiento vertical automatizado, si tiene los medios.", ". Une erreur coûte un retour, un renvoi et la confiance du client. Remèdes : contrôle au poste d’emballage, scan des codes-barres, pick-to-light, formation.": ". Un error cuesta una devolución, un reenvío y la confianza del cliente. Soluciones: control en el puesto de embalaje, escaneo de códigos de barras, pick-to-light, formación.", "Deux dangers : l’apesanteur, qui fait flotter les cartons mal arrimés, et l’oxygène. Plus l’équipage est nombreux, plus il en consomme. Surveillez la jauge.": "Dos peligros: la ingravidez, que hace flotar las cajas mal sujetas, y el oxígeno. Cuanto más numerosa es la tripulación, más consume. Vigile el indicador.", "Margaux peut programmer un <b>événement</b> pour le lendemain (bureau, onglet Commandes) : soldes, Black Friday ou Noël. Les commandes explosent ce jour-là.": "Margaux puede programar un <b>evento</b> para el día siguiente (oficina, pestaña Pedidos): rebajas, Black Friday o Navidad. Ese día los pedidos se disparan.", "Des cartons se sont détachés et <b>flottent</b> dans l’allée. Rattrape-les avant 2 heures, sinon ils sont perdus. Tes réceptionnaires s’en chargent aussi.": "Se han soltado cajas y <b>flotan</b> en el pasillo. Recupéralas antes de 2 horas o se perderán. Tus recepcionistas también se encargan.", "Chaque <b>vendredi soir</b>, Mme Laurent fait le bilan de la semaine : taux de service, ruptures, erreurs, précision du stock et résultat d’exploitation.": "Cada <b>viernes por la tarde</b>, la Sra. Laurent hace el balance de la semana: nivel de servicio, roturas, errores, precisión del stock y resultado de explotación.", "Margaux, communication. Donnez-moi un jour de préparation, et je vous remplis les carnets de commandes. Soldes, Black Friday ou Noël : à vous de choisir.": "Margaux, comunicación. Deme un día de preparación y le lleno la cartera de pedidos. Rebajas, Black Friday o Navidad: usted elige.", ") : il prélève jour et nuit, sans salaire. Montée en charge : 50 % le premier jour, plein rendement en 5 jours. Maintenance 25 €/jour, énergie, pannes.": "): extrae día y noche, sin salario. Puesta en marcha: 50 % el primer día, pleno rendimiento en 5 días. Mantenimiento 25 €/día, energía, averías.", "Le hub tourne comme une horloge. Le siège a une nouvelle idée : un centre entièrement automatisé, près de Paris. Vous êtes la personne qu’il nous faut.": "El hub funciona como un reloj. La sede tiene una nueva idea: un centro totalmente automatizado, cerca de París. Usted es la persona que necesitamos.", "Le soir, les commandes en ligne sont plus nombreuses : recrute au moins une personne dans l’<b>équipe du soir</b> (prime de soirée : +25 % de salaire).": "Por la noche hay más pedidos en línea: contrata al menos a una persona en el <b>turno de noche</b> (plus de nocturnidad: +25 % de salario).", "Un chauffeur ne prend jamais une palette qui n’est pas <b>filmée</b> (sinon les colis tombent). Mains vides, devant le quai : <b>Filmer la palette</b>.": "Un conductor nunca se lleva un palé que no esté <b>filmado</b> (si no, los paquetes se caen). Con las manos vacías, delante del muelle: <b>Filmar el palé</b>.", "Marco, cariste. Je m’occupe de la réserve en hauteur et je descends le stock quand les niveaux bas se vident. Vos préparateurs ne manqueront de rien.": "Marco, carretillero. Me ocupo de la reserva en altura y bajo el stock cuando los niveles bajos se vacían. A sus preparadores no les faltará de nada.", "Trois vols par jour : 10 h, 15 h et 20 h. Les colis express, marqués d’un avion, doivent être chargés dans les conteneurs aériens avant le décollage.": "Tres vuelos al día: 10 h, 15 h y 20 h. Los paquetes exprés, marcados con un avión, deben cargarse en los contenedores aéreos antes del despegue.", "Puis appuie sur <b>« Commander les articles sous le seuil »</b>. Avec un WMS, ces commandes partiront toutes seules, mais toujours selon TES seuils.": "Luego pulsa <b>«Pedir los artículos bajo el punto de pedido»</b>. Con un WMS, estos pedidos saldrán solos, pero siempre según TUS puntos de pedido.", "du prix, et il n’atteint son plein rendement qu’après plusieurs semaines (40 à 60 % le premier mois). La maintenance coûte 10 à 15 % du prix par an.": "del precio, y no alcanza su pleno rendimiento hasta pasadas varias semanas (del 40 al 60 % el primer mes). El mantenimiento cuesta entre un 10 y un 15 % del precio al año.", "Hors du froid, un produit frais s’abîme en <b>2 heures</b> sur une palette, et en 1 h 30 si on le transporte. Range-le vite dans la chambre froide.": "Fuera del frío, un producto fresco se estropea en <b>2 horas</b> en un palé, y en 1 h 30 si se transporta. Guárdalo rápido en la cámara frigorífica.", "Les <b>fiches du manager</b> (Bureau › Pilotage) expliquent les formules : point de commande, stock de sécurité… Elles se débloquent au fil du jeu.": "Las <b>fichas del responsable</b> (Oficina › Gestión) explican las fórmulas: punto de pedido, stock de seguridad… Se desbloquean a lo largo del juego.", "Une commande standard arrive au premier créneau situé au moins 3 h plus tard. Prévois donc le stock nécessaire pendant ce délai : c’est le rôle du": "Un pedido estándar llega en la primera franja situada al menos 3 h después. Prevé por tanto el stock necesario durante ese plazo: esa es la función del", "Chaque colis est vérifié avant fermeture : 90 % des erreurs de préparation sont rattrapées, mais l’emballage prend environ 15 % de temps en plus.": "Cada paquete se verifica antes de cerrarlo: se detectan el 90 % de los errores de preparación, pero el embalaje lleva un 15 % más de tiempo.", "L’intérim réservé arrive chaque matin pour toute la semaine (×1,35 sur le salaire). En urgence, le jour même, il coûte ×1,6 et n’est pas garanti.": "El temporal reservado llega cada mañana durante toda la semana (×1,35 sobre el salario). De urgencia, el mismo día, cuesta ×1,6 y no está garantizado.", "Un colis qui rate son vol attend le suivant et perd 30 % de sa valeur. Un vol complet (4 colis ou plus) parti sans retard compte pour l’objectif.": "Un paquete que pierde su vuelo espera al siguiente y pierde el 30 % de su valor. Un vuelo completo (4 paquetes o más) que sale sin retraso cuenta para el objetivo.", "Active le <b>contrôle qualité au poste d’emballage</b> (Bureau › Stock › Règles) : il rattrape 90 % des erreurs, mais l’emballage est plus lent.": "Activa el <b>control de calidad en el puesto de embalaje</b> (Oficina › Stock › Reglas): detecta el 90 % de los errores, pero el embalaje es más lento.", "Avant d’utiliser un chariot élévateur, on le contrôle chaque jour : freins, fourches, klaxon, fuites. C’est obligatoire, et ça évite les pannes.": "Antes de usar una carretilla elevadora, se revisa cada día: frenos, horquillas, claxon, fugas. Es obligatorio y evita averías.", "Chaque carton a une <b>date limite</b> : 3 jours pour le frais, 12 pour le surgelé. Commande juste ce qu’il faut, sinon il finira à la poubelle.": "Cada caja tiene una <b>fecha de caducidad</b>: 3 días para el fresco, 12 para el congelado. Pide solo lo necesario o acabará en la basura.", "Les objectifs du palier se vérifient sur <b>une semaine complète</b> : accélérer le temps ne suffit pas. Suis-les dans <b>Bureau › Pilotage</b>.": "Los objetivos del nivel se comprueban durante <b>una semana completa</b>: acelerar el tiempo no basta. Síguelos en <b>Oficina › Gestión</b>.", "Des élévateurs automatiques servent tous les niveaux à hauteur d’homme : tout le monde accède au niveau haut, et chaque niveau gagne 6 cartons.": "Unos elevadores automáticos sirven todos los niveles a la altura de la mano: todo el mundo accede al nivel alto, y cada nivel gana 6 cajas.", "Deux : les entreprises. Recrutez une commerciale, et elle décrochera des contrats B2B : des palettes entières à livrer avant une heure précise.": "Dos: las empresas. Contrate a una comercial y conseguirá contratos B2B: palés enteros que entregar antes de una hora concreta.", "Lyon-Est est devenue la meilleure plateforme du réseau. Le siège prépare déjà la suite : un hub portuaire, avec des conteneurs du monde entier…": "Lyon-Est se ha convertido en la mejor plataforma de la red. La sede ya prepara lo siguiente: un hub portuario, con contenedores de todo el mundo…", "Le goulot d’étranglement est l’étape où les commandes s’accumulent : c’est là qu’il faut ajouter des bras, un poste ou changer l’organisation.": "El cuello de botella es la etapa donde se acumulan los pedidos: ahí es donde hay que añadir brazos, un puesto o cambiar la organización.", "Paris-Sud, 5 h 55. Un hangar blanc immaculé, un sol bleu, et un léger bourdonnement électrique. Les robots attendent leurs premières missions.": "Paris-Sud, 5 h 55. Una nave blanca inmaculada, un suelo azul y un leve zumbido eléctrico. Los robots esperan sus primeras misiones.", "Ton premier <b>robot préparateur</b> est en service. Il travaille jour et nuit, sans salaire, mais il consomme de l’énergie (charges du soir).": "Tu primer <b>robot preparador</b> está en servicio. Trabaja día y noche, sin salario, pero consume energía (cargos de la tarde).", "Les articles les plus vendus (classe A) sont rangés près de l’emballage, les moins vendus (C) au fond. Moins de marche pour les préparateurs.": "Los artículos más vendidos (clase A) se colocan cerca del embalaje, los menos vendidos (C) al fondo. Menos caminata para los preparadores.", "Rassemble les articles sur la <b>palette B2B</b> (zone orange, près de l’emballage). Tes préparateurs aident quand ils n’ont pas de commande.": "Reúne los artículos en el <b>palé B2B</b> (zona naranja, cerca del embalaje). Tus preparadores ayudan cuando no tienen pedidos.", "Tu peux aussi <b>parler à chaque opérateur</b> : approche-toi, mains vides. Ils te disent comment ils vont… et ce qui coince sur le terrain.": "También puedes <b>hablar con cada operario</b>: acércate con las manos vacías. Te cuentan cómo están… y qué falla sobre el terreno.", "Un chariot élévateur et ta formation CACES R489 (obligatoire pour le conduire) : 12 cartons, plus rapide, et accès au niveau haut des racks.": "Una carretilla elevadora y tu formación CACES R489 (obligatoria para conducirla): 12 cajas, más rápido, y acceso al nivel alto de las estanterías.", "Aujourd’hui, vous dirigez la logistique de Colibox de la Terre jusqu’aux étoiles. Le conseil d’administration vous nomme directeur général.": "Hoy dirige la logística de Colibox desde la Tierra hasta las estrellas. El consejo de administración le nombra director general.", "Bonne nouvelle : tu peux maintenant recruter des <b>caristes</b> (Bureau › Équipe). Ils rangent en réserve et réapprovisionnent tout seuls.": "Buena noticia: ya puedes contratar <b>carretilleros</b> (Oficina › Equipo). Guardan en la reserva y reponen ellos solos.", "Charge les colis express dans les <b>conteneurs aériens</b> (zone rouge du quai). Le convoyeur et le tri automatique savent aussi le faire.": "Carga los paquetes exprés en los <b>contenedores aéreos</b> (zona roja del muelle). El transportador y el clasificador automático también saben hacerlo.", "La chambre froide est prête. Le frais rapporte peu par article, mais les clients en commandent tous les jours. Attention aux dates limites.": "La cámara frigorífica está lista. Lo fresco deja poco margen por artículo, pero los clientes lo piden todos los días. Cuidado con las fechas de caducidad.", "À gauche, les <b>baies à conteneurs</b>. Toutes les 4 heures, un navire y dépose les conteneurs de tes commandes en <b>import maritime</b>.": "A la izquierda, las <b>bahías de contenedores</b>. Cada 4 horas, un barco deja allí los contenedores de tus pedidos de <b>importación marítima</b>.", "Dernière étape : le <b>bureau</b> (à gauche, ou le bouton « Bureau » en haut) sert à commander du stock, recruter et améliorer l’entrepôt.": "Última etapa: la <b>oficina</b> (a la izquierda, o el botón «Oficina» arriba) sirve para pedir stock, contratar y mejorar el almacén.", "Chef, la réception déborde : le camion attend et le stock n’arrive plus en rayon. Il nous faut un réceptionnaire de plus, ou un cariste.": "Jefe, la recepción está desbordada: el camión espera y el stock ya no llega a las estanterías. Necesitamos un recepcionista más, o un carretillero.", "Cinq minutes debout devant le tableau : chacun sait quoi faire, et l’équipe démarre plus soudée (+5 % de rythme sur ce poste, moral +3).": "Cinco minutos de pie delante del tablero: cada uno sabe qué hacer y el equipo arranca más unido (+5 % de ritmo en este turno, moral +3).", "Trois : négociez avec vos fournisseurs. Objectifs : 12 gammes, 8 contrats B2B livrés, 4,3 ★, 35 000 € et un stock fiable à plus de 97 %.": "Tres: negocie con sus proveedores. Objetivos: 12 gamas, 8 contratos B2B entregados, 4,3 ★, 35 000 € y un stock fiable a más del 97 %.", "Chef, je ne vais pas vous mentir, l’ambiance est tendue. On enchaîne sans souffler… Une salle de pause ou une prime, ça ferait du bien.": "Jefe, no voy a mentirle, el ambiente está tenso. Encadenamos sin respirar… Una sala de descanso o una prima nos vendría bien.", "Nouvelles gammes aussi : la pharmacie, avec un contrôle qualité à l’emballage, et le luxe, qui doit être rangé dans une cage sécurisée.": "También nuevas gamas: la farmacia, con un control de calidad en el embalaje, y el lujo, que debe guardarse en una jaula de seguridad.", "Prépare-toi : du stock en avance, toutes les équipes au complet. Moins de 15 % d’annulations, et l’événement est une réussite (+0,3 ★).": "Prepárate: stock por adelantado, todos los turnos al completo. Menos de un 15 % de cancelaciones y el evento será un éxito (+0,3 ★).", "Les représentants du personnel demandent une hausse de salaire : « On tient la cadence, on veut que ça se voie sur la fiche de paie. »": "Los representantes de los trabajadores piden una subida salarial: «Aguantamos el ritmo y queremos que se note en la nómina».", "Palette complète : <b>filme-la</b> (ou laisse faire un expéditeur). Elle partira avec le prochain camion. Attention à l’heure limite !": "Palé completo: <b>fílmalo</b> (o deja que lo haga un expedidor). Saldrá con el próximo camión. ¡Cuidado con la hora límite!", "Tes drones livrent les petites commandes urgentes (une seule pièce, étiquette « drone ») en 20 minutes. Elles rapportent 30 % de plus.": "Tus drones entregan los pequeños pedidos urgentes (una sola pieza, etiqueta «dron») en 20 minutos. Rinden un 30 % más.", "Titulaire du CACES R489, conduit un chariot élévateur : range en réserve (niveau haut) et réapprovisionne les emplacements de picking.": "Titular del CACES R489, conduce una carretilla elevadora: guarda en la reserva (nivel alto) y repone las ubicaciones de picking.", "Calcule pour chaque article un seuil et une quantité de commande à partir de ses ventes réelles et du niveau de service que tu vises.": "Calcula para cada artículo un punto de pedido y una cantidad de pedido a partir de sus ventas reales y del nivel de servicio que buscas.", "Chaque membre d’équipage consomme de l’oxygène. Sous 30 %, tout le monde ralentit et le moral chute. La jauge est en haut de l’écran.": "Cada miembro de la tripulación consume oxígeno. Por debajo del 30 %, todo el mundo se ralentiza y la moral cae. El indicador está arriba en la pantalla.", "Range un carton tout en haut avec ton chariot : approche-toi d’un emplacement et range, le chariot remplit d’abord le bas puis monte.": "Guarda una caja arriba del todo con tu carretilla: acércate a una ubicación y guarda; la carretilla llena primero la parte baja y luego sube.", "démissionné. Un moral trop bas pendant plusieurs jours fait fuir les gens : pense aux pauses, aux primes et aux plannings équilibrés.": "ha dimitido. Una moral demasiado baja durante varios días hace que la gente se vaya: piensa en las pausas, las primas y las planificaciones equilibradas.", "Achète des <b>cartouches</b> (onglet Améliorer) ou installe un <b>recycleur d’oxygène</b>. Au niveau 3, la station devient autonome.": "Compra <b>cartuchos</b> (pestaña Mejorar) o instala un <b>reciclador de oxígeno</b>. En el nivel 3, la estación se vuelve autónoma.", "Apporte le bac au <b>poste d’emballage</b> (la machine à droite) : l’article y est mis dans un carton d’expédition, c’est ton colis.": "Lleva la cubeta al <b>puesto de embalaje</b> (la máquina de la derecha): allí el artículo se mete en una caja de envío; es tu paquete.", "Pose les colis marqués « drone » sur la <b>piste des drones</b> (en bas). Les drones décollent seuls, puis se rechargent 15 minutes.": "Deja los paquetes marcados «dron» en la <b>pista de drones</b> (abajo). Los drones despegan solos y luego se recargan 15 minutos.", "Chef, une palette B2B doit partir dans moins de deux heures ! Si on la rate, le client paiera moins… et il ne nous rappellera pas.": "¡Jefe, un palé B2B tiene que salir en menos de dos horas! Si lo perdemos, el cliente pagará menos… y no volverá a llamarnos.", "Monte ton colis sur une <b>palette d’expédition</b> du quai (zone verte). Un camion part toutes les 30 minutes avec les palettes.": "Sube tu paquete a un <b>palé de expedición</b> del muelle (zona verde). Un camión sale cada 30 minutos con los palés.", "Le chauffeur décharge une palette : 6 cartons sont écrasés, le film est déchiré. Il attend ta signature sur le bon de livraison.": "El conductor descarga un palé: 6 cajas están aplastadas y el film está roto. Espera tu firma en el albarán de entrega.", "Lyon-Est, 5 h 50. Trois quais, des semi-remorques qui manœuvrent, une chambre froide qui ronronne. Les néons s’allument un à un.": "Lyon-Est, 5 h 50. Tres muelles, semirremolques maniobrando, una cámara frigorífica que ronronea. Los fluorescentes se encienden uno a uno.", "Quand une équipe part, la suivante prend la relève. Pour finir le palier, il te faudra <b>3 équipes d’au moins 2 personnes</b>.": "Cuando un turno se va, el siguiente toma el relevo. Para terminar el nivel, necesitarás <b>3 turnos de al menos 2 personas</b>.", "Zone artisanale de Valmont, 7 h 58. Un vieil entrepôt aux murs lavande, un parking vide… et une pancarte : « Colibox recrute ».": "Polígono de Valmont, 7 h 58. Un viejo almacén de paredes lavanda, un aparcamiento vacío… y un cartel: «Colibox contrata».", ") est sous l’objectif : trop de commandes en retard ou annulées. Regarde où ça coince : réception, préparation ou emballage ?": ") está por debajo del objetivo: demasiados pedidos con retraso o cancelados. Mira dónde está el atasco: ¿recepción, preparación o embalaje?", "Sofia, commerciale. J’ai déjà trois clients en tête : un hôtel, une mairie, un camping. Je vous envoie les offres au bureau !": "Sofia, comercial. Ya tengo tres clientes en mente: un hotel, un ayuntamiento, un camping. ¡Le envío las ofertas a la oficina!", "Sofia va décrocher des <b>contrats B2B</b> : des commandes d’entreprises, à valider dans le bureau, onglet <b>Commandes</b>.": "Sofia conseguirá <b>contratos B2B</b>: pedidos de empresas que hay que validar en la oficina, pestaña <b>Pedidos</b>.", "Après plusieurs accidents, l’inspection du travail visite le site : formation, équipements, organisation… tout est vérifié.": "Tras varios accidentes, la inspección de trabajo visita el centro: formación, equipos, organización… se revisa todo.", "La <b>maintenance préventive</b> divise les pannes par deux, et les <b>panneaux solaires</b> allègent la facture d’énergie.": "El <b>mantenimiento preventivo</b> divide las averías por dos, y los <b>paneles solares</b> aligeran la factura de energía.", "On y est. La première station logistique en orbite. Colibox livre désormais la Lune, Mars… et tous ceux qui vivent là-haut.": "Ya está. La primera estación logística en órbita. Colibox entrega ahora en la Luna, Marte… y a todos los que viven allí arriba.", "Un trieur envoie chaque colis directement à sa bonne destination (quai, avion, piste des drones), plus besoin d’expéditeur.": "Un clasificador envía cada paquete directamente a su destino correcto (muelle, avión, pista de drones): ya no hace falta expedidor.", "Cent trente lancements parfaits plus tard, le dernier vaisseau de la journée s’éloigne vers Mars dans un éclat de lumière.": "Ciento treinta lanzamientos perfectos después, la última nave del día se aleja hacia Marte en un destello de luz.", "Contrôle douanier sur ce conteneur. Il restera fermé quelques heures… à moins que vous ne régliez les frais tout de suite.": "Control aduanero en este contenedor. Permanecerá cerrado unas horas… a menos que pague los gastos ahora mismo.", "Le siège vient de me nommer directrice nationale. Et j’ai besoin de vous à Lyon-Est : notre nouvelle plateforme régionale.": "La sede acaba de nombrarme directora nacional. Y le necesito en Lyon-Est: nuestra nueva plataforma regional.", "La gamme <b>Luxe</b> se range uniquement dans la <b>cage sécurisée</b> (à gauche). Équipe-la au bureau avant de l’ouvrir.": "La gama <b>Lujo</b> se guarda únicamente en la <b>jaula de seguridad</b> (a la izquierda). Equípala en la oficina antes de abrirla.", "Premier colis livré ! Nos clients adorent les livraisons rapides : chaque colis à l’heure fait monter votre satisfaction.": "¡Primer paquete entregado! A nuestros clientes les encantan las entregas rápidas: cada paquete a tiempo hace subir su satisfacción.", "Roissy, zone cargo, 5 h 30. Le grondement des réacteurs couvre tout. Sur le tarmac, un avion-cargo attend, soute ouverte.": "Roissy, zona de carga, 5 h 30. El rugido de los reactores lo cubre todo. En la pista, un avión de carga espera con la bodega abierta.", "Des emplacements de picking sont vides alors qu’il reste du stock en réserve. Il faudrait descendre la réserve plus tôt.": "Hay ubicaciones de picking vacías cuando aún queda stock en reserva. Habría que bajar la reserva antes.", "Fos-sur-Mer, 5 h 45. L’odeur de sel, le cri des mouettes, et un porte-conteneurs qui manœuvre lentement le long du quai.": "Fos-sur-Mer, 5 h 45. Olor a sal, el grito de las gaviotas y un portacontenedores que maniobra lentamente a lo largo del muelle.", "Voici le centre le plus moderne de Colibox. Ici, vous pourrez tout automatiser : préparation, réception, emballage, tri.": "Este es el centro más moderno de Colibox. Aquí podrá automatizarlo todo: preparación, recepción, embalaje, clasificación.", "des lignes de commande sont arrivées sans stock. Revois tes seuils de commande : délai fournisseur et stock de sécurité.": "de las líneas de pedido han llegado sin stock. Revisa tus puntos de pedido: plazo del proveedor y stock de seguridad.", "Les palettes d’expédition pleines sont filmées automatiquement, et toutes les palettes juste avant le départ du camion.": "Los palés de expedición llenos se filman automáticamente, y todos los palés justo antes de la salida del camión.", "Parfait ! Vous avez fait tout le circuit d’une commande. À partir de maintenant, les clients vont commander en continu.": "¡Perfecto! Ha hecho todo el circuito de un pedido. A partir de ahora, los clientes van a hacer pedidos de forma continua.", "Quand un conteneur arrive, va le <b>dépoter</b> : approche-toi de sa porte et prends les cartons comme sur une palette.": "Cuando llegue un contenedor, ve a <b>desconsolidarlo</b>: acércate a su puerta y coge las cajas como en un palé.", "Sans WMS, c’est toi qui déclenches les commandes : bouton « Commander les articles sous le seuil » dans chaque gamme.": "Sin WMS, eres tú quien lanza los pedidos: botón «Pedir los artículos bajo el punto de pedido» en cada gama.", ": recrutement coûteux (annonces, entretiens), arrive dans 2 jours, payé même les jours calmes et pendant ses arrêts,": ": contratación costosa (anuncios, entrevistas), llega en 2 días, cobra incluso los días tranquilos y durante sus bajas,", "Chef… on a dû jeter des produits frais. Il faut les ranger au froid plus vite, et ne pas trop en commander d’avance.": "Jefe… hemos tenido que tirar productos frescos. Hay que guardarlos en frío más rápido y no pedir demasiado por adelantado.", "Un gros client annonce un audit demain : il vérifiera tes erreurs de préparation et la propreté (5S) de l’entrepôt.": "Un cliente importante anuncia una auditoría mañana: revisará tus errores de preparación y la limpieza (5S) del almacén.", "Une vraie équipe du soir ! C’est là que les clients commandent le plus : vous allez le sentir dans la satisfaction.": "¡Un turno de noche de verdad! Es cuando más piden los clientes: lo notará en la satisfacción.", "Pour le faire baisser : moins de déplacements (ABC), moins d’attentes (réappro, flux équilibrés), moins d’erreurs.": "Para reducirlo: menos desplazamientos (ABC), menos esperas (reposición, flujos equilibrados), menos errores.", "On tombe souvent sur des emplacements vides alors que l’écran dit qu’il y a du stock. Un inventaire serait utile.": "A menudo encontramos ubicaciones vacías cuando la pantalla dice que hay stock. Un inventario vendría bien.", "Les premiers colis de Lyon-Est sont partis ! Les semi-remorques passent toutes les 15 minutes, on a de la marge.": "¡Los primeros paquetes de Lyon-Est han salido! Los semirremolques pasan cada 15 minutos, tenemos margen.", "Chef, il y a des cartons qui volent dans l’allée ! Je les attrape, mais il faudrait vraiment arrimer ces racks.": "¡Jefe, hay cajas volando por el pasillo! Las voy cogiendo, pero de verdad habría que sujetar esas estanterías.", "Je me souviens de vous, seul dans ce petit entrepôt lavande de Valmont, avec un transpalette et trois palettes.": "Le recuerdo a usted, solo en ese pequeño almacén lavanda de Valmont, con una transpaleta y tres palés.", "Station Horizon, orbite basse. 400 kilomètres sous vos pieds, la Terre tourne lentement, bleue et silencieuse.": "Estación Horizon, órbita baja. 400 kilómetros bajo sus pies, la Tierra gira despacio, azul y silenciosa.", "Un chariot élévateur ! Vous allez pouvoir stocker en hauteur. Les racks sont maintenant disponibles au bureau.": "¡Una carretilla elevadora! Va a poder almacenar en altura. Las estanterías ya están disponibles en la oficina.", "Ouvre le <b>Bureau</b>, onglet <b>Équipe</b> : tu y vois chaque équipe, avec l’énergie et le moral de chacun.": "Abre la <b>Oficina</b>, pestaña <b>Equipo</b>: verás cada turno, con la energía y la moral de cada uno.", "Apporte ici les colis emballés pour monter les palettes d’expédition : un camion part toutes les 30 minutes.": "Trae aquí los paquetes embalados para montar los palés de expedición: un camión sale cada 30 minutos.", "Il fait 36 °C dans l’entrepôt. Les équipes se fatiguent beaucoup plus vite et le risque d’accident augmente.": "Hace 36 °C en el almacén. Los equipos se cansan mucho más rápido y el riesgo de accidente aumenta.", "J’ai mal au dos depuis quelques jours… Porter et me pencher toute la journée, ça commence à faire beaucoup.": "Me duele la espalda desde hace unos días… Cargar y agacharme todo el día empieza a ser demasiado.", "Recrute une chargée de communication (bureau agrandi niveau 3) pour organiser soldes, Black Friday et Noël.": "Contrata a una responsable de comunicación (oficina ampliada nivel 3) para organizar rebajas, Black Friday y Navidad.", "Trois quais, des semi-remorques et une chambre froide. L’entrepôt tourne de 6 h à minuit en trois équipes.": "Tres muelles, semirremolques y una cámara frigorífica. El almacén funciona de 6 h a medianoche en tres turnos.", "Un intérimaire coûte 60 % de plus et travaille moins vite. Sinon, c’est à toi de compenser sur le terrain.": "Un temporal cuesta un 60 % más y trabaja más despacio. Si no, te toca compensar sobre el terreno.", "Bienvenue au hub portuaire ! D’ici, Colibox importe des meubles et du matériel de jardin du monde entier.": "¡Bienvenido al hub portuario! Desde aquí, Colibox importa muebles y material de jardín de todo el mundo.", "Merci d’avoir joué à Warehouse. Tu peux continuer à faire tourner la station aussi longtemps que tu veux.": "Gracias por jugar a Warehouse. Puedes seguir haciendo funcionar la estación todo el tiempo que quieras.", "Six mois plus tard. Valmont est devenu le site modèle de Colibox, et le téléphone sonne un dimanche soir.": "Seis meses después. Valmont se ha convertido en el centro modelo de Colibox, y el teléfono suena un domingo por la noche.", "Le convoyeur tourne : vos colis partent seuls vers le quai. On commence à parler de votre site au siège.": "El transportador está en marcha: sus paquetes salen solos hacia el muelle. En la sede empiezan a hablar de su centro.", "Les articles de <b>pharmacie</b> demandent un contrôle qualité : leur emballage prend 3 minutes de plus.": "Los artículos de <b>farmacia</b> requieren un control de calidad: su embalaje lleva 3 minutos más.", "Un peu de comptage chaque jour (50 à 120 €/jour) : la précision du stock remonte au lieu de se dégrader.": "Un poco de recuento cada día (de 50 a 120 €/día): la precisión del stock sube en lugar de degradarse.", "Le WMS commande seul chaque article dont le stock (y compris ce qui est en route) passe sous son seuil.": "El WMS pide solo cada artículo cuyo stock (incluido lo que está en camino) baja de su punto de pedido.", "Beaucoup de commandes attendent un article en rupture. Les seuils de commande sont peut-être trop bas.": "Muchos pedidos esperan un artículo en rotura. Puede que los puntos de pedido sean demasiado bajos.", "Les transports en commun seront en grève demain : plusieurs salariés risquent de ne pas pouvoir venir.": "Mañana habrá huelga de transporte público: varios empleados podrían no llegar.", "Pour la suite, le siège regarde vers le ciel : une base aérienne, des drones… On en reparle très vite.": "Para lo siguiente, la sede mira al cielo: una base aérea, drones… Lo hablamos muy pronto.", "Un montant de rack est tordu : le risque d’accident est multiplié par 1,8 tant qu’il n’est pas réparé.": "Un montante de estantería está torcido: el riesgo de accidente se multiplica por 1,8 mientras no se repare.", "Un transitaire s’occupe des formalités : les contrôles douaniers sont rares et ne durent qu’une heure.": "Un transitario se ocupa de los trámites: los controles aduaneros son raros y solo duran una hora.", "Une influenceuse vient de parler de vos produits. Le service client prévoit +40 % de commandes demain.": "Una influencer acaba de hablar de sus productos. El servicio de atención al cliente prevé +40 % de pedidos mañana.", "devient chef d’équipe : il épaule son équipe (+5 % de rythme, moral meilleur) contre +15 % de salaire.": "pasa a ser jefe de equipo: apoya a su turno (+5 % de ritmo, mejor moral) a cambio de +15 % de salario.", "L’oxygène baisse dangereusement. L’équipe s’essouffle : il faut des cartouches ou un recycleur, vite.": "El oxígeno baja peligrosamente. El equipo se queda sin aliento: hacen falta cartuchos o un reciclador, rápido.", "Objectif final : 18 gammes, 130 lancements réussis, 4,3 ★ et 250 000 €. Après ça… vous aurez tout vu.": "Objetivo final: 18 gamas, 130 lanzamientos con éxito, 4,3 ★ y 250 000 €. Después de eso… lo habrá visto todo.", "Bastien, maintenance. Un robot qui tousse, un tapis qui grince : je m’en occupe. Vous, vous pilotez.": "Bastien, mantenimiento. Un robot que tose, una cinta que chirría: yo me encargo. Usted pilote.", "Le chariot élévateur fuit et refuse de lever. Sans lui, personne n’accède au niveau haut des racks.": "La carretilla elevadora pierde aceite y no levanta. Sin ella, nadie accede al nivel alto de las estanterías.", "Ton chariot n’a pas été contrôlé : une fuite hydraulique n’a pas été vue, il est immobilisé demain.": "Tu carretilla no se ha revisado: no se vio una fuga hidráulica y queda inmovilizada mañana.", "Vous voilà dans la cour des grands : la livraison express mondiale. Ici, l’avion n’attend personne.": "Ya juega en las grandes ligas: la entrega exprés mundial. Aquí el avión no espera a nadie.", "Gère les absences (intérimaires appelés automatiquement), suit le moral et l’améliore chaque jour.": "Gestiona las ausencias (temporales llamados automáticamente), sigue la moral y la mejora cada día.", "Les <b>racks magnétiques</b> (Améliorer) gardent les cartons arrimés : cinq fois moins de dérives.": "Las <b>estanterías magnéticas</b> (Mejorar) mantienen las cajas sujetas: cinco veces menos desviaciones.", "Aïe, des colis express ont raté leur vol. Les clients vont les recevoir plus tard… et moins cher.": "Vaya, unos paquetes exprés han perdido su vuelo. Los clientes los recibirán más tarde… y más baratos.", "est arrêté 5 jours : troubles musculo-squelettiques. La pénibilité de son poste était trop forte.": "está de baja 5 días: trastornos musculoesqueléticos. La penosidad de su puesto era demasiado alta.", "La logistique est plus accidentogène que la moyenne, et les accidents y sont plus graves (INRS).": "La logística tiene más siniestralidad que la media, y los accidentes son más graves (INRS).", "Le camion fournisseur attend depuis plus d’une heure : frais d’immobilisation facturés (30 €/h).": "El camión del proveedor lleva esperando más de una hora: se facturan gastos de inmovilización (30 €/h).", "Objectifs : 16 gammes, 90 vols complets à l’heure, 400 livraisons par drone, 4,3 ★ et 200 000 €.": "Objetivos: 16 gamas, 90 vuelos completos a tiempo, 400 entregas con dron, 4,3 ★ y 200 000 €.", "Bonjour ! Je suis Mme Laurent, directrice régionale de Colibox. Bienvenue dans votre entrepôt.": "¡Buenos días! Soy la Sra. Laurent, directora regional de Colibox. Bienvenido a su almacén.", "Tables élévatrices, préhenseurs, tapis anti-fatigue : la pénibilité des postes baisse de 40 %.": "Mesas elevadoras, manipuladores, alfombras antifatiga: la penosidad de los puestos baja un 40 %.", "Un centre robotisé rentable, des clients ravis et des équipes sereines. Je suis fière de vous.": "Un centro robotizado rentable, clientes encantados y equipos tranquilos. Estoy orgullosa de usted.", "du travail cette semaine. La fatigue, les heures sup et les racks abîmés augmentent le risque.": "laborales esta semana. La fatiga, las horas extra y las estanterías dañadas aumentan el riesgo.", "Chef, regardez la taille de ces conteneurs… On va avoir besoin de bras pour dépoter tout ça !": "Jefe, mire el tamaño de esos contenedores… ¡Vamos a necesitar brazos para desconsolidar todo eso!", "Honnêtement, je ne me sens pas trop reconnu ici. On fait le boulot, mais personne ne le voit.": "Sinceramente, no me siento muy valorado aquí. Hacemos el trabajo, pero nadie lo ve.", "La banque te laisse jusqu’à demain soir pour repasser au-dessus de −300 €. Limite les achats.": "El banco te da hasta mañana por la tarde para volver a superar los −300 €. Limita las compras.", "commandes de plus par jour une fois lancée (démarrage progressif sur 5 jours) · marge moyenne": "pedidos más al día una vez lanzada (arranque progresivo en 5 días) · margen medio", "Ça déborde ! Pensez à recruter au bureau : un préparateur et un emballeur vous soulageraient.": "¡Esto se desborda! Piense en contratar en la oficina: un preparador y un embalador le aliviarían.", "Recrute une commerciale (bureau agrandi niveau 2) pour décrocher des contrats d’entreprises.": "Contrata a una comercial (oficina ampliada nivel 2) para conseguir contratos con empresas.", "Un chariot a heurté un montant de rack : il est tordu. Les racks abîmés peuvent s’effondrer.": "Una carretilla ha golpeado un montante de estantería: está torcido. Las estanterías dañadas pueden derrumbarse.", "Décroche des contrats B2B : de grosses commandes d’entreprises, livrées sur palette filmée.": "Consigue contratos B2B: grandes pedidos de empresas, entregados en palé filmado.", "Un carton trop lourd (plus de 25 kg), on le porte à deux ou avec une aide à la manutention.": "Una caja demasiado pesada (más de 25 kg) se lleva entre dos o con una ayuda a la manipulación.", "Les caristes viennent ici recharger leur chariot et faire leur contrôle avant utilisation.": "Los carretilleros vienen aquí a recargar su carretilla y a hacer su revisión antes de usarla.", "Très belle semaine : clients servis, équipes en forme, comptes au vert. Continue comme ça.": "Muy buena semana: clientes servidos, equipos en forma, cuentas en verde. Sigue así.", "Vous avez fait de Roissy une référence mondiale. Il ne reste qu’une frontière à franchir…": "Ha hecho de Roissy una referencia mundial. Solo queda una frontera por cruzar…", "Chef ! J’ai demandé ma mutation, avec quelques anciens de Valmont. On ne vous lâche pas.": "¡Jefe! He pedido el traslado, con algunos veteranos de Valmont. No le vamos a dejar solo.", "La trésorerie est restée dans le rouge deux jours de suite. La direction ferme le site.": "La tesorería ha estado en números rojos dos días seguidos. La dirección cierra el centro.", "Les équipements sont livrés et installés de nuit : ils fonctionnent le lendemain matin.": "Los equipos se entregan e instalan por la noche: funcionan a la mañana siguiente.", "Prélève les articles des commandes (niveaux bas et milieu) et les dépose à l’emballage.": "Extrae los artículos de los pedidos (niveles bajo y medio) y los deja en el embalaje.", "Toutes les palettes sont pleines ou filmées : filme-les, ou attends le prochain départ.": "Todos los palés están llenos o filmados: fílmalos o espera a la próxima salida.", "Recompter une partie des emplacements remet la précision du stock à jour (actuellement": "Recontar una parte de las ubicaciones actualiza la precisión del stock (actualmente", "Réserves notées sur le bon de livraison : le fournisseur rembourse les cartons abîmés.": "Reservas anotadas en el albarán: el proveedor reembolsa las cajas dañadas.", "Le premier drone est revenu sans une égratignure. Je surveille les batteries, promis.": "El primer dron ha vuelto sin un rasguño. Vigilo las baterías, prometido.", "Ton chariot a été contrôlé aujourd’hui. Les caristes rechargent ici leurs batteries.": "Tu carretilla se ha revisado hoy. Los carretilleros recargan aquí sus baterías.", "Un avion rien que pour nos colis… Chef, vous vous rendez compte d’où on est partis ?": "Un avión solo para nuestros paquetes… Jefe, ¿se da cuenta de dónde partimos?", ": les préparateurs trouvent des emplacements vides. Fais des inventaires tournants.": ": los preparadores encuentran ubicaciones vacías. Haz inventarios cíclicos.", "Le chauffeur refuse les palettes non filmées : elles attendront le prochain départ.": "El conductor rechaza los palés sin filmar: esperarán a la próxima salida.", "Toutes les palettes B2B sont occupées : agrandis la zone B2B ou termine un contrat.": "Todos los palés B2B están ocupados: amplía la zona B2B o termina un contrato.", "Accepte un contrat B2B au bureau (onglet Commandes) pour préparer une palette ici.": "Acepta un contrato B2B en la oficina (pestaña Pedidos) para preparar un palé aquí.", "Chariots : on ne circule jamais dans une allée où travaille un préparateur à pied.": "Carretillas: nunca se circula por un pasillo donde trabaja un preparador a pie.", "Chef ! Un des robots s’est figé au milieu de l’allée. On fait quoi, on le pousse ?": "¡Jefe! Uno de los robots se ha quedado parado en medio del pasillo. ¿Qué hacemos, lo empujamos?", "Port de charges : on plie les jambes, le dos reste droit, la charge près du corps.": "Levantamiento de cargas: se doblan las piernas, la espalda recta, la carga cerca del cuerpo.", "pour la journée : il recompte une trentaine d’emplacements sans ralentir l’équipe.": "para el día: recuenta una treintena de ubicaciones sin ralentizar al equipo.", "Gratuit pour l’instant, mais risque d’accident ×1,8 tant que ce n’est pas réparé.": "Gratis por ahora, pero riesgo de accidente ×1,8 mientras no se repare.", "Inventaire : 8 emplacements à recompter (📋). Va devant et appuie sur « Compter ».": "Inventario: 8 ubicaciones por recontar (📋). Ponte delante y pulsa «Contar».", "Les salariés fatigués y récupèrent leur énergie, et le moral remonte chaque jour.": "Los empleados cansados recuperan allí su energía, y la moral sube cada día.", "Produits futuristes, apesanteur et un vaisseau qui vient chercher la marchandise.": "Productos futuristas, ingravidez y una nave que viene a buscar la mercancía.", "Des robots… Bon. Tant qu’ils ne prennent pas ma place à la machine à café, chef.": "Robots… Bueno. Mientras no me quiten el sitio en la máquina de café, jefe.", "Lance d’abord ton activité actuelle correctement : taux de service de la semaine": "Primero haz funcionar bien tu actividad actual: nivel de servicio de la semana", "Rien n’entre en stock, le fournisseur la reprend et relivre au prochain créneau.": "No entra nada en stock; el proveedor la recoge y la vuelve a entregar en la próxima franja.", "Je vous en reparle très vite. En attendant, profitez : vous l’avez bien mérité.": "Le hablaré de ello muy pronto. Mientras tanto, disfrute: se lo ha ganado.", "Taux d’erreur = lignes fausses ÷ lignes préparées. Les bons entrepôts sont sous": "Tasa de error = líneas erróneas ÷ líneas preparadas. Los buenos almacenes están por debajo del", "Un petit hangar, un camion, et toi. Tu apprends tout le circuit d’une commande.": "Una pequeña nave, un camión, y tú. Aprendes todo el circuito de un pedido.", ": chaque retour coûte cher. Contrôle au poste d’emballage, formation, ou scan.": ": cada devolución sale cara. Control en el puesto de embalaje, formación o escaneo.", "Toutes les baies sont occupées : les conteneurs attendront le prochain navire.": "Todas las bahías están ocupadas: los contenedores esperarán al próximo barco.", "\">Calculer article par article</button> (ventes récentes, délai fournisseur, ": "\">Calcular artículo por artículo</button> (ventas recientes, plazo del proveedor, ", "Le ravitaillement arrive par <b>navette</b>, à la réception, comme un camion.": "El avituallamiento llega en <b>lanza pe de la réception, vous pouvez compter sur moi.": "¡Buenos días, jefe! Me encargo de la recepción, puede contar conmigo.", "L’agence ne peut pas envoyer plus de 3 personnes par équipe aujourd’hui.": "La ETT no puede enviar más de 3 personas por turno hoy.", "Organise les grands événements commerciaux : soldes, Black Friday, Noël.": "Organiza los grandes eventos comerciales: rebajas, Black Friday, Navidad.", "Premier vol complet et à l’heure ! À Roissy, la ponctualité, c’est tout.": "¡Primer vuelo completo y a tiempo! En Roissy, la puntualidad lo es todo.", ") est en préparation : tu peux continuer à faire tourner cet entrepôt.": ") está en preparación: puedes seguir haciendo funcionar este almacén.", "8 emplacements marqués 📋 : va devant chacun et appuie sur « Compter ».": "8 ubicaciones marcadas 📋: ponte delante de cada una y pulsa «Contar».", "Je suis épuisé, chef. Je n’ai pas arrêté depuis le début de mon poste.": "Estoy agotado, jefe. No he parado desde que empezó mi turno.", "là où il y a de la place (sans règle). Le module ABC du WMS change ça.": "donde haya sitio (sin regla). El módulo ABC del WMS cambia eso.", "passera son CACES R489 demain et après-demain, puis deviendra cariste.": "sacará su CACES R489 mañana y pasado mañana, y luego será carretillero.", ") : ils livrent en 20 minutes les petites commandes urgentes du coin.": "): entregan en 20 minutos los pequeños pedidos urgentes de la zona.", "La réception est pleine : le camion attend qu’on libère des palettes.": "La recepción está llena: el camión espera a que se liberen palés.", "Préparez votre combinaison. Le siège construit une station en orbite.": "Prepare su traje. La sede está construyendo una estación en órbita.", "Robots (intégration WCS, montée en charge, retour sur investissement)": "Robots (integración WCS, puesta en marcha, retorno de la inversión)", "Tapis anti-fatigue, rehausse : 150 €. Sa pénibilité baisse fortement.": "Alfombra antifatiga, alza: 150 €. Su penosidad baja mucho.", ") se
