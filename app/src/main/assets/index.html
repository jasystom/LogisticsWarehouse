Pause", "Plaid": "Kuscheldecke", "Plein": "Voll", "Poste": "Arbeitsplatz", "Rayon": "Sortiment", "Space": "Space", "Sport": "Sport", "Stock": "Bestand", "aucun": "keiner", "avion": "Flugzeug", "prête": "bereit", "rangé": "eingelagert", "s ont": "s", "Écart": "Differenz", "échec": "Misserfolg", "Jean": "Jeans", "Luxe": "Luxus", "Mode": "Mode", "Pull": "Pullover", "Quai": "Rampe", "Soir": "Spät", "Vase": "Vase", "Vide": "Leer", "jeté": "weggeworfen", "Bas": "Unten", "Léa": "Léa", "Sas": "Schleuse", "Toi": "Du", "Vol": "Flug", "non": "nein", "oui": "ja", "vol": "Flug", "Des cartons flottent dans l’allée, rattrape-les !": "Kartons schweben im Gang – fang sie ein!", "Un carton flotte dans l’allée, rattrape-le !": "Ein Karton schwebt im Gang – fang ihn ein!", "gammes": "Sortimente"}, "pt": {"Un CDI coûte un recrutement (annonces, entretiens, intégration), un salaire versé même quand l’activité baisse, et des indemnités en cas de licenciement. L’intérim coûte plus cher à l’heure (le « coefficient » de l’agence), mais il s’adapte aux pics : saisons, promotions, absences. Les bons managers gardent un <b>socle de CDI</b> pour la charge régulière et utilisent l’intérim pour les variations, en le réservant à l’avance.": "Um contrato sem termo custa um recrutamento (anúncios, entrevistas, integração), um salário pago mesmo quando a atividade abranda, e indemnizações em caso de despedimento. O trabalho temporário custa mais à hora (o «coeficiente» da agência), mas adapta-se aos picos: épocas, promoções, ausências. Os bons gestores mantêm uma <b>base de contratos sem termo</b> para a carga regular e usam trabalho temporário para as variações, reservando-o com antecedência.", "Sur téléphone : joystick à gauche pour marcher, gros bouton orange pour agir. Sur ordinateur : flèches ou ZQSD, et Espace. Approche-toi d’une palette, d’un emplacement, d’un poste ou du quai : le bouton indique l’action possible. Ton vrai métier de chef : régler les seuils de commande, planifier les équipes, prendre les bonnes décisions face aux imprévus, et tenir tes indicateurs au bilan du vendredi.": "No telemóvel: joystick à esquerda para andar, botão laranja grande para agir. No computador: setas ou WASD, e Espaço. Aproxima-te de uma palete, de uma localização, de um posto ou do cais: o botão indica a ação possível. O teu verdadeiro trabalho de chefe: definir os pontos de encomenda, planear as equipas, tomar as decisões certas perante imprevistos e cumprir os teus indicadores no balanço de sexta-feira.", "Les problèmes se voient sur le terrain avant de se voir dans les chiffres. Le <b>point d’équipe</b> de 5 minutes devant le tableau (objectifs, sécurité, priorités) et les discussions avec les opérateurs font remonter les idées et les difficultés. C’est le principe du « Gemba » du Lean : aller voir là où la valeur se crée.": "Os problemas veem-se no terreno antes de se verem nos números. A <b>reunião de equipa</b> de 5 minutos em frente ao quadro (objetivos, segurança, prioridades) e as conversas com os operadores fazem surgir ideias e dificuldades. É o princípio do «Gemba» do Lean: ir ver onde o valor é criado.", "Ordres de grandeur inspirés de l’INRS (métiers de la logistique), de la CRAMIF et de guides professionnels sur les indicateurs d’entrepôt et l’automatisation. Graphismes : packs « Factory Kit », « Conveyor Kit », « Car Kit », « Mini Characters » et « Tower Defense Kit » de Kenney (kenney.nl), licence CC0.": "Ordens de grandeza inspiradas no INRS (profissões da logística), na CRAMIF e em guias profissionais sobre indicadores de armazém e automação. Grafismos: packs «Factory Kit», «Conveyor Kit», «Car Kit», «Mini Characters» e «Tower Defense Kit» de Kenney (kenney.nl), licença CC0.", "Les manutentions manuelles sont la <b>première cause d’accidents</b> en logistique, et les troubles musculo-squelettiques la première maladie professionnelle (INRS). Prévention : aides à la manutention, articles lourds à mi-hauteur, rotation des postes, formation gestes et postures, pauses.": "A movimentação manual de cargas é a <b>primeira causa de acidentes</b> na logística, e as lesões músculo-esqueléticas a primeira doença profissional (INRS). Prevenção: ajudas à movimentação, artigos pesados a meia altura, rotação de postos, formação em gestos e posturas, pausas.", " jours de salaire d’indemnités s’il faut s’en séparer — mais il progresse et reste. <b>Intérim</b> : plus cher à la journée, sans engagement ; réservé pour la semaine au planning (×1,35) ou en urgence aujourd’hui (×1,6, pas garanti). Un bon intérimaire peut passer en CDI après 3 jours.": " dias de salário de indemnização se for preciso dispensá-lo — mas progride e fica. <b>Trabalho temporário</b>: mais caro por dia, sem compromisso; reservado para a semana no planeamento (×1,35) ou de urgência hoje (×1,6, não garantido). Um bom temporário pode passar a contrato sem termo após 3 dias.", "Environ 20 % des articles font 80 % des ventes (classe A), les suivants jusqu’à 95 % (B), le reste (C). Placer les A près de l’emballage et à hauteur d’homme (la « zone d’or ») réduit les déplacements de <b>15 à 30 %</b>. À refaire régulièrement : les ventes changent avec les saisons.": "Cerca de 20 % dos artigos fazem 80 % das vendas (classe A), os seguintes até 95 % (B), o resto (C). Colocar os A perto da embalagem e à altura do corpo (a «zona de ouro») reduz as deslocações em <b>15 a 30 %</b>. A refazer regularmente: as vendas mudam com as estações.", "Le logiciel de gestion d’entrepôt connaît chaque adresse et chaque carton en temps réel, guide les rangements et propose les réapprovisionnements. Mais <b>il applique tes règles</b> : de mauvais seuils ou une mauvaise règle de rangement donnent de mauvais résultats, plus vite.": "O software de gestão de armazém conhece cada endereço e cada caixa em tempo real, orienta as arrumações e propõe os reabastecimentos. Mas <b>aplica as tuas regras</b>: maus pontos de encomenda ou uma má regra de arrumação dão maus resultados, mais depressa.", "Avec l’expérience seule, un salarié plafonne vite. La <b>formation</b> le fait progresser : plus rapide, moins d’erreurs, plus motivé. Un parcours (formation métier, CACES, chef d’équipe) fidélise aussi les meilleurs, et coûte moins cher qu’un recrutement.": "Só com a experiência, um trabalhador estagna depressa. A <b>formação</b> fá-lo progredir: mais rápido, menos erros, mais motivado. Um percurso (formação profissional, CACES, chefe de equipa) também fideliza os melhores, e custa menos do que um recrutamento.", "Un écart apparaît à chaque erreur de rangement, casse non déclarée ou erreur de prélèvement. Objectif : <b>plus de 98 à 99 % de précision</b>. L’<b>inventaire tournant</b> recompte un peu chaque jour au lieu de fermer l’entrepôt pour un inventaire complet.": "Surge uma discrepância a cada erro de arrumação, quebra não declarada ou erro de recolha. Objetivo: <b>mais de 98 a 99 % de precisão</b>. O <b>inventário rotativo</b> reconta um pouco todos os dias em vez de fechar o armazém para um inventário completo.", "Le stock de <b>prélèvement</b> est au sol ou à hauteur d’homme ; la <b>réserve</b> est en hauteur, accessible au chariot élévateur. Le <b>réapprovisionnement</b> descend la réserve avant que l’emplacement de picking soit vide, sinon le préparateur attend.": "O stock de <b>picking</b> está no chão ou à altura do corpo; a <b>reserva</b> está em altura, acessível ao empilhador. O <b>reabastecimento</b> desce a reserva antes de a localização de picking ficar vazia, senão o preparador fica à espera.", "Stocker coûte cher : en moyenne <b>20 à 25 % de la valeur du stock par an</b> (argent immobilisé, assurance, place, casse, obsolescence). Trop de stock vide la trésorerie ; pas assez provoque des ruptures. Dans le jeu : 0,2 % de la valeur par jour.": "Armazenar custa caro: em média <b>20 a 25 % do valor do stock por ano</b> (dinheiro imobilizado, seguro, espaço, quebras, obsolescência). Stock a mais esvazia a tesouraria; a menos provoca ruturas. No jogo: 0,2 % do valor por dia.", "Quand on commande en réaction aux ruptures (« vite, commandons le double ! »), les variations s’amplifient chez le fournisseur : c’est l’<b>effet coup de fouet</b> du célèbre Beer Game. Mieux vaut des règles stables, basées sur la vraie demande.": "Quando se encomenda em reação às ruturas («depressa, encomendemos o dobro!»), as variações amplificam-se no fornecedor: é o <b>efeito chicote</b> do célebre Beer Game. Mais vale ter regras estáveis, baseadas na procura real.", "La demande varie d’une semaine à l’autre. La prévision part de l’historique et des tendances, mais elle est toujours un peu fausse : c’est pour ça qu’on garde un stock de sécurité, et qu’on <b>revoit ses seuils quand la saison change</b>.": "A procura varia de uma semana para a outra. A previsão parte do histórico e das tendências, mas está sempre um pouco errada: é por isso que se mantém um stock de segurança, e que se <b>revêem os pontos de encomenda quando a estação muda</b>.", "Absentéisme = jours d’absence ÷ jours de travail prévus. Le moral, la pénibilité, les horaires décalés et la reconnaissance pèsent directement dessus. Un départ coûte un recrutement, une formation et des semaines de productivité réduite.": "Absentismo = dias de ausência ÷ dias de trabalho previstos. O moral, o esforço físico, os horários desfasados e o reconhecimento pesam diretamente nele. Uma saída custa um recrutamento, uma formação e semanas de produtividade reduzida.", "Conduire un chariot élévateur demande une formation <b>CACES R489</b> et une autorisation de conduite de l’employeur. Les racks se contrôlent régulièrement : un montant heurté doit être signalé et réparé, sinon la structure peut céder.": "Conduzir um empilhador exige uma formação <b>CACES R489</b> e uma autorização de condução do empregador. As estantes verificam-se regularmente: um montante embatido deve ser assinalado e reparado, senão a estrutura pode ceder.", "On contrôle chaque livraison avant de signer. Une anomalie se note sur le bon de livraison avec des <b>réserves précises</b> (« 6 cartons écrasés »), puis se confirme au transporteur. Sans réserve, le recours devient très difficile.": "Cada entrega é verificada antes de assinar. Uma anomalia anota-se na guia de remessa com <b>reservas precisas</b> («6 caixas esmagadas»), e depois confirma-se à transportadora. Sem reserva, a reclamação torna-se muito difícil.", "Réception → stockage → préparation (le « picking ») → emballage → expédition. La préparation pèse 50 à 70 % des coûts d’exploitation d’un entrepôt e-commerce, surtout à cause des déplacements : c’est là que se gagne la productivité.": "Receção → armazenagem → preparação (o «picking») → embalagem → expedição. A preparação pesa 50 a 70 % dos custos de exploração de um armazém de e-commerce, sobretudo por causa das deslocações: é aí que se ganha produtividade.", "Mais attention : un robot coûte cher, il faut d’abord l’intégrer au système, et il met quelques jours à atteindre son plein rendement. Il ne se fatigue pas… mais il tombe en panne. Calculez bien votre retour sur investissement.": "Mas atenção: um robô custa caro, primeiro é preciso integrá-lo no sistema, e leva alguns dias a atingir o pleno rendimento. Não se cansa… mas avaria. Calcule bem o seu retorno do investimento.", "Stock en temps réel, scan des emplacements (3 fois moins d’erreurs de rangement) et commandes fournisseurs automatiques selon TES seuils. Deux jours d’apprentissage après l’installation (−15 % de productivité).": "Stock em tempo real, leitura das localizações (3 vezes menos erros de arrumação) e encomendas a fornecedores automáticas segundo os TEUS pontos de encomenda. Dois dias de aprendizagem após a instalação (−15 % de produtividade).", "Les articles ne se vendent pas tous autant : un même seuil pour toute la gamme fait des ruptures sur les meilleures ventes et du stock qui dort sur les autres. <button class=\"btn sm\" data-act=\"rpsug\" data-c=\"": "Os artigos não vendem todos o mesmo: um único ponto de encomenda para toda a gama provoca ruturas nos mais vendidos e stock parado nos outros. <button class=\"btn sm\" data-act=\"rpsug\" data-c=\"", "Le camion a déposé des palettes en <b>réception</b> (zone bleue, au fond à gauche). Va prendre des cartons avec le <b>bouton d’action</b>. Chaque couleur d’étiquette correspond à une gamme (ici : Librairie).": "O camião deixou paletes na <b>receção</b> (zona azul, ao fundo à esquerda). Vai buscar caixas com o <b>botão de ação</b>. Cada cor de etiqueta corresponde a uma gama (aqui: Livraria).", "Enfin, avec une chargée de communication, vous pourrez lancer les grands événements : soldes, Black Friday, Noël. Objectifs : 14 gammes, 6 robots, un événement réussi, moins de 1,5 % d’erreurs et 80 000 €.": "Por fim, com uma responsável de comunicação, poderá lançar os grandes eventos: saldos, Black Friday, Natal. Objetivos: 14 gamas, 6 robôs, um evento bem-sucedido, menos de 1,5 % de erros e 80 000 €.", "On compare aux heures disponibles (effectif × durée × rendement, moins les absences). L’intérim réservé à l’avance coûte moins cher et arrive formé ; l’intérim du jour même coûte plus et n’est pas garanti.": "Compara-se com as horas disponíveis (efetivo × duração × rendimento, menos as ausências). O trabalho temporário reservado com antecedência custa menos e chega formado; o temporário do próprio dia custa mais e não é garantido.", "4 étoiles de satisfaction ! Le siège a de grands projets pour vous. Lancez les 8 gammes, gardez 4,3 ★, visez 15 000 € de trésorerie… et tenez une vraie semaine : 92 % de service, moins de 8 % de ruptures.": "4 estrelas de satisfação! A sede tem grandes projetos para si. Lance as 8 gamas, mantenha 4,3 ★, aponte para 15 000 € de tesouraria… e aguente uma semana a sério: 92 % de serviço, menos de 8 % de ruturas.", "Nouveaux défis : des produits frais à garder au froid, des équipes à ménager, des absences imprévues. Objectifs : 10 gammes, 4,3 ★, 20 000 €, et une semaine à plus de 90 % de service avec peu de ruptures.": "Novos desafios: produtos frescos a manter no frio, equipas a poupar, ausências imprevistas. Objetivos: 10 gamas, 4,3 ★, 20 000 €, e uma semana com mais de 90 % de serviço e poucas ruturas.", "Installés de nuit. 3 niveaux par emplacement : bas et milieu pour le picking, haut en réserve (chariot élévateur et CACES). Débloque les caristes. À faire contrôler : un montant heurté doit être réparé.": "Instaladas durante a noite. 3 níveis por localização: baixo e meio para o picking, alto em reserva (empilhador e CACES). Desbloqueia os operadores de empilhador. A inspecionar: um montante embatido deve ser reparado.", "Il manque des bras ? <b>Réserve des intérimaires</b> pour la semaine (moins cher et garanti), ou prévois des <b>heures supplémentaires</b> (plus de fatigue et d’accidents). Planning : Bureau › Équipe.": "Faltam braços? <b>Reserva trabalhadores temporários</b> para a semana (mais barato e garantido), ou prevê <b>horas extraordinárias</b> (mais cansaço e acidentes). Planeamento: Escritório › Equipa.", "(On Time In Full) = commandes livrées à l’heure, complètes et sans erreur ÷ commandes à servir. C’est l’indicateur que le client regarde en premier. Une commande annulée ou fausse compte comme ratée.": "(On Time In Full) = encomendas entregues a horas, completas e sem erro ÷ encomendas a servir. É o indicador que o cliente olha primeiro. Uma encomenda cancelada ou errada conta como falhada.", "Une commande arrive (en haut à droite) ! <b>Prélève</b> l’article demandé : tu le sors de son carton et le mets dans un bac gris. Un point d’exclamation jaune indique l’emplacement où il se trouve.": "Chegou uma encomenda (em cima à direita)! <b>Recolhe</b> o artigo pedido: tira-o da caixa e coloca-o num contentor cinzento. Um ponto de exclamação amarelo indica a localização onde se encontra.", "Exemple : un article se vend 6 fois par jour, le fournisseur livre en une demi-journée → 3 unités consommées pendant l’attente. Si tu recommandes sous 3, tu tombes en rupture avant la livraison.": "Exemplo: um artigo vende-se 6 vezes por dia, o fornecedor entrega em meio dia → 3 unidades consumidas durante a espera. Se voltares a encomendar abaixo de 3, ficas em rutura antes da entrega.", "Chaque emplacement a maintenant <b>3 niveaux</b> : bas et milieu pour le <b>picking</b>, à portée de main, et le <b>haut</b> qui sert de <b>réserve</b>. Seul un chariot élévateur l’atteint.": "Cada localização tem agora <b>3 níveis</b>: baixo e meio para o <b>picking</b>, ao alcance da mão, e o <b>alto</b>, que serve de <b>reserva</b>. Só um empilhador lá chega.", "Pour les ménager : une <b>salle de pause</b> (Améliorer), des <b>primes</b> et des <b>formations</b> (Équipe), et des plannings équilibrés. Les équipes du soir pèsent un peu sur le moral.": "Para os poupar: uma <b>sala de pausa</b> (Melhorar), <b>prémios</b> e <b>formações</b> (Equipa), e planeamentos equilibrados. Os turnos da noite pesam um pouco no moral.", ", avec z = 1,28 pour 90 % de service, 1,65 pour 95 %, 2,33 pour 99 %. Les derniers points de service coûtent beaucoup de stock : 99 % demande presque deux fois plus de sécurité que 90 %.": ", com z = 1,28 para 90 % de serviço, 1,65 para 95 %, 2,33 para 99 %. Os últimos pontos de serviço custam muito stock: 99 % exige quase o dobro da segurança de 90 %.", "Ici, tout part par <b>vaisseau</b>. Il décolle toutes les 3 heures : chaque commande indique sa fenêtre de lancement. Charge les colis dans les <b>sas</b> (zone verte) avant son départ.": "Aqui, tudo parte por <b>nave</b>. Descola de 3 em 3 horas: cada encomenda indica a sua janela de lançamento. Carrega os volumes nas <b>câmaras de transferência</b> (zona verde) antes da partida.", "La prévention paie : <b>formation gestes et postures</b>, <b>aides à la manutention</b>, <b>rotation des postes</b>, pauses. Fatigue et heures sup font grimper les accidents du travail.": "A prevenção compensa: <b>formação em gestos e posturas</b>, <b>ajudas à movimentação</b>, <b>rotação de postos</b>, pausas. O cansaço e as horas extra fazem disparar os acidentes de trabalho.", "Dans le bureau, onglet <b>Stock</b>, choisis le fournisseur de chaque gamme : <b>Standard</b> (prochain créneau), <b>Express</b> (+25 %, 1 h) ou <b>Import</b> (−30 %, par conteneur).": "No escritório, separador <b>Stock</b>, escolhe o fornecedor de cada gama: <b>Standard</b> (próxima janela), <b>Express</b> (+25 %, 1 h) ou <b>Importação</b> (−30 %, por contentor).", "Deux jours d’apprentissage : l’équipe est un peu plus lente le temps de prendre le scanner en main. Le module <b>ABC</b> (Améliorer) range les meilleures ventes près de l’emballage.": "Dois dias de aprendizagem: a equipa fica um pouco mais lenta enquanto se habitua ao leitor. O módulo <b>ABC</b> (Melhorar) arruma os mais vendidos perto da embalagem.", "Trois nouveautés. Un : vous pouvez choisir vos fournisseurs. L’import maritime coûte 30 % moins cher, mais arrive en conteneur, au rythme des navires… et la douane peut en bloquer.": "Três novidades. Uma: pode escolher os seus fornecedores. A importação marítima custa menos 30 %, mas chega em contentor, ao ritmo dos navios… e a alfândega pode retê-los.", "Range ces cartons fournisseur dans un <b>emplacement de stockage</b> (zone jaune) : approche-toi et appuie sur Action. Chaque emplacement accueille une seule référence par niveau.": "Arruma estas caixas do fornecedor numa <b>localização de armazenagem</b> (zona amarela): aproxima-te e carrega em Ação. Cada localização aceita uma única referência por nível.", "Ton WMS est en service. Il passe les commandes fournisseurs tout seul… <b>selon les seuils que tu as réglés</b>. Trop bas : ruptures. Trop hauts : du stock qui dort et qui coûte.": "O teu WMS está em funcionamento. Faz as encomendas aos fornecedores sozinho… <b>segundo os pontos de encomenda que definiste</b>. Demasiado baixos: ruturas. Demasiado altos: stock parado que custa dinheiro.", "Ici l’entrepôt tourne de <b>6 h à minuit</b>, en trois équipes de 6 heures : <b>matin</b>, <b>après-midi</b> et <b>soir</b>. Chaque salarié ne travaille que pendant son équipe.": "Aqui o armazém funciona das <b>6 h à meia-noite</b>, em três turnos de 6 horas: <b>manhã</b>, <b>tarde</b> e <b>noite</b>. Cada trabalhador só trabalha durante o seu turno.", "Bonjour ! Nadia, ressources humaines. Je m’occupe des absences et des intérimaires, et je garde un œil sur le moral de tout le monde. Vous, concentrez-vous sur l’organisation.": "Bom dia! Nadia, recursos humanos. Trato das ausências e dos trabalhadores temporários, e fico de olho no moral de toda a gente. Você concentre-se na organização.", "Attention : votre fournisseur ne livre qu’à heures fixes, avec trois heures de délai. Réglez vos seuils de commande dans le Bureau, onglet Stock, avant de tomber en rupture.": "Atenção: o seu fornecedor só entrega a horas fixas, com três horas de prazo. Defina os seus pontos de encomenda no Escritório, separador Stock, antes de ficar em rutura.", "La chambre froide (en bas à droite) accueille les gammes <b>Frais</b> (étiquette verte claire) et <b>Surgelés</b> (bleu clair). Lance la gamme Frais au bureau, onglet Stock.": "A câmara frigorífica (em baixo à direita) recebe as gamas <b>Frescos</b> (etiqueta verde-clara) e <b>Congelados</b> (azul-claro). Lança a gama Frescos no escritório, separador Stock.", "Les préparateurs à pied ne prennent qu’en bas et au milieu. Quand le bas se vide, descends la réserve : bouton <b>« Réapprovisionner »</b>, mains vides devant l’emplacement.": "Os preparadores a pé só recolhem em baixo e no meio. Quando o nível baixo esvazia, desce a reserva: botão <b>«Reabastecer»</b>, de mãos vazias em frente à localização.", "Chaque matin, quelqu’un peut manquer à l’appel. Un <b>intérimaire</b> le remplace pour la journée, plus cher et moins rapide. Sinon, c’est toi qui compenses sur le terrain.": "Todas as manhãs, alguém pode faltar. Um <b>trabalhador temporário</b> substitui-o durante o dia, mais caro e menos rápido. Senão, és tu que compensas no terreno.", "Chaque vendredi, après le bilan, tu prépares la semaine suivante : la prévision des ventes donne la <b>charge</b> en heures, à comparer à la <b>capacité</b> de tes équipes.": "Todas as sextas-feiras, depois do balanço, preparas a semana seguinte: a previsão de vendas dá a <b>carga</b> em horas, a comparar com a <b>capacidade</b> das tuas equipas.", "Les écarts viennent surtout des erreurs de rangement. Le <b>WMS</b> (scan) les réduit beaucoup, et l’<b>inventaire tournant</b> (Bureau › Stock) remet les compteurs à jour.": "As discrepâncias vêm sobretudo dos erros de arrumação. O <b>WMS</b> (leitura) reduz-nas muito, e o <b>inventário rotativo</b> (Escritório › Stock) atualiza os contadores.", "Chaque vendredi, vous préparerez le planning de la semaine suivante. Et surveillez la santé des équipes : en logistique, les accidents et le mal de dos coûtent très cher.": "Todas as sextas-feiras, vai preparar o planeamento da semana seguinte. E vigie a saúde das equipas: na logística, os acidentes e as dores de costas custam muito caro.", "Chaque salarié a une jauge de <b>pénibilité</b>. Porter, se pencher, répéter les mêmes gestes : à 100 %, c’est l’arrêt maladie pour TMS (troubles musculo-squelettiques).": "Cada trabalhador tem um indicador de <b>esforço físico</b>. Carregar, dobrar-se, repetir os mesmos gestos: a 100 %, é baixa médica por LMERT (lesões músculo-esqueléticas).", "Avec le <b>bureau agrandi</b>, tu pourras recruter une <b>responsable RH</b> : elle appelle les intérimaires toute seule, moins cher, et soigne le moral de l’équipe.": "Com o <b>escritório ampliado</b>, poderás recrutar uma <b>responsável de RH</b>: chama os trabalhadores temporários sozinha, mais barato, e cuida do moral da equipa.", "J’aime cet état d’esprit. Mais un bon chef d’entrepôt, ça se mesure : chaque vendredi soir, je regarderai vos indicateurs. Taux de service, erreurs, stock, résultat.": "Gosto dessa atitude. Mas um bom chefe de armazém mede-se: todas as sextas-feiras à noite, vou olhar para os seus indicadores. Nível de serviço, erros, stock, resultado.", "Je ne vais pas vous mentir : il est vide, et il n’y a que vous. Mais les commandes en ligne explosent, et je veux faire de ce site notre meilleur centre logistique.": "Não lhe vou mentir: está vazio, e só está você. Mas as encomendas online estão a disparar, e quero fazer deste local o nosso melhor centro logístico.", "Un robot peut tomber en <b>panne</b> : un panneau rouge apparaît au-dessus. Va le <b>réparer</b> (bouton d’action), ou recrute un <b>technicien de maintenance</b>.": "Um robô pode <b>avariar</b>: aparece um painel vermelho por cima. Vai <b>repará-lo</b> (botão de ação), ou recruta um <b>técnico de manutenção</b>.", "Va devant le camion et appuie sur <b>Décharger</b>, puis pose les cartons sur une palette de réception ou range-les directement. Tes réceptionnaires le font aussi.": "Vai até à frente do camião e carrega em <b>Descarregar</b>, depois pousa as caixas numa palete de receção ou arruma-as diretamente. Os teus rececionistas também o fazem.", "Ton fournisseur livre à heures fixes : <b>9 h, 12 h et 15 h</b>, avec 3 h de délai minimum. Si tu attends la rupture pour commander, tes clients attendront aussi.": "O teu fornecedor entrega a horas fixas: <b>9 h, 12 h e 15 h</b>, com 3 h de prazo mínimo. Se esperares pela rutura para encomendar, os teus clientes também vão esperar.", "Trois vols partent chaque jour : <b>10 h, 15 h et 20 h</b>. Les commandes <b>express</b> (étiquette ✈) rapportent 60 % de plus, mais doivent partir avec leur vol.": "Partem três voos por dia: <b>10 h, 15 h e 20 h</b>. As encomendas <b>express</b> (etiqueta ✈) rendem mais 60 %, mas têm de partir no seu voo.", "Un préparateur a trouvé un emplacement vide alors que le système indiquait du stock : c’est un <b>écart d’inventaire</b>. Il perd du temps et le carton est perdu.": "Um preparador encontrou uma localização vazia quando o sistema indicava stock: é uma <b>discrepância de inventário</b>. Perde tempo e a caixa está perdida.", "Un salarié se fatigue en travaillant : sous 50 % d’énergie, il ralentit. Un moral bas le ralentit aussi, augmente les absences… et peut le pousser à démissionner.": "Um trabalhador cansa-se ao trabalhar: abaixo de 50 % de energia, abranda. Um moral baixo também o abranda, aumenta as ausências… e pode levá-lo a demitir-se.", "Ici, on tourne de 6 h à minuit, en trois équipes : matin, après-midi et soir. Vous ne pourrez pas tout faire vous-même. Votre vrai métier devient l’organisation.": "Aqui funciona-se das 6 h à meia-noite, em três turnos: manhã, tarde e noite. Não vai conseguir fazer tudo sozinho. O seu verdadeiro trabalho passa a ser a organização.", "Ici, pas de camion : un vaisseau cargo s’amarre toutes les 3 heures, pendant une fenêtre de lancement. Tous les colis doivent être dans les sas avant son départ.": "Aqui não há camião: uma nave de carga atraca de 3 em 3 horas, durante uma janela de lançamento. Todos os volumes têm de estar nas câmaras de transferência antes da partida.", "Ouvre le <b>Bureau › Stock</b> : pour chaque gamme, règle un <b>seuil de commande</b> et une <b>quantité</b>. Le bouton « Appliquer » reprend le conseil calculé.": "Abre o <b>Escritório › Stock</b>: para cada gama, define um <b>ponto de encomenda</b> e uma <b>quantidade</b>. O botão «Aplicar» retoma o conselho calculado.", "Parfois, la <b>douane</b> retient un conteneur pendant 3 heures. Tu peux payer 150 € pour le libérer tout de suite, ou prendre un <b>transitaire</b> (Améliorer).": "Por vezes, a <b>alfândega</b> retém um contentor durante 3 horas. Podes pagar 150 € para o libertar de imediato, ou contratar um <b>despachante</b> (Melhorar).", "Un camion fournisseur est à quai (devant la réception). Le chauffeur décharge seul, mais lentement : au-delà d’une heure à quai, l’attente est facturée (30 €/h).": "Está um camião de fornecedor no cais (em frente à receção). O motorista descarrega sozinho, mas devagar: além de uma hora no cais, a espera é faturada (30 €/h).", "Au début de chaque poste, un <b>point d’équipe</b> de 5 minutes devant le tableau : objectifs, sécurité, priorités. L’équipe démarre plus vite et plus motivée.": "No início de cada turno, uma <b>reunião de equipa</b> de 5 minutos em frente ao quadro: objetivos, segurança, prioridades. A equipa arranca mais depressa e mais motivada.", "Ton bureau s’agrandit : un poste de <b>responsable RH</b> est disponible (Bureau › Équipe). Elle gère les absences et fait monter le moral de tous chaque jour.": "O teu escritório aumenta: está disponível um posto de <b>responsável de RH</b> (Escritório › Equipa). Ela gere as ausências e faz subir o moral de todos todos os dias.", "Un client a reçu un mauvais article : retour, renvoi, satisfaction en baisse. Les intérimaires et les salariés fatigués ou peu formés se trompent plus souvent.": "Um cliente recebeu um artigo errado: devolução, reenvio, satisfação em queda. Os temporários e os trabalhadores cansados ou pouco formados enganam-se mais vezes.", "Va à la <b>zone de recharge</b> (marquée au sol) et appuie sur <b>Contrôler mon chariot</b>. Tes caristes y font leur contrôle et y rechargent leurs batteries.": "Vai à <b>zona de carregamento</b> (marcada no chão) e carrega em <b>Verificar o meu empilhador</b>. Os teus operadores de empilhador fazem lá a verificação e carregam as baterias.", "Le logiciel qui pilote robots et machines. Indispensable avant d’acheter un robot ou un tri automatique (l’intégration coûte souvent autant que les machines).": "O software que controla robôs e máquinas. Indispensável antes de comprar um robô ou uma triagem automática (a integração custa muitas vezes tanto como as máquinas).", "Pour les petites commandes du coin, vous aurez une flotte de drones : livraison en 20 minutes. Et un stockage vertical automatisé, si vous en avez les moyens.": "Para as pequenas encomendas da zona, terá uma frota de drones: entrega em 20 minutos. E um armazenamento vertical automatizado, se tiver meios para isso.", ". Une erreur coûte un retour, un renvoi et la confiance du client. Remèdes : contrôle au poste d’emballage, scan des codes-barres, pick-to-light, formation.": ". Um erro custa uma devolução, um reenvio e a confiança do cliente. Soluções: controlo no posto de embalagem, leitura de códigos de barras, pick-to-light, formação.", "Deux dangers : l’apesanteur, qui fait flotter les cartons mal arrimés, et l’oxygène. Plus l’équipage est nombreux, plus il en consomme. Surveillez la jauge.": "Dois perigos: a imponderabilidade, que faz flutuar as caixas mal fixadas, e o oxigénio. Quanto maior a tripulação, mais consome. Vigie o indicador.", "Margaux peut programmer un <b>événement</b> pour le lendemain (bureau, onglet Commandes) : soldes, Black Friday ou Noël. Les commandes explosent ce jour-là.": "A Margaux pode programar um <b>evento</b> para o dia seguinte (escritório, separador Encomendas): saldos, Black Friday ou Natal. As encomendas disparam nesse dia.", "Des cartons se sont détachés et <b>flottent</b> dans l’allée. Rattrape-les avant 2 heures, sinon ils sont perdus. Tes réceptionnaires s’en chargent aussi.": "Algumas caixas soltaram-se e estão a <b>flutuar</b> no corredor. Apanha-as em menos de 2 horas, senão perdem-se. Os teus rececionistas também tratam disso.", "Chaque <b>vendredi soir</b>, Mme Laurent fait le bilan de la semaine : taux de service, ruptures, erreurs, précision du stock et résultat d’exploitation.": "Todas as <b>sextas-feiras à noite</b>, a Sra. Laurent faz o balanço da semana: nível de serviço, ruturas, erros, precisão do stock e resultado de exploração.", "Margaux, communication. Donnez-moi un jour de préparation, et je vous remplis les carnets de commandes. Soldes, Black Friday ou Noël : à vous de choisir.": "Margaux, comunicação. Dê-me um dia de preparação, e encho-lhe a carteira de encomendas. Saldos, Black Friday ou Natal: a escolha é sua.", ") : il prélève jour et nuit, sans salaire. Montée en charge : 50 % le premier jour, plein rendement en 5 jours. Maintenance 25 €/jour, énergie, pannes.": "): recolhe dia e noite, sem salário. Arranque: 50 % no primeiro dia, pleno rendimento em 5 dias. Manutenção 25 €/dia, energia, avarias.", "Le hub tourne comme une horloge. Le siège a une nouvelle idée : un centre entièrement automatisé, près de Paris. Vous êtes la personne qu’il nous faut.": "O hub funciona como um relógio. A sede tem uma nova ideia: um centro totalmente automatizado, perto de Paris. É a pessoa de que precisamos.", "Le soir, les commandes en ligne sont plus nombreuses : recrute au moins une personne dans l’<b>équipe du soir</b> (prime de soirée : +25 % de salaire).": "À noite, há mais encomendas online: recruta pelo menos uma pessoa para o <b>turno da noite</b> (subsídio noturno: +25 % de salário).", "Un chauffeur ne prend jamais une palette qui n’est pas <b>filmée</b> (sinon les colis tombent). Mains vides, devant le quai : <b>Filmer la palette</b>.": "Um motorista nunca leva uma palete que não esteja <b>filmada</b> (senão os volumes caem). De mãos vazias, em frente ao cais: <b>Filmar a palete</b>.", "Marco, cariste. Je m’occupe de la réserve en hauteur et je descends le stock quand les niveaux bas se vident. Vos préparateurs ne manqueront de rien.": "Marco, operador de empilhador. Trato da reserva em altura e desço o stock quando os níveis baixos esvaziam. Aos seus preparadores não vai faltar nada.", "Trois vols par jour : 10 h, 15 h et 20 h. Les colis express, marqués d’un avion, doivent être chargés dans les conteneurs aériens avant le décollage.": "Três voos por dia: 10 h, 15 h e 20 h. Os volumes express, marcados com um avião, têm de ser carregados nos contentores aéreos antes da descolagem.", "Puis appuie sur <b>« Commander les articles sous le seuil »</b>. Avec un WMS, ces commandes partiront toutes seules, mais toujours selon TES seuils.": "Depois carrega em <b>«Encomendar os artigos abaixo do ponto de encomenda»</b>. Com um WMS, estas encomendas partirão sozinhas, mas sempre segundo os TEUS pontos de encomenda.", "du prix, et il n’atteint son plein rendement qu’après plusieurs semaines (40 à 60 % le premier mois). La maintenance coûte 10 à 15 % du prix par an.": "do preço, e só atinge o pleno rendimento após várias semanas (40 a 60 % no primeiro mês). A manutenção custa 10 a 15 % do preço por ano.", "Hors du froid, un produit frais s’abîme en <b>2 heures</b> sur une palette, et en 1 h 30 si on le transporte. Range-le vite dans la chambre froide.": "Fora do frio, um produto fresco estraga-se em <b>2 horas</b> numa palete, e em 1 h 30 se for transportado. Arruma-o depressa na câmara frigorífica.", "Les <b>fiches du manager</b> (Bureau › Pilotage) expliquent les formules : point de commande, stock de sécurité… Elles se débloquent au fil du jeu.": "As <b>fichas do gestor</b> (Escritório › Gestão) explicam as fórmulas: ponto de encomenda, stock de segurança… Desbloqueiam-se ao longo do jogo.", "Une commande standard arrive au premier créneau situé au moins 3 h plus tard. Prévois donc le stock nécessaire pendant ce délai : c’est le rôle du": "Uma encomenda standard chega na primeira janela situada pelo menos 3 h depois. Prevê portanto o stock necessário durante esse prazo: é o papel do", "Chaque colis est vérifié avant fermeture : 90 % des erreurs de préparation sont rattrapées, mais l’emballage prend environ 15 % de temps en plus.": "Cada volume é verificado antes de ser fechado: 90 % dos erros de preparação são apanhados, mas a embalagem demora cerca de 15 % mais.", "L’intérim réservé arrive chaque matin pour toute la semaine (×1,35 sur le salaire). En urgence, le jour même, il coûte ×1,6 et n’est pas garanti.": "O trabalho temporário reservado chega todas as manhãs durante toda a semana (×1,35 sobre o salário). De urgência, no próprio dia, custa ×1,6 e não é garantido.", "Un colis qui rate son vol attend le suivant et perd 30 % de sa valeur. Un vol complet (4 colis ou plus) parti sans retard compte pour l’objectif.": "Um volume que perde o voo espera pelo seguinte e perde 30 % do seu valor. Um voo completo (4 volumes ou mais) que parte sem atraso conta para o objetivo.", "Active le <b>contrôle qualité au poste d’emballage</b> (Bureau › Stock › Règles) : il rattrape 90 % des erreurs, mais l’emballage est plus lent.": "Ativa o <b>controlo de qualidade no posto de embalagem</b> (Escritório › Stock › Regras): apanha 90 % dos erros, mas a embalagem fica mais lenta.", "Avant d’utiliser un chariot élévateur, on le contrôle chaque jour : freins, fourches, klaxon, fuites. C’est obligatoire, et ça évite les pannes.": "Antes de usar um empilhador, verifica-se todos os dias: travões, garfos, buzina, fugas. É obrigatório, e evita avarias.", "Chaque carton a une <b>date limite</b> : 3 jours pour le frais, 12 pour le surgelé. Commande juste ce qu’il faut, sinon il finira à la poubelle.": "Cada caixa tem uma <b>data-limite</b>: 3 dias para os frescos, 12 para os congelados. Encomenda só o necessário, senão vai acabar no lixo.", "Les objectifs du palier se vérifient sur <b>une semaine complète</b> : accélérer le temps ne suffit pas. Suis-les dans <b>Bureau › Pilotage</b>.": "Os objetivos do patamar verificam-se numa <b>semana completa</b>: acelerar o tempo não chega. Acompanha-os em <b>Escritório › Gestão</b>.", "Des élévateurs automatiques servent tous les niveaux à hauteur d’homme : tout le monde accède au niveau haut, et chaque niveau gagne 6 cartons.": "Elevadores automáticos servem todos os níveis à altura do corpo: toda a gente acede ao nível alto, e cada nível ganha 6 caixas.", "Deux : les entreprises. Recrutez une commerciale, et elle décrochera des contrats B2B : des palettes entières à livrer avant une heure précise.": "Duas: as empresas. Recrute uma comercial, e ela conseguirá contratos B2B: paletes inteiras a entregar antes de uma hora precisa.", "Lyon-Est est devenue la meilleure plateforme du réseau. Le siège prépare déjà la suite : un hub portuaire, avec des conteneurs du monde entier…": "Lyon-Est tornou-se a melhor plataforma da rede. A sede já prepara o passo seguinte: um hub portuário, com contentores do mundo inteiro…", "Le goulot d’étranglement est l’étape où les commandes s’accumulent : c’est là qu’il faut ajouter des bras, un poste ou changer l’organisation.": "O estrangulamento é a etapa onde as encomendas se acumulam: é aí que é preciso acrescentar braços, um posto ou mudar a organização.", "Paris-Sud, 5 h 55. Un hangar blanc immaculé, un sol bleu, et un léger bourdonnement électrique. Les robots attendent leurs premières missions.": "Paris-Sud, 5 h 55. Um hangar branco imaculado, um chão azul e um ligeiro zumbido elétrico. Os robôs aguardam as suas primeiras missões.", "Ton premier <b>robot préparateur</b> est en service. Il travaille jour et nuit, sans salaire, mais il consomme de l’énergie (charges du soir).": "O teu primeiro <b>robô preparador</b> está em funcionamento. Trabalha dia e noite, sem salário, mas consome energia (encargos da noite).", "Les articles les plus vendus (classe A) sont rangés près de l’emballage, les moins vendus (C) au fond. Moins de marche pour les préparateurs.": "Os artigos mais vendidos (classe A) são arrumados perto da embalagem, os menos vendidos (C) ao fundo. Menos caminhada para os preparadores.", "Rassemble les articles sur la <b>palette B2B</b> (zone orange, près de l’emballage). Tes préparateurs aident quand ils n’ont pas de commande.": "Junta os artigos na <b>palete B2B</b> (zona laranja, perto da embalagem). Os teus preparadores ajudam quando não têm encomendas.", "Tu peux aussi <b>parler à chaque opérateur</b> : approche-toi, mains vides. Ils te disent comment ils vont… et ce qui coince sur le terrain.": "Também podes <b>falar com cada operador</b>: aproxima-te, de mãos vazias. Dizem-te como estão… e o que está a encravar no terreno.", "Un chariot élévateur et ta formation CACES R489 (obligatoire pour le conduire) : 12 cartons, plus rapide, et accès au niveau haut des racks.": "Um empilhador e a tua formação CACES R489 (obrigatória para o conduzir): 12 caixas, mais rápido, e acesso ao nível alto das estantes.", "Aujourd’hui, vous dirigez la logistique de Colibox de la Terre jusqu’aux étoiles. Le conseil d’administration vous nomme directeur général.": "Hoje, dirige a logística da Colibox da Terra até às estrelas. O conselho de administração nomeia-o diretor-geral.", "Bonne nouvelle : tu peux maintenant recruter des <b>caristes</b> (Bureau › Équipe). Ils rangent en réserve et réapprovisionnent tout seuls.": "Boa notícia: agora podes recrutar <b>operadores de empilhador</b> (Escritório › Equipa). Arrumam na reserva e reabastecem sozinhos.", "Charge les colis express dans les <b>conteneurs aériens</b> (zone rouge du quai). Le convoyeur et le tri automatique savent aussi le faire.": "Carrega os volumes express nos <b>contentores aéreos</b> (zona vermelha do cais). O transportador e a triagem automática também o sabem fazer.", "La chambre froide est prête. Le frais rapporte peu par article, mais les clients en commandent tous les jours. Attention aux dates limites.": "A câmara frigorífica está pronta. Os frescos rendem pouco por artigo, mas os clientes encomendam-nos todos os dias. Atenção às datas-limite.", "À gauche, les <b>baies à conteneurs</b>. Toutes les 4 heures, un navire y dépose les conteneurs de tes commandes en <b>import maritime</b>.": "À esquerda, os <b>cais de contentores</b>. De 4 em 4 horas, um navio deixa lá os contentores das tuas encomendas em <b>importação marítima</b>.", "Dernière étape : le <b>bureau</b> (à gauche, ou le bouton « Bureau » en haut) sert à commander du stock, recruter et améliorer l’entrepôt.": "Última etapa: o <b>escritório</b> (à esquerda, ou o botão «Escritório» em cima) serve para encomendar stock, recrutar e melhorar o armazém.", "Chef, la réception déborde : le camion attend et le stock n’arrive plus en rayon. Il nous faut un réceptionnaire de plus, ou un cariste.": "Chefe, a receção está a transbordar: o camião está à espera e o stock já não chega às prateleiras. Precisamos de mais um rececionista, ou de um operador de empilhador.", "Cinq minutes debout devant le tableau : chacun sait quoi faire, et l’équipe démarre plus soudée (+5 % de rythme sur ce poste, moral +3).": "Cinco minutos de pé em frente ao quadro: cada um sabe o que fazer, e a equipa arranca mais unida (+5 % de ritmo neste turno, moral +3).", "Trois : négociez avec vos fournisseurs. Objectifs : 12 gammes, 8 contrats B2B livrés, 4,3 ★, 35 000 € et un stock fiable à plus de 97 %.": "Três: negoceie com os seus fornecedores. Objetivos: 12 gamas, 8 contratos B2B entregues, 4,3 ★, 35 000 € e um stock fiável a mais de 97 %.", "Chef, je ne vais pas vous mentir, l’ambiance est tendue. On enchaîne sans souffler… Une salle de pause ou une prime, ça ferait du bien.": "Chefe, não lhe vou mentir, o ambiente está tenso. Estamos sempre a correr sem respirar… Uma sala de pausa ou um prémio fazia bem.", "Nouvelles gammes aussi : la pharmacie, avec un contrôle qualité à l’emballage, et le luxe, qui doit être rangé dans une cage sécurisée.": "Também há novas gamas: a farmácia, com um controlo de qualidade na embalagem, e o luxo, que tem de ser arrumado numa jaula de segurança.", "Prépare-toi : du stock en avance, toutes les équipes au complet. Moins de 15 % d’annulations, et l’événement est une réussite (+0,3 ★).": "Prepara-te: stock com antecedência, todas as equipas completas. Menos de 15 % de cancelamentos, e o evento é um sucesso (+0,3 ★).", "Les représentants du personnel demandent une hausse de salaire : « On tient la cadence, on veut que ça se voie sur la fiche de paie. »": "Os representantes do pessoal pedem um aumento de salário: «Aguentamos o ritmo, queremos que isso se veja no recibo de vencimento.»", "Palette complète : <b>filme-la</b> (ou laisse faire un expéditeur). Elle partira avec le prochain camion. Attention à l’heure limite !": "Palete completa: <b>filma-a</b> (ou deixa um expedidor fazê-lo). Vai partir no próximo camião. Atenção à hora-limite!", "Tes drones livrent les petites commandes urgentes (une seule pièce, étiquette « drone ») en 20 minutes. Elles rapportent 30 % de plus.": "Os teus drones entregam as pequenas encomendas urgentes (uma só peça, etiqueta «drone») em 20 minutos. Rendem mais 30 %.", "Titulaire du CACES R489, conduit un chariot élévateur : range en réserve (niveau haut) et réapprovisionne les emplacements de picking.": "Titular do CACES R489, conduz um empilhador: arruma na reserva (nível alto) e reabastece as localizações de picking.", "Calcule pour chaque article un seuil et une quantité de commande à partir de ses ventes réelles et du niveau de service que tu vises.": "Calcula para cada artigo um ponto de encomenda e uma quantidade de encomenda a partir das suas vendas reais e do nível de serviço que pretendes.", "Chaque membre d’équipage consomme de l’oxygène. Sous 30 %, tout le monde ralentit et le moral chute. La jauge est en haut de l’écran.": "Cada membro da tripulação consome oxigénio. Abaixo de 30 %, toda a gente abranda e o moral cai. O indicador está no topo do ecrã.", "Range un carton tout en haut avec ton chariot : approche-toi d’un emplacement et range, le chariot remplit d’abord le bas puis monte.": "Arruma uma caixa lá em cima com o teu empilhador: aproxima-te de uma localização e arruma, o empilhador enche primeiro em baixo e depois sobe.", "démissionné. Un moral trop bas pendant plusieurs jours fait fuir les gens : pense aux pauses, aux primes et aux plannings équilibrés.": "demitiu-se. Um moral demasiado baixo durante vários dias faz as pessoas fugirem: pensa nas pausas, nos prémios e em planeamentos equilibrados.", "Achète des <b>cartouches</b> (onglet Améliorer) ou installe un <b>recycleur d’oxygène</b>. Au niveau 3, la station devient autonome.": "Compra <b>cartuchos</b> (separador Melhorar) ou instala um <b>reciclador de oxigénio</b>. No nível 3, a estação torna-se autónoma.", "Apporte le bac au <b>poste d’emballage</b> (la machine à droite) : l’article y est mis dans un carton d’expédition, c’est ton colis.": "Leva o contentor ao <b>posto de embalagem</b> (a máquina à direita): o artigo é colocado numa caixa de expedição, é o teu volume.", "Pose les colis marqués « drone » sur la <b>piste des drones</b> (en bas). Les drones décollent seuls, puis se rechargent 15 minutes.": "Coloca os volumes marcados «drone» na <b>pista dos drones</b> (em baixo). Os drones descolam sozinhos e depois recarregam durante 15 minutos.", "Chef, une palette B2B doit partir dans moins de deux heures ! Si on la rate, le client paiera moins… et il ne nous rappellera pas.": "Chefe, uma palete B2B tem de partir em menos de duas horas! Se a falharmos, o cliente paga menos… e não nos volta a ligar.", "Monte ton colis sur une <b>palette d’expédition</b> du quai (zone verte). Un camion part toutes les 30 minutes avec les palettes.": "Coloca o teu volume numa <b>palete de expedição</b> do cais (zona verde). Parte um camião de 30 em 30 minutos com as paletes.", "Le chauffeur décharge une palette : 6 cartons sont écrasés, le film est déchiré. Il attend ta signature sur le bon de livraison.": "O motorista descarrega uma palete: 6 caixas estão esmagadas, o filme está rasgado. Está à espera da tua assinatura na guia de remessa.", "Lyon-Est, 5 h 50. Trois quais, des semi-remorques qui manœuvrent, une chambre froide qui ronronne. Les néons s’allument un à un.": "Lyon-Est, 5 h 50. Três cais, semirreboques a manobrar, uma câmara frigorífica a ronronar. As luzes acendem-se uma a uma.", "Quand une équipe part, la suivante prend la relève. Pour finir le palier, il te faudra <b>3 équipes d’au moins 2 personnes</b>.": "Quando um turno sai, o seguinte assume. Para terminar o patamar, vais precisar de <b>3 turnos com pelo menos 2 pessoas</b>.", "Zone artisanale de Valmont, 7 h 58. Un vieil entrepôt aux murs lavande, un parking vide… et une pancarte : « Colibox recrute ».": "Zona industrial de Valmont, 7 h 58. Um velho armazém de paredes lilás, um parque de estacionamento vazio… e uma tabuleta: «A Colibox está a recrutar».", ") est sous l’objectif : trop de commandes en retard ou annulées. Regarde où ça coince : réception, préparation ou emballage ?": ") está abaixo do objetivo: demasiadas encomendas atrasadas ou canceladas. Vê onde está a encravar: receção, preparação ou embalagem?", "Sofia, commerciale. J’ai déjà trois clients en tête : un hôtel, une mairie, un camping. Je vous envoie les offres au bureau !": "Sofia, comercial. Já tenho três clientes em mente: um hotel, uma câmara municipal, um parque de campismo. Envio-lhe as propostas para o escritório!", "Sofia va décrocher des <b>contrats B2B</b> : des commandes d’entreprises, à valider dans le bureau, onglet <b>Commandes</b>.": "A Sofia vai conseguir <b>contratos B2B</b>: encomendas de empresas, a validar no escritório, separador <b>Encomendas</b>.", "Après plusieurs accidents, l’inspection du travail visite le site : formation, équipements, organisation… tout est vérifié.": "Depois de vários acidentes, a inspeção do trabalho visita o local: formação, equipamentos, organização… tudo é verificado.", "La <b>maintenance préventive</b> divise les pannes par deux, et les <b>panneaux solaires</b> allègent la facture d’énergie.": "A <b>manutenção preventiva</b> reduz as avarias para metade, e os <b>painéis solares</b> aliviam a fatura de energia.", "On y est. La première station logistique en orbite. Colibox livre désormais la Lune, Mars… et tous ceux qui vivent là-haut.": "Chegámos. A primeira estação logística em órbita. A Colibox entrega agora na Lua, em Marte… e a todos os que vivem lá em cima.", "Un trieur envoie chaque colis directement à sa bonne destination (quai, avion, piste des drones), plus besoin d’expéditeur.": "Um classificador envia cada volume diretamente para o destino certo (cais, avião, pista dos drones), já não é preciso expedidor.", "Cent trente lancements parfaits plus tard, le dernier vaisseau de la journée s’éloigne vers Mars dans un éclat de lumière.": "Cento e trinta lançamentos perfeitos depois, a última nave do dia afasta-se rumo a Marte num clarão de luz.", "Contrôle douanier sur ce conteneur. Il restera fermé quelques heures… à moins que vous ne régliez les frais tout de suite.": "Controlo aduaneiro neste contentor. Vai ficar fechado algumas horas… a não ser que pague as taxas já.", "Le siège vient de me nommer directrice nationale. Et j’ai besoin de vous à Lyon-Est : notre nouvelle plateforme régionale.": "A sede acaba de me nomear diretora nacional. E preciso de si em Lyon-Est: a nossa nova plataforma regional.", "La gamme <b>Luxe</b> se range uniquement dans la <b>cage sécurisée</b> (à gauche). Équipe-la au bureau avant de l’ouvrir.": "A gama <b>Luxo</b> arruma-se apenas na <b>jaula de segurança</b> (à esquerda). Equipa-a no escritório antes de a abrir.", "Premier colis livré ! Nos clients adorent les livraisons rapides : chaque colis à l’heure fait monter votre satisfaction.": "Primeiro volume entregue! Os nossos clientes adoram entregas rápidas: cada volume a horas faz subir a sua satisfação.", "Roissy, zone cargo, 5 h 30. Le grondement des réacteurs couvre tout. Sur le tarmac, un avion-cargo attend, soute ouverte.": "Roissy, zona de carga, 5 h 30. O ronco dos reatores cobre tudo. Na pista, um avião de carga espera, porão aberto.", "Des emplacements de picking sont vides alors qu’il reste du stock en réserve. Il faudrait descendre la réserve plus tôt.": "Há localizações de picking vazias quando ainda há stock na reserva. Seria preciso descer a reserva mais cedo.", "Fos-sur-Mer, 5 h 45. L’odeur de sel, le cri des mouettes, et un porte-conteneurs qui manœuvre lentement le long du quai.": "Fos-sur-Mer, 5 h 45. O cheiro a sal, o grito das gaivotas e um porta-contentores que manobra lentamente ao longo do cais.", "Voici le centre le plus moderne de Colibox. Ici, vous pourrez tout automatiser : préparation, réception, emballage, tri.": "Este é o centro mais moderno da Colibox. Aqui, vai poder automatizar tudo: preparação, receção, embalagem, triagem.", "des lignes de commande sont arrivées sans stock. Revois tes seuils de commande : délai fournisseur et stock de sécurité.": "linhas de encomenda chegaram sem stock. Revê os teus pontos de encomenda: prazo do fornecedor e stock de segurança.", "Les palettes d’expédition pleines sont filmées automatiquement, et toutes les palettes juste avant le départ du camion.": "As paletes de expedição cheias são filmadas automaticamente, e todas as paletes mesmo antes da partida do camião.", "Parfait ! Vous avez fait tout le circuit d’une commande. À partir de maintenant, les clients vont commander en continu.": "Perfeito! Fez todo o circuito de uma encomenda. A partir de agora, os clientes vão encomendar continuamente.", "Quand un conteneur arrive, va le <b>dépoter</b> : approche-toi de sa porte et prends les cartons comme sur une palette.": "Quando chega um contentor, vai <b>esvaziá-lo</b>: aproxima-te da porta e pega nas caixas como numa palete.", "Sans WMS, c’est toi qui déclenches les commandes : bouton « Commander les articles sous le seuil » dans chaque gamme.": "Sem WMS, és tu que lanças as encomendas: botão «Encomendar os artigos abaixo do ponto de encomenda» em cada gama.", ": recrutement coûteux (annonces, entretiens), arrive dans 2 jours, payé même les jours calmes et pendant ses arrêts,": ": recrutamento dispendioso (anúncios, entrevistas), chega em 2 dias, pago mesmo nos dias calmos e durante as baixas,", "Chef… on a dû jeter des produits frais. Il faut les ranger au froid plus vite, et ne pas trop en commander d’avance.": "Chefe… tivemos de deitar fora produtos frescos. É preciso arrumá-los no frio mais depressa, e não encomendar demasiado com antecedência.", "Un gros client annonce un audit demain : il vérifiera tes erreurs de préparation et la propreté (5S) de l’entrepôt.": "Um grande cliente anuncia uma auditoria amanhã: vai verificar os teus erros de preparação e a limpeza (5S) do armazém.", "Une vraie équipe du soir ! C’est là que les clients commandent le plus : vous allez le sentir dans la satisfaction.": "Um verdadeiro turno da noite! É quando os clientes encomendam mais: vai notar isso na satisfação.", "Pour le faire baisser : moins de déplacements (ABC), moins d’attentes (réappro, flux équilibrés), moins d’erreurs.": "Para o fazer baixar: menos deslocações (ABC), menos esperas (reabastecimento, fluxos equilibrados), menos erros.", "On tombe souvent sur des emplacements vides alors que l’écran dit qu’il y a du stock. Un inventaire serait utile.": "Encontramos muitas vezes localizações vazias quando o ecrã diz que há stock. Um inventário seria útil.", "Les premiers colis de Lyon-Est sont partis ! Les semi-remorques passent toutes les 15 minutes, on a de la marge.": "Os primeiros volumes de Lyon-Est já partiram! Os semirreboques passam de 15 em 15 minutos, temos margem.", "Chef, il y a des cartons qui volent dans l’allée ! Je les attrape, mais il faudrait vraiment arrimer ces racks.": "Chefe, há caixas a voar no corredor! Eu apanho-as, mas era mesmo preciso fixar estas estantes.", "Je me souviens de vous, seul dans ce petit entrepôt lavande de Valmont, avec un transpalette et trois palettes.": "Lembro-me de si, sozinho naquele pequeno armazém lilás de Valmont, com um porta-paletes e três paletes.", "Station Horizon, orbite basse. 400 kilomètres sous vos pieds, la Terre tourne lentement, bleue et silencieuse.": "Estação Horizon, órbita baixa. 400 quilómetros debaixo dos seus pés, a Terra gira lentamente, azul e silenciosa.", "Un chariot élévateur ! Vous allez pouvoir stocker en hauteur. Les racks sont maintenant disponibles au bureau.": "Um empilhador! Vai poder armazenar em altura. As estantes estão agora disponíveis no escritório.", "Ouvre le <b>Bureau</b>, onglet <b>Équipe</b> : tu y vois chaque équipe, avec l’énergie et le moral de chacun.": "Abre o <b>Escritório</b>, separador <b>Equipa</b>: aí vês cada turno, com a energia e o moral de cada um.", "Apporte ici les colis emballés pour monter les palettes d’expédition : un camion part toutes les 30 minutes.": "Traz para aqui os volumes embalados para montar as paletes de expedição: parte um camião de 30 em 30 minutos.", "Il fait 36 °C dans l’entrepôt. Les équipes se fatiguent beaucoup plus vite et le risque d’accident augmente.": "Estão 36 °C no armazém. As equipas cansam-se muito mais depressa e o risco de acidente aumenta.", "J’ai mal au dos depuis quelques jours… Porter et me pencher toute la journée, ça commence à faire beaucoup.": "Tenho dores nas costas há uns dias… Carregar e dobrar-me o dia todo começa a ser demais.", "Recrute une chargée de communication (bureau agrandi niveau 3) pour organiser soldes, Black Friday et Noël.": "Recruta uma responsável de comunicação (escritório ampliado nível 3) para organizar saldos, Black Friday e Natal.", "Trois quais, des semi-remorques et une chambre froide. L’entrepôt tourne de 6 h à minuit en trois équipes.": "Três cais, semirreboques e uma câmara frigorífica. O armazém funciona das 6 h à meia-noite em três turnos.", "Un intérimaire coûte 60 % de plus et travaille moins vite. Sinon, c’est à toi de compenser sur le terrain.": "Um trabalhador temporário custa mais 60 % e trabalha mais devagar. Senão, cabe-te a ti compensar no terreno.", "Bienvenue au hub portuaire ! D’ici, Colibox importe des meubles et du matériel de jardin du monde entier.": "Bem-vindo ao hub portuário! Daqui, a Colibox importa móveis e material de jardim do mundo inteiro.", "Merci d’avoir joué à Warehouse. Tu peux continuer à faire tourner la station aussi longtemps que tu veux.": "Obrigado por jogares Warehouse. Podes continuar a gerir a estação durante o tempo que quiseres.", "Six mois plus tard. Valmont est devenu le site modèle de Colibox, et le téléphone sonne un dimanche soir.": "Seis meses depois. Valmont tornou-se o local modelo da Colibox, e o telefone toca num domingo à noite.", "Le convoyeur tourne : vos colis partent seuls vers le quai. On commence à parler de votre site au siège.": "O transportador está a funcionar: os seus volumes seguem sozinhos para o cais. Começa-se a falar do seu local na sede.", "Les articles de <b>pharmacie</b> demandent un contrôle qualité : leur emballage prend 3 minutes de plus.": "Os artigos de <b>farmácia</b> exigem um controlo de qualidade: a sua embalagem demora mais 3 minutos.", "Un peu de comptage chaque jour (50 à 120 €/jour) : la précision du stock remonte au lieu de se dégrader.": "Um pouco de contagem todos os dias (50 a 120 €/dia): a precisão do stock sobe em vez de se degradar.", "Le WMS commande seul chaque article dont le stock (y compris ce qui est en route) passe sous son seuil.": "O WMS encomenda sozinho cada artigo cujo stock (incluindo o que está a caminho) desce abaixo do seu ponto de encomenda.", "Beaucoup de commandes attendent un article en rupture. Les seuils de commande sont peut-être trop bas.": "Muitas encomendas estão à espera de um artigo em rutura. Os pontos de encomenda talvez estejam demasiado baixos.", "Les transports en commun seront en grève demain : plusieurs salariés risquent de ne pas pouvoir venir.": "Amanhã há greve dos transportes públicos: vários trabalhadores arriscam-se a não conseguir vir.", "Pour la suite, le siège regarde vers le ciel : une base aérienne, des drones… On en reparle très vite.": "Para o que vem a seguir, a sede olha para o céu: uma base aérea, drones… Falamos disso muito em breve.", "Un montant de rack est tordu : le risque d’accident est multiplié par 1,8 tant qu’il n’est pas réparé.": "Um montante de estante está torto: o risco de acidente é multiplicado por 1,8 enquanto não for reparado.", "Un transitaire s’occupe des formalités : les contrôles douaniers sont rares et ne durent qu’une heure.": "Um despachante trata das formalidades: os controlos aduaneiros são raros e só duram uma hora.", "Une influenceuse vient de parler de vos produits. Le service client prévoit +40 % de commandes demain.": "Uma influencer acabou de falar dos seus produtos. O serviço ao cliente prevê +40 % de encomendas amanhã.", "devient chef d’équipe : il épaule son équipe (+5 % de rythme, moral meilleur) contre +15 % de salaire.": "passa a chefe de equipa: apoia a sua equipa (+5 % de ritmo, melhor moral) em troca de +15 % de salário.", "L’oxygène baisse dangereusement. L’équipe s’essouffle : il faut des cartouches ou un recycleur, vite.": "O oxigénio está a baixar perigosamente. A equipa está sem fôlego: são precisos cartuchos ou um reciclador, depressa.", "Objectif final : 18 gammes, 130 lancements réussis, 4,3 ★ et 250 000 €. Après ça… vous aurez tout vu.": "Objetivo final: 18 gamas, 130 lançamentos bem-sucedidos, 4,3 ★ e 250 000 €. Depois disso… terá visto tudo.", "Bastien, maintenance. Un robot qui tousse, un tapis qui grince : je m’en occupe. Vous, vous pilotez.": "Bastien, manutenção. Um robô que tosse, um tapete que range: eu trato disso. Você gere.", "Le chariot élévateur fuit et refuse de lever. Sans lui, personne n’accède au niveau haut des racks.": "O empilhador está a perder óleo e recusa-se a elevar. Sem ele, ninguém acede ao nível alto das estantes.", "Ton chariot n’a pas été contrôlé : une fuite hydraulique n’a pas été vue, il est immobilisé demain.": "O teu empilhador não foi verificado: uma fuga hidráulica passou despercebida, fica imobilizado amanhã.", "Vous voilà dans la cour des grands : la livraison express mondiale. Ici, l’avion n’attend personne.": "Agora joga no campeonato dos grandes: a entrega expressa mundial. Aqui, o avião não espera por ninguém.", "Gère les absences (intérimaires appelés automatiquement), suit le moral et l’améliore chaque jour.": "Gere as ausências (temporários chamados automaticamente), acompanha o moral e melhora-o todos os dias.", "Les <b>racks magnétiques</b> (Améliorer) gardent les cartons arrimés : cinq fois moins de dérives.": "As <b>estantes magnéticas</b> (Melhorar) mantêm as caixas fixas: cinco vezes menos derivas.", "Aïe, des colis express ont raté leur vol. Les clients vont les recevoir plus tard… et moins cher.": "Ai, alguns volumes express perderam o voo. Os clientes vão recebê-los mais tarde… e mais barato.", "est arrêté 5 jours : troubles musculo-squelettiques. La pénibilité de son poste était trop forte.": "está de baixa 5 dias: lesões músculo-esqueléticas. O esforço físico do seu posto era demasiado.", "La logistique est plus accidentogène que la moyenne, et les accidents y sont plus graves (INRS).": "A logística tem mais acidentes do que a média, e os acidentes são mais graves (INRS).", "Le camion fournisseur attend depuis plus d’une heure : frais d’immobilisation facturés (30 €/h).": "O camião do fornecedor está à espera há mais de uma hora: custos de imobilização faturados (30 €/h).", "Objectifs : 16 gammes, 90 vols complets à l’heure, 400 livraisons par drone, 4,3 ★ et 200 000 €.": "Objetivos: 16 gamas, 90 voos completos a horas, 400 entregas por drone, 4,3 ★ e 200 000 €.", "Bonjour ! Je suis Mme Laurent, directrice régionale de Colibox. Bienvenue dans votre entrepôt.": "Bom dia! Sou a Sra. Laurent, diretora regional da Colibox. Bem-vindo ao seu armazém.", "Tables élévatrices, préhenseurs, tapis anti-fatigue : la pénibilité des postes baisse de 40 %.": "Mesas elevatórias, pinças de preensão, tapetes antifadiga: o esforço físico dos postos baixa 40 %.", "Un centre robotisé rentable, des clients ravis et des équipes sereines. Je suis fière de vous.": "Um centro robotizado rentável, clientes encantados e equipas serenas. Estou orgulhosa de si.", "du travail cette semaine. La fatigue, les heures sup et les racks abîmés augmentent le risque.": "de trabalho esta semana. O cansaço, as horas extra e as estantes danificadas aumentam o risco.", "Chef, regardez la taille de ces conteneurs… On va avoir besoin de bras pour dépoter tout ça !": "Chefe, veja o tamanho destes contentores… Vamos precisar de braços para esvaziar isto tudo!", "Honnêtement, je ne me sens pas trop reconnu   const r0=Math.random(),lines=S.tier?(r0<.4?1:r0<.75?2:3):(r0<.55?1:Math.random()<.8?2:3),items={},cats=openCats().filter(c=>zoneOk(c*7));

  const ev=evActive();let value=Math.round((Object.entries(items).reduce((a,[s,n])=>a+PRICE[s]*n,0)+8)*(1+(ev?ev.price:0)));
  let due=S.t+240+Math.random()*120,air=false,drone=false;const ks=Object.keys(items);

    else if(TIER().space||Math.random()<.3){air=true;due=nextDepAfter(S.t+150);if(!TIER().space)value=Math.round(value*1.6);}}

function orderNeed(){
  const need={};
  S.orders.filter(o=>o.status==='open').forEach(o=>Object.entries(o.items).forEach(([s,n])=>need[s]=(need[s]||0)+n));
  const sub=a=>a.forEach(s=>{if(s>=0&&need[s])need[s]--});
  sub(S.me.hands);S.packs.forEach(p=>sub(p.buf));S.staff.forEach(a=>{if(a.role!=='cariste'&&a.role!=='recep')sub(a.hands||[])});
  S.contracts.filter(c=>c.state==='open').forEach(c=>{for(const k in c.items){const m=c.items[k]-(c.have[k]||0);if(m>0)need[k]=(need[k]||0)+m;}});
  return need;
}
function packable(buf){
  const c=cnt(buf);
  return S.orders.filter(o=>o.status==='open').sort((a,b)=>a.due-b.due).find(o=>Object.entries(o.items).every(([s,n])=>(c[s]||0)>=n));
}
function startPack(i,who){
  const p=S.packs[i],o=packable(p.buf);if(!o)return false;
  Object.entries(o.items).forEach(([s,n])=>{for(let k=0;k<n;k++)p.buf.splice(p.buf.indexOf(+s),1)});
  const units=Object.values(o.items).reduce((a,b)=>a+b,0);
  o.status='packing';o.tP=S.t;p.oid=o.id;p.total=p.work=(who==='robot'?2:4)+units+(Object.keys(o.items).some(isPharma)?3:0);p.who=who;
  const share=units/Math.max(1,units+p.buf.length),e=p.errq*share;p.errq=Math.max(0,p.errq-e);o.err=Math.random()<e;

  return true;
}
function packMissing(buf){

  return best?'Il manque : '+best.join(', '):'Aucune commande pour ces articles';
}

function step(dm){
  S.t+=dm;
  const sh=curShift();if(sh!==S.lastShift){changeShift(S.lastShift,sh);S.lastShift=sh;}
  if(isOpenHours()&&S.tuto===-1){if(S.t>=S.nextOrder){newOrder();const mean=26/orderRate();S.nextOrder=S.t+Math.max(2,-mean*Math.log(1-Math.random()));}}
  S.orders=S.orders.filter(o=>{if(o.status==='open'&&S.t>o.due+120){rateHit(0);S.today.cancel++;S.wk.cancel++;if(evActive())S.event.cancel++;log(`Commande #${o.id} annulée : trop de retard.`,'b');return false}return true});
  S.packs.forEach((p,i)=>{
    if(i>=packCount())return;
    if(p.oid!=null){
      if(p.who==='me'&&S.me.pack!==i){}
      else if(!(p.who==='robot'&&p.broken)){let k=1;if(p.who==='staff'){const a=packerAt(i);k=a?speedF(a):.5;}
        p.work-=dm*k;if(p.work<=0){const o=finishPack(i);if(p.whoWasMe){S.me.hands.push(-o.id);p.whoWasMe=false;S.me.pack=-1;}else p.out++;}}
    }else if(stationRobot(i)&&!p.broken){startPack(i,'robot');}
  });
  const free_=o=>o.status==='packed'&&!S.me.hands.includes(-o.id)&&!S.staff.some(b=>(b.hands||[]).includes(-o.id));
  if(S.up.sorter&&!S.sorterBroken){S.packs.forEach(p=>{let guard=10;while(p.out>0&&guard--){const o=S.orders.find(free_);if(!o||!routeParcel(o))break;p.out--;}});}
  else if(S.up.conv){S.packs.forEach(p=>{if(p.out>0){S.convT=(S.convT||0)+dm;if(S.convT>2){S.convT=0;const o=S.orders.find(o=>free_(o)&&!o.drone);if(o&&routeParcel(o))p.out--;}}});}
  truckWaitTick(dm);if(S.up.filmeuse){const i=dockToFilm(true);if(i>=0)filmDock(i);}
  S.wk.hours+=dm/60*(1+S.staff.filter(a=>a.here&&!a.robot&&!ROLES[a.role].office).length);incTick();
  truckIn(dm);S.touts.forEach((T,i)=>truckOut(T,dm));if(TIER().port)shipTick(dm);if(TIER().air){airTick(dm);droneTick(dm);}if(TIER().space){floatTick(dm);o2Tick(dm);}
