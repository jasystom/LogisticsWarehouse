Ranger": "Guardar", "Retour": "Volver", "Robots": "Robots", "Réparé": "Reparado", "Soldes": "Rebajas", "Toupie": "Peonza", "Ventes": "Ventas", "Vite !": "¡Rápido!", "acquis": "adquirido", "au sas": "a la esclusa", "retard": "retraso", "· cage": "· jaula", "· coût": "· coste", "· jour": "· día", "· niv.": "· niv.", "Équipe": "Equipo", ", qté": ", cant.", ", toi": ", tú", "Enter": "Enter", "Frais": "Frescos", "Gamme": "Gama", "Hamac": "Hamaca", "Jeudi": "Jueves", "Lundi": "Lunes", "Manga": "Manga", "Mardi": "Martes", "Matin": "Mañana", "Moral": "Moral", "Pause": "Pausa", "Plaid": "Manta", "Plein": "Lleno", "Poste": "Puesto", "Rayon": "Sección", "Space": "Space", "Sport": "Deporte", "Stock": "Stock", "aucun": "ninguno", "avion": "avión", "prête": "listo", "rangé": "guardado", "s ont": "s han", "Écart": "Diferencia", "échec": "fracaso", "Jean": "Vaqueros", "Luxe": "Lujo", "Mode": "Moda", "Pull": "Jersey", "Quai": "Muelle", "Soir": "Noche", "Vase": "Jarrón", "Vide": "Vacío", "jeté": "tirado", "Bas": "Bajo", "Léa": "Léa", "Sas": "Esclusa", "Toi": "Tú", "Vol": "Vuelo", "non": "no", "oui": "sí", "vol": "vuelo", "Des cartons flottent dans l’allée, rattrape-les !": "Hay cajas flotando en el pasillo, ¡atrápalas!", "Un carton flotte dans l’allée, rattrape-le !": "Una caja flota en el pasillo, ¡atrápala!", "gammes": "gamas"}, "de": {"Un CDI coûte un recrutement (annonces, entretiens, intégration), un salaire versé même quand l’activité baisse, et des indemnités en cas de licenciement. L’intérim coûte plus cher à l’heure (le « coefficient » de l’agence), mais il s’adapte aux pics : saisons, promotions, absences. Les bons managers gardent un <b>socle de CDI</b> pour la charge régulière et utilisent l’intérim pour les variations, en le réservant à l’avance.": "Eine Festanstellung (CDI) kostet eine Rekrutierung (Anzeigen, Vorstellungsgespräche, Einarbeitung), ein Gehalt, das auch bei sinkender Auslastung gezahlt wird, und Abfindungen im Fall einer Kündigung. Zeitarbeit ist pro Stunde teurer (der „Koeffizient“ der Agentur), passt sich aber Spitzen an: Saisons, Aktionen, Abwesenheiten. Gute Manager halten einen <b>Stamm an Festangestellten</b> für die regelmäßige Last und nutzen Zeitarbeit für Schwankungen – und buchen sie im Voraus.", "Sur téléphone : joystick à gauche pour marcher, gros bouton orange pour agir. Sur ordinateur : flèches ou ZQSD, et Espace. Approche-toi d’une palette, d’un emplacement, d’un poste ou du quai : le bouton indique l’action possible. Ton vrai métier de chef : régler les seuils de commande, planifier les équipes, prendre les bonnes décisions face aux imprévus, et tenir tes indicateurs au bilan du vendredi.": "Auf dem Handy: Joystick links zum Gehen, großer orangefarbener Knopf zum Handeln. Am Computer: Pfeiltasten oder WASD und Leertaste. Geh zu einer Palette, einem Lagerplatz, einem Arbeitsplatz oder zur Rampe: Der Knopf zeigt die mögliche Aktion. Dein eigentlicher Job als Chef: Meldebestände einstellen, Schichten planen, bei Unvorhergesehenem richtig entscheiden und deine Kennzahlen bei der Freitagsbilanz halten.", "Les problèmes se voient sur le terrain avant de se voir dans les chiffres. Le <b>point d’équipe</b> de 5 minutes devant le tableau (objectifs, sécurité, priorités) et les discussions avec les opérateurs font remonter les idées et les difficultés. C’est le principe du « Gemba » du Lean : aller voir là où la valeur se crée.": "Probleme sieht man in der Halle, bevor man sie in den Zahlen sieht. Die 5-minütige <b>Teambesprechung</b> vor der Tafel (Ziele, Sicherheit, Prioritäten) und Gespräche mit den Mitarbeitenden bringen Ideen und Schwierigkeiten ans Licht. Das ist das „Gemba“-Prinzip des Lean: hingehen, wo die Wertschöpfung passiert.", "Ordres de grandeur inspirés de l’INRS (métiers de la logistique), de la CRAMIF et de guides professionnels sur les indicateurs d’entrepôt et l’automatisation. Graphismes : packs « Factory Kit », « Conveyor Kit », « Car Kit », « Mini Characters » et « Tower Defense Kit » de Kenney (kenney.nl), licence CC0.": "Größenordnungen inspiriert vom INRS (Berufe in der Logistik), der CRAMIF und Fachleitfäden zu Lagerkennzahlen und Automatisierung. Grafiken: Pakete „Factory Kit“, „Conveyor Kit“, „Car Kit“, „Mini Characters“ und „Tower Defense Kit“ von Kenney (kenney.nl), Lizenz CC0.", "Les manutentions manuelles sont la <b>première cause d’accidents</b> en logistique, et les troubles musculo-squelettiques la première maladie professionnelle (INRS). Prévention : aides à la manutention, articles lourds à mi-hauteur, rotation des postes, formation gestes et postures, pauses.": "Manuelle Handhabung ist die <b>häufigste Unfallursache</b> in der Logistik, und Muskel-Skelett-Erkrankungen sind die häufigste Berufskrankheit (INRS). Prävention: Handhabungshilfen, schwere Artikel auf mittlerer Höhe, Arbeitsplatzrotation, Schulung zu rückengerechtem Arbeiten, Pausen.", " jours de salaire d’indemnités s’il faut s’en séparer — mais il progresse et reste. <b>Intérim</b> : plus cher à la journée, sans engagement ; réservé pour la semaine au planning (×1,35) ou en urgence aujourd’hui (×1,6, pas garanti). Un bon intérimaire peut passer en CDI après 3 jours.": " Tagesgehälter Abfindung, wenn man sich trennen muss – aber er entwickelt sich weiter und bleibt. <b>Zeitarbeit</b>: pro Tag teurer, ohne Bindung; für die Woche im Plan gebucht (×1,35) oder dringend für heute (×1,6, nicht garantiert). Ein guter Leiharbeiter kann nach 3 Tagen fest angestellt werden.", "Environ 20 % des articles font 80 % des ventes (classe A), les suivants jusqu’à 95 % (B), le reste (C). Placer les A près de l’emballage et à hauteur d’homme (la « zone d’or ») réduit les déplacements de <b>15 à 30 %</b>. À refaire régulièrement : les ventes changent avec les saisons.": "Etwa 20 % der Artikel machen 80 % des Umsatzes (Klasse A), die nächsten bis 95 % (B), der Rest (C). A-Artikel nahe dem Packplatz und auf Greifhöhe (die „goldene Zone“) zu lagern, reduziert die Wege um <b>15 bis 30 %</b>. Regelmäßig wiederholen: Die Verkäufe ändern sich mit den Saisons.", "Le logiciel de gestion d’entrepôt connaît chaque adresse et chaque carton en temps réel, guide les rangements et propose les réapprovisionnements. Mais <b>il applique tes règles</b> : de mauvais seuils ou une mauvaise règle de rangement donnent de mauvais résultats, plus vite.": "Das Lagerverwaltungssystem kennt jeden Lagerplatz und jeden Karton in Echtzeit, steuert die Einlagerung und schlägt Nachschübe vor. Aber <b>es wendet deine Regeln an</b>: Schlechte Meldebestände oder eine schlechte Einlagerungsregel liefern schlechte Ergebnisse – nur schneller.", "Avec l’expérience seule, un salarié plafonne vite. La <b>formation</b> le fait progresser : plus rapide, moins d’erreurs, plus motivé. Un parcours (formation métier, CACES, chef d’équipe) fidélise aussi les meilleurs, et coûte moins cher qu’un recrutement.": "Mit Erfahrung allein stößt ein Mitarbeiter schnell an Grenzen. <b>Weiterbildung</b> bringt ihn voran: schneller, weniger Fehler, motivierter. Ein Entwicklungspfad (Fachschulung, CACES-Staplerschein, Teamleitung) bindet auch die Besten und kostet weniger als eine Neueinstellung.", "Un écart apparaît à chaque erreur de rangement, casse non déclarée ou erreur de prélèvement. Objectif : <b>plus de 98 à 99 % de précision</b>. L’<b>inventaire tournant</b> recompte un peu chaque jour au lieu de fermer l’entrepôt pour un inventaire complet.": "Eine Bestandsdifferenz entsteht bei jedem Einlagerungsfehler, jedem nicht gemeldeten Bruch oder Kommissionierfehler. Ziel: <b>über 98 bis 99 % Genauigkeit</b>. Die <b>permanente Inventur</b> zählt jeden Tag ein wenig nach, statt das Lager für eine Vollinventur zu schließen.", "Le stock de <b>prélèvement</b> est au sol ou à hauteur d’homme ; la <b>réserve</b> est en hauteur, accessible au chariot élévateur. Le <b>réapprovisionnement</b> descend la réserve avant que l’emplacement de picking soit vide, sinon le préparateur attend.": "Der Bestand für die <b>Kommissionierung</b> liegt am Boden oder auf Greifhöhe; die <b>Reserve</b> liegt oben, erreichbar mit dem Gabelstapler. Der <b>Nachschub</b> holt die Reserve herunter, bevor der Kommissionierplatz leer ist – sonst wartet der Kommissionierer.", "Stocker coûte cher : en moyenne <b>20 à 25 % de la valeur du stock par an</b> (argent immobilisé, assurance, place, casse, obsolescence). Trop de stock vide la trésorerie ; pas assez provoque des ruptures. Dans le jeu : 0,2 % de la valeur par jour.": "Lagern ist teuer: im Schnitt <b>20 bis 25 % des Bestandswerts pro Jahr</b> (gebundenes Kapital, Versicherung, Platz, Bruch, Veralterung). Zu viel Bestand leert die Kasse; zu wenig verursacht Fehlbestände. Im Spiel: 0,2 % des Werts pro Tag.", "Quand on commande en réaction aux ruptures (« vite, commandons le double ! »), les variations s’amplifient chez le fournisseur : c’est l’<b>effet coup de fouet</b> du célèbre Beer Game. Mieux vaut des règles stables, basées sur la vraie demande.": "Wenn man als Reaktion auf Fehlbestände bestellt („schnell, bestellen wir das Doppelte!“), verstärken sich die Schwankungen beim Lieferanten: Das ist der <b>Peitscheneffekt</b> aus dem berühmten Beer Game. Besser sind stabile Regeln auf Basis der echten Nachfrage.", "La demande varie d’une semaine à l’autre. La prévision part de l’historique et des tendances, mais elle est toujours un peu fausse : c’est pour ça qu’on garde un stock de sécurité, et qu’on <b>revoit ses seuils quand la saison change</b>.": "Die Nachfrage schwankt von Woche zu Woche. Die Prognose basiert auf der Historie und auf Trends, liegt aber immer etwas daneben: Deshalb hält man einen Sicherheitsbestand und <b>überprüft die Meldebestände, wenn die Saison wechselt</b>.", "Absentéisme = jours d’absence ÷ jours de travail prévus. Le moral, la pénibilité, les horaires décalés et la reconnaissance pèsent directement dessus. Un départ coûte un recrutement, une formation et des semaines de productivité réduite.": "Abwesenheitsquote = Fehltage ÷ geplante Arbeitstage. Moral, Arbeitsbelastung, versetzte Arbeitszeiten und Anerkennung wirken sich direkt darauf aus. Ein Abgang kostet eine Rekrutierung, eine Einarbeitung und Wochen geringerer Produktivität.", "Conduire un chariot élévateur demande une formation <b>CACES R489</b> et une autorisation de conduite de l’employeur. Les racks se contrôlent régulièrement : un montant heurté doit être signalé et réparé, sinon la structure peut céder.": "Einen Gabelstapler zu fahren erfordert eine <b>CACES R489</b>-Ausbildung (Staplerschein) und eine Fahrerlaubnis des Arbeitgebers. Regale werden regelmäßig geprüft: Ein angefahrener Regalständer muss gemeldet und repariert werden, sonst kann das Regal nachgeben.", "On contrôle chaque livraison avant de signer. Une anomalie se note sur le bon de livraison avec des <b>réserves précises</b> (« 6 cartons écrasés »), puis se confirme au transporteur. Sans réserve, le recours devient très difficile.": "Jede Lieferung wird vor der Unterschrift kontrolliert. Eine Abweichung wird mit <b>genauen Vorbehalten</b> („6 Kartons zerdrückt“) auf dem Lieferschein vermerkt und dann dem Spediteur bestätigt. Ohne Vorbehalt wird ein Regress sehr schwierig.", "Réception → stockage → préparation (le « picking ») → emballage → expédition. La préparation pèse 50 à 70 % des coûts d’exploitation d’un entrepôt e-commerce, surtout à cause des déplacements : c’est là que se gagne la productivité.": "Wareneingang → Einlagerung → Kommissionierung („Picking“) → Verpackung → Versand. Die Kommissionierung macht 50 bis 70 % der Betriebskosten eines E-Commerce-Lagers aus, vor allem wegen der Wege: Hier gewinnt man Produktivität.", "Mais attention : un robot coûte cher, il faut d’abord l’intégrer au système, et il met quelques jours à atteindre son plein rendement. Il ne se fatigue pas… mais il tombe en panne. Calculez bien votre retour sur investissement.": "Aber Vorsicht: Ein Roboter ist teuer, muss zuerst ins System integriert werden und braucht einige Tage bis zur vollen Leistung. Er wird nicht müde … fällt aber aus. Rechnen Sie Ihren Return on Investment gut durch.", "Stock en temps réel, scan des emplacements (3 fois moins d’erreurs de rangement) et commandes fournisseurs automatiques selon TES seuils. Deux jours d’apprentissage après l’installation (−15 % de productivité).": "Bestand in Echtzeit, Scannen der Lagerplätze (3-mal weniger Einlagerungsfehler) und automatische Lieferantenbestellungen nach DEINEN Meldebeständen. Zwei Tage Einarbeitung nach der Installation (−15 % Produktivität).", "Les articles ne se vendent pas tous autant : un même seuil pour toute la gamme fait des ruptures sur les meilleures ventes et du stock qui dort sur les autres. <button class=\"btn sm\" data-act=\"rpsug\" data-c=\"": "Nicht alle Artikel verkaufen sich gleich gut: Ein einheitlicher Meldebestand für das ganze Sortiment führt zu Fehlbeständen bei den Bestsellern und zu totem Bestand bei den anderen. <button class=\"btn sm\" data-act=\"rpsug\" data-c=\"", "Le camion a déposé des palettes en <b>réception</b> (zone bleue, au fond à gauche). Va prendre des cartons avec le <b>bouton d’action</b>. Chaque couleur d’étiquette correspond à une gamme (ici : Librairie).": "Der Lkw hat Paletten im <b>Wareneingang</b> abgestellt (blaue Zone, hinten links). Hol Kartons mit dem <b>Aktionsknopf</b>. Jede Etikettenfarbe steht für ein Sortiment (hier: Bücher).", "Enfin, avec une chargée de communication, vous pourrez lancer les grands événements : soldes, Black Friday, Noël. Objectifs : 14 gammes, 6 robots, un événement réussi, moins de 1,5 % d’erreurs et 80 000 €.": "Mit einer Kommunikationsbeauftragten können Sie schließlich die großen Events starten: Schlussverkauf, Black Friday, Weihnachten. Ziele: 14 Sortimente, 6 Roboter, ein erfolgreiches Event, unter 1,5 % Fehler und 80 000 €.", "On compare aux heures disponibles (effectif × durée × rendement, moins les absences). L’intérim réservé à l’avance coûte moins cher et arrive formé ; l’intérim du jour même coûte plus et n’est pas garanti.": "Man vergleicht mit den verfügbaren Stunden (Personal × Dauer × Leistung, abzüglich Abwesenheiten). Im Voraus gebuchte Zeitarbeit ist günstiger und kommt eingearbeitet; Zeitarbeit für denselben Tag kostet mehr und ist nicht garantiert.", "4 étoiles de satisfaction ! Le siège a de grands projets pour vous. Lancez les 8 gammes, gardez 4,3 ★, visez 15 000 € de trésorerie… et tenez une vraie semaine : 92 % de service, moins de 8 % de ruptures.": "4 Sterne Kundenzufriedenheit! Die Zentrale hat große Pläne mit Ihnen. Starten Sie die 8 Sortimente, halten Sie 4,3 ★, peilen Sie 15 000 € Liquidität an … und halten Sie eine ganze Woche durch: 92 % Servicegrad, unter 8 % Fehlbestände.", "Nouveaux défis : des produits frais à garder au froid, des équipes à ménager, des absences imprévues. Objectifs : 10 gammes, 4,3 ★, 20 000 €, et une semaine à plus de 90 % de service avec peu de ruptures.": "Neue Herausforderungen: Frischwaren, die gekühlt bleiben müssen, Teams, die geschont werden wollen, unerwartete Ausfälle. Ziele: 10 Sortimente, 4,3 ★, 20 000 € und eine Woche mit über 90 % Servicegrad und wenig Fehlbeständen.", "Installés de nuit. 3 niveaux par emplacement : bas et milieu pour le picking, haut en réserve (chariot élévateur et CACES). Débloque les caristes. À faire contrôler : un montant heurté doit être réparé.": "Nachts installiert. 3 Ebenen pro Lagerplatz: unten und Mitte zum Kommissionieren, oben als Reserve (Gabelstapler und CACES). Schaltet Staplerfahrer frei. Prüfen lassen: Ein angefahrener Regalständer muss repariert werden.", "Il manque des bras ? <b>Réserve des intérimaires</b> pour la semaine (moins cher et garanti), ou prévois des <b>heures supplémentaires</b> (plus de fatigue et d’accidents). Planning : Bureau › Équipe.": "Fehlen dir Hände? <b>Buche Leiharbeiter</b> für die Woche (günstiger und garantiert) oder plane <b>Überstunden</b> ein (mehr Ermüdung und Unfälle). Planung: Büro › Team.", "(On Time In Full) = commandes livrées à l’heure, complètes et sans erreur ÷ commandes à servir. C’est l’indicateur que le client regarde en premier. Une commande annulée ou fausse compte comme ratée.": "(On Time In Full) = pünktlich, vollständig und fehlerfrei gelieferte Aufträge ÷ zu bedienende Aufträge. Das ist die Kennzahl, die der Kunde zuerst ansieht. Ein stornierter oder falscher Auftrag zählt als verfehlt.", "Une commande arrive (en haut à droite) ! <b>Prélève</b> l’article demandé : tu le sors de son carton et le mets dans un bac gris. Un point d’exclamation jaune indique l’emplacement où il se trouve.": "Ein Auftrag kommt rein (oben rechts)! <b>Kommissioniere</b> den gewünschten Artikel: Du nimmst ihn aus seinem Karton und legst ihn in eine graue Kiste. Ein gelbes Ausrufezeichen zeigt den Lagerplatz, an dem er liegt.", "Exemple : un article se vend 6 fois par jour, le fournisseur livre en une demi-journée → 3 unités consommées pendant l’attente. Si tu recommandes sous 3, tu tombes en rupture avant la livraison.": "Beispiel: Ein Artikel verkauft sich 6-mal pro Tag, der Lieferant liefert in einem halben Tag → 3 Einheiten werden während der Wartezeit verbraucht. Bestellst du erst unter 3 nach, gerät er vor der Lieferung in Fehlbestand.", "Chaque emplacement a maintenant <b>3 niveaux</b> : bas et milieu pour le <b>picking</b>, à portée de main, et le <b>haut</b> qui sert de <b>réserve</b>. Seul un chariot élévateur l’atteint.": "Jeder Lagerplatz hat jetzt <b>3 Ebenen</b>: unten und Mitte für das <b>Picking</b>, in Griffweite, und <b>oben</b> als <b>Reserve</b>. Nur ein Gabelstapler kommt dorthin.", "Pour les ménager : une <b>salle de pause</b> (Améliorer), des <b>primes</b> et des <b>formations</b> (Équipe), et des plannings équilibrés. Les équipes du soir pèsent un peu sur le moral.": "Um sie zu schonen: ein <b>Pausenraum</b> (Verbessern), <b>Prämien</b> und <b>Schulungen</b> (Team) sowie ausgewogene Schichtpläne. Die Spätschicht drückt etwas auf die Moral.", ", avec z = 1,28 pour 90 % de service, 1,65 pour 95 %, 2,33 pour 99 %. Les derniers points de service coûtent beaucoup de stock : 99 % demande presque deux fois plus de sécurité que 90 %.": ", mit z = 1,28 für 90 % Servicegrad, 1,65 für 95 %, 2,33 für 99 %. Die letzten Prozentpunkte Servicegrad kosten viel Bestand: 99 % erfordern fast doppelt so viel Sicherheitsbestand wie 90 %.", "Ici, tout part par <b>vaisseau</b>. Il décolle toutes les 3 heures : chaque commande indique sa fenêtre de lancement. Charge les colis dans les <b>sas</b> (zone verte) avant son départ.": "Hier geht alles per <b>Raumschiff</b> raus. Es startet alle 3 Stunden: Jeder Auftrag zeigt sein Startfenster. Lade die Pakete vor dem Abflug in die <b>Schleusen</b> (grüne Zone).", "La prévention paie : <b>formation gestes et postures</b>, <b>aides à la manutention</b>, <b>rotation des postes</b>, pauses. Fatigue et heures sup font grimper les accidents du travail.": "Prävention zahlt sich aus: <b>Schulung zu rückengerechtem Arbeiten</b>, <b>Handhabungshilfen</b>, <b>Arbeitsplatzrotation</b>, Pausen. Ermüdung und Überstunden treiben die Arbeitsunfälle in die Höhe.", "Dans le bureau, onglet <b>Stock</b>, choisis le fournisseur de chaque gamme : <b>Standard</b> (prochain créneau), <b>Express</b> (+25 %, 1 h) ou <b>Import</b> (−30 %, par conteneur).": "Wähle im Büro, Reiter <b>Bestand</b>, den Lieferanten jedes Sortiments: <b>Standard</b> (nächstes Zeitfenster), <b>Express</b> (+25 %, 1 h) oder <b>Import</b> (−30 %, per Container).", "Deux jours d’apprentissage : l’équipe est un peu plus lente le temps de prendre le scanner en main. Le module <b>ABC</b> (Améliorer) range les meilleures ventes près de l’emballage.": "Zwei Tage Einarbeitung: Das Team ist etwas langsamer, bis es mit dem Scanner vertraut ist. Das Modul <b>ABC</b> (Verbessern) lagert die Bestseller nahe dem Packplatz ein.", "Trois nouveautés. Un : vous pouvez choisir vos fournisseurs. L’import maritime coûte 30 % moins cher, mais arrive en conteneur, au rythme des navires… et la douane peut en bloquer.": "Drei Neuerungen. Erstens: Sie können Ihre Lieferanten wählen. Seeimport ist 30 % günstiger, kommt aber per Container, im Takt der Schiffe … und der Zoll kann welche festhalten.", "Range ces cartons fournisseur dans un <b>emplacement de stockage</b> (zone jaune) : approche-toi et appuie sur Action. Chaque emplacement accueille une seule référence par niveau.": "Lagere diese Lieferantenkartons auf einem <b>Lagerplatz</b> ein (gelbe Zone): Geh hin und drück auf Aktion. Jeder Lagerplatz nimmt nur einen Artikel pro Ebene auf.", "Ton WMS est en service. Il passe les commandes fournisseurs tout seul… <b>selon les seuils que tu as réglés</b>. Trop bas : ruptures. Trop hauts : du stock qui dort et qui coûte.": "Dein WMS ist in Betrieb. Es löst die Lieferantenbestellungen selbst aus … <b>nach den Meldebeständen, die du eingestellt hast</b>. Zu niedrig: Fehlbestände. Zu hoch: Bestand, der herumliegt und kostet.", "Ici l’entrepôt tourne de <b>6 h à minuit</b>, en trois équipes de 6 heures : <b>matin</b>, <b>après-midi</b> et <b>soir</b>. Chaque salarié ne travaille que pendant son équipe.": "Hier läuft das Lager von <b>6 Uhr bis Mitternacht</b>, in drei 6-Stunden-Schichten: <b>Früh</b>, <b>Mittag</b> und <b>Spät</b>. Jeder Mitarbeiter arbeitet nur während seiner Schicht.", "Bonjour ! Nadia, ressources humaines. Je m’occupe des absences et des intérimaires, et je garde un œil sur le moral de tout le monde. Vous, concentrez-vous sur l’organisation.": "Hallo! Nadia, Personalabteilung. Ich kümmere mich um Abwesenheiten und Leiharbeiter und behalte die Moral aller im Auge. Sie konzentrieren sich auf die Organisation.", "Attention : votre fournisseur ne livre qu’à heures fixes, avec trois heures de délai. Réglez vos seuils de commande dans le Bureau, onglet Stock, avant de tomber en rupture.": "Achtung: Ihr Lieferant liefert nur zu festen Zeiten, mit drei Stunden Vorlauf. Stellen Sie Ihre Meldebestände im Büro, Reiter Bestand, ein, bevor Sie in den Fehlbestand rutschen.", "La chambre froide (en bas à droite) accueille les gammes <b>Frais</b> (étiquette verte claire) et <b>Surgelés</b> (bleu clair). Lance la gamme Frais au bureau, onglet Stock.": "Das Kühlhaus (unten rechts) nimmt die Sortimente <b>Frischware</b> (hellgrünes Etikett) und <b>Tiefkühlware</b> (hellblau) auf. Starte das Sortiment Frischware im Büro, Reiter Bestand.", "Les préparateurs à pied ne prennent qu’en bas et au milieu. Quand le bas se vide, descends la réserve : bouton <b>« Réapprovisionner »</b>, mains vides devant l’emplacement.": "Kommissionierer zu Fuß greifen nur unten und in der Mitte. Wenn unten leer wird, hol die Reserve herunter: Knopf <b>„Nachschub“</b>, mit leeren Händen vor dem Lagerplatz.", "Chaque matin, quelqu’un peut manquer à l’appel. Un <b>intérimaire</b> le remplace pour la journée, plus cher et moins rapide. Sinon, c’est toi qui compenses sur le terrain.": "Jeden Morgen kann jemand fehlen. Ein <b>Leiharbeiter</b> ersetzt ihn für den Tag, teurer und langsamer. Sonst gleichst du selbst in der Halle aus.", "Chaque vendredi, après le bilan, tu prépares la semaine suivante : la prévision des ventes donne la <b>charge</b> en heures, à comparer à la <b>capacité</b> de tes équipes.": "Jeden Freitag bereitest du nach der Bilanz die nächste Woche vor: Die Absatzprognose ergibt die <b>Arbeitslast</b> in Stunden, die du mit der <b>Kapazität</b> deiner Schichten vergleichst.", "Les écarts viennent surtout des erreurs de rangement. Le <b>WMS</b> (scan) les réduit beaucoup, et l’<b>inventaire tournant</b> (Bureau › Stock) remet les compteurs à jour.": "Bestandsdifferenzen entstehen vor allem durch Einlagerungsfehler. Das <b>WMS</b> (Scan) reduziert sie stark, und die <b>permanente Inventur</b> (Büro › Bestand) bringt die Zähler auf den neuesten Stand.", "Chaque vendredi, vous préparerez le planning de la semaine suivante. Et surveillez la santé des équipes : en logistique, les accidents et le mal de dos coûtent très cher.": "Jeden Freitag bereiten Sie die Planung der nächsten Woche vor. Und achten Sie auf die Gesundheit der Teams: In der Logistik kosten Unfälle und Rückenschmerzen sehr viel.", "Chaque salarié a une jauge de <b>pénibilité</b>. Porter, se pencher, répéter les mêmes gestes : à 100 %, c’est l’arrêt maladie pour TMS (troubles musculo-squelettiques).": "Jeder Mitarbeiter hat eine Anzeige für <b>Arbeitsbelastung</b>. Tragen, Bücken, immer gleiche Bewegungen: Bei 100 % folgt die Krankschreibung wegen MSE (Muskel-Skelett-Erkrankungen).", "Avec le <b>bureau agrandi</b>, tu pourras recruter une <b>responsable RH</b> : elle appelle les intérimaires toute seule, moins cher, et soigne le moral de l’équipe.": "Mit dem <b>erweiterten Büro</b> kannst du eine <b>Personalleiterin</b> einstellen: Sie ruft Leiharbeiter selbst an, günstiger, und pflegt die Moral des Teams.", "J’aime cet état d’esprit. Mais un bon chef d’entrepôt, ça se mesure : chaque vendredi soir, je regarderai vos indicateurs. Taux de service, erreurs, stock, résultat.": "Diese Einstellung gefällt mir. Aber ein guter Lagerleiter wird gemessen: Jeden Freitagabend sehe ich mir Ihre Kennzahlen an. Servicegrad, Fehler, Bestand, Ergebnis.", "Je ne vais pas vous mentir : il est vide, et il n’y a que vous. Mais les commandes en ligne explosent, et je veux faire de ce site notre meilleur centre logistique.": "Ich will Ihnen nichts vormachen: Es ist leer, und es gibt nur Sie. Aber die Online-Bestellungen explodieren, und ich will aus diesem Standort unser bestes Logistikzentrum machen.", "Un robot peut tomber en <b>panne</b> : un panneau rouge apparaît au-dessus. Va le <b>réparer</b> (bouton d’action), ou recrute un <b>technicien de maintenance</b>.": "Ein Roboter kann <b>ausfallen</b>: Ein rotes Schild erscheint über ihm. <b>Repariere</b> ihn (Aktionsknopf) oder stell einen <b>Wartungstechniker</b> ein.", "Va devant le camion et appuie sur <b>Décharger</b>, puis pose les cartons sur une palette de réception ou range-les directement. Tes réceptionnaires le font aussi.": "Geh vor den Lkw und drück auf <b>Entladen</b>, dann stell die Kartons auf eine Wareneingangspalette oder lagere sie direkt ein. Deine Wareneingangsmitarbeiter machen das auch.", "Ton fournisseur livre à heures fixes : <b>9 h, 12 h et 15 h</b>, avec 3 h de délai minimum. Si tu attends la rupture pour commander, tes clients attendront aussi.": "Dein Lieferant liefert zu festen Zeiten: <b>9 Uhr, 12 Uhr und 15 Uhr</b>, mit mindestens 3 h Vorlauf. Wenn du mit dem Bestellen bis zum Fehlbestand wartest, warten deine Kunden auch.", "Trois vols partent chaque jour : <b>10 h, 15 h et 20 h</b>. Les commandes <b>express</b> (étiquette ✈) rapportent 60 % de plus, mais doivent partir avec leur vol.": "Drei Flüge gehen jeden Tag: <b>10 Uhr, 15 Uhr und 20 Uhr</b>. <b>Express</b>-Aufträge (Etikett ✈) bringen 60 % mehr ein, müssen aber mit ihrem Flug raus.", "Un préparateur a trouvé un emplacement vide alors que le système indiquait du stock : c’est un <b>écart d’inventaire</b>. Il perd du temps et le carton est perdu.": "Ein Kommissionierer hat einen leeren Lagerplatz gefunden, obwohl das System Bestand anzeigte: Das ist eine <b>Inventurdifferenz</b>. Er verliert Zeit, und der Karton ist verloren.", "Un salarié se fatigue en travaillant : sous 50 % d’énergie, il ralentit. Un moral bas le ralentit aussi, augmente les absences… et peut le pousser à démissionner.": "Ein Mitarbeiter ermüdet beim Arbeiten: Unter 50 % Energie wird er langsamer. Schlechte Moral bremst ihn ebenfalls, erhöht die Fehlzeiten … und kann ihn zur Kündigung treiben.", "Ici, on tourne de 6 h à minuit, en trois équipes : matin, après-midi et soir. Vous ne pourrez pas tout faire vous-même. Votre vrai métier devient l’organisation.": "Hier arbeiten wir von 6 Uhr bis Mitternacht, in drei Schichten: Früh, Mittag und Spät. Sie werden nicht alles selbst machen können. Ihr eigentlicher Job wird die Organisation.", "Ici, pas de camion : un vaisseau cargo s’amarre toutes les 3 heures, pendant une fenêtre de lancement. Tous les colis doivent être dans les sas avant son départ.": "Hier gibt es keinen Lkw: Alle 3 Stunden legt ein Frachtraumschiff während eines Startfensters an. Alle Pakete müssen vor seinem Abflug in den Schleusen sein.", "Ouvre le <b>Bureau › Stock</b> : pour chaque gamme, règle un <b>seuil de commande</b> et une <b>quantité</b>. Le bouton « Appliquer » reprend le conseil calculé.": "Öffne <b>Büro › Bestand</b>: Stelle für jedes Sortiment einen <b>Meldebestand</b> und eine <b>Menge</b> ein. Der Knopf „Übernehmen“ übernimmt den berechneten Vorschlag.", "Parfois, la <b>douane</b> retient un conteneur pendant 3 heures. Tu peux payer 150 € pour le libérer tout de suite, ou prendre un <b>transitaire</b> (Améliorer).": "Manchmal hält der <b>Zoll</b> einen Container 3 Stunden lang fest. Du kannst 150 € zahlen, um ihn sofort freizubekommen, oder einen <b>Spediteur</b> beauftragen (Verbessern).", "Un camion fournisseur est à quai (devant la réception). Le chauffeur décharge seul, mais lentement : au-delà d’une heure à quai, l’attente est facturée (30 €/h).": "Ein Lieferanten-Lkw steht an der Rampe (vor dem Wareneingang). Der Fahrer entlädt allein, aber langsam: Nach über einer Stunde an der Rampe wird die Wartezeit berechnet (30 €/h).", "Au début de chaque poste, un <b>point d’équipe</b> de 5 minutes devant le tableau : objectifs, sécurité, priorités. L’équipe démarre plus vite et plus motivée.": "Zu Beginn jeder Schicht eine 5-minütige <b>Teambesprechung</b> vor der Tafel: Ziele, Sicherheit, Prioritäten. Das Team startet schneller und motivierter.", "Ton bureau s’agrandit : un poste de <b>responsable RH</b> est disponible (Bureau › Équipe). Elle gère les absences et fait monter le moral de tous chaque jour.": "Dein Büro wird größer: Eine Stelle als <b>Personalleiterin</b> ist verfügbar (Büro › Team). Sie kümmert sich um Abwesenheiten und hebt jeden Tag die Moral aller.", "Un client a reçu un mauvais article : retour, renvoi, satisfaction en baisse. Les intérimaires et les salariés fatigués ou peu formés se trompent plus souvent.": "Ein Kunde hat einen falschen Artikel erhalten: Retoure, Neuversand, sinkende Zufriedenheit. Leiharbeiter und müde oder wenig geschulte Mitarbeiter irren sich häufiger.", "Va à la <b>zone de recharge</b> (marquée au sol) et appuie sur <b>Contrôler mon chariot</b>. Tes caristes y font leur contrôle et y rechargent leurs batteries.": "Geh zur <b>Ladezone</b> (am Boden markiert) und drück auf <b>Meinen Stapler prüfen</b>. Deine Staplerfahrer machen dort ihre Kontrolle und laden ihre Batterien.", "Le logiciel qui pilote robots et machines. Indispensable avant d’acheter un robot ou un tri automatique (l’intégration coûte souvent autant que les machines).": "Die Software, die Roboter und Maschinen steuert. Unverzichtbar, bevor man einen Roboter oder eine automatische Sortierung kauft (die Integration kostet oft so viel wie die Maschinen).", "Pour les petites commandes du coin, vous aurez une flotte de drones : livraison en 20 minutes. Et un stockage vertical automatisé, si vous en avez les moyens.": "Für die kleinen Aufträge aus der Umgebung bekommen Sie eine Drohnenflotte: Lieferung in 20 Minuten. Und ein automatisches Vertikallager, wenn Sie es sich leisten können.", ". Une erreur coûte un retour, un renvoi et la confiance du client. Remèdes : contrôle au poste d’emballage, scan des codes-barres, pick-to-light, formation.": ". Ein Fehler kostet eine Retoure, einen Neuversand und das Vertrauen des Kunden. Abhilfe: Kontrolle am Packplatz, Barcode-Scan, Pick-to-Light, Schulung.", "Deux dangers : l’apesanteur, qui fait flotter les cartons mal arrimés, et l’oxygène. Plus l’équipage est nombreux, plus il en consomme. Surveillez la jauge.": "Zwei Gefahren: die Schwerelosigkeit, durch die schlecht gesicherte Kartons davonschweben, und der Sauerstoff. Je größer die Crew, desto mehr verbraucht sie. Behalten Sie die Anzeige im Blick.", "Margaux peut programmer un <b>événement</b> pour le lendemain (bureau, onglet Commandes) : soldes, Black Friday ou Noël. Les commandes explosent ce jour-là.": "Margaux kann ein <b>Event</b> für den nächsten Tag planen (Büro, Reiter Aufträge): Schlussverkauf, Black Friday oder Weihnachten. An diesem Tag explodieren die Bestellungen.", "Des cartons se sont détachés et <b>flottent</b> dans l’allée. Rattrape-les avant 2 heures, sinon ils sont perdus. Tes réceptionnaires s’en chargent aussi.": "Kartons haben sich gelöst und <b>schweben</b> im Gang. Fang sie innerhalb von 2 Stunden ein, sonst sind sie verloren. Deine Wareneingangsmitarbeiter kümmern sich auch darum.", "Chaque <b>vendredi soir</b>, Mme Laurent fait le bilan de la semaine : taux de service, ruptures, erreurs, précision du stock et résultat d’exploitation.": "Jeden <b>Freitagabend</b> zieht Frau Laurent Bilanz über die Woche: Servicegrad, Fehlbestände, Fehler, Bestandsgenauigkeit und Betriebsergebnis.", "Margaux, communication. Donnez-moi un jour de préparation, et je vous remplis les carnets de commandes. Soldes, Black Friday ou Noël : à vous de choisir.": "Margaux, Kommunikation. Geben Sie mir einen Tag Vorbereitung, und ich fülle Ihnen die Auftragsbücher. Schlussverkauf, Black Friday oder Weihnachten: Sie haben die Wahl.", ") : il prélève jour et nuit, sans salaire. Montée en charge : 50 % le premier jour, plein rendement en 5 jours. Maintenance 25 €/jour, énergie, pannes.": "): Er kommissioniert Tag und Nacht, ohne Gehalt. Hochlauf: 50 % am ersten Tag, volle Leistung nach 5 Tagen. Wartung 25 €/Tag, Energie, Ausfälle.", "Le hub tourne comme une horloge. Le siège a une nouvelle idée : un centre entièrement automatisé, près de Paris. Vous êtes la personne qu’il nous faut.": "Der Hub läuft wie ein Uhrwerk. Die Zentrale hat eine neue Idee: ein vollautomatisches Zentrum bei Paris. Sie sind genau die Person, die wir brauchen.", "Le soir, les commandes en ligne sont plus nombreuses : recrute au moins une personne dans l’<b>équipe du soir</b> (prime de soirée : +25 % de salaire).": "Abends gibt es mehr Online-Bestellungen: Stell mindestens eine Person für die <b>Spätschicht</b> ein (Spätschichtzulage: +25 % Gehalt).", "Un chauffeur ne prend jamais une palette qui n’est pas <b>filmée</b> (sinon les colis tombent). Mains vides, devant le quai : <b>Filmer la palette</b>.": "Ein Fahrer nimmt niemals eine Palette, die nicht <b>gestretcht</b> ist (sonst fallen die Pakete herunter). Mit leeren Händen vor der Rampe: <b>Palette stretchen</b>.", "Marco, cariste. Je m’occupe de la réserve en hauteur et je descends le stock quand les niveaux bas se vident. Vos préparateurs ne manqueront de rien.": "Marco, Staplerfahrer. Ich kümmere mich um die Reserve oben und hole den Bestand herunter, wenn die unteren Ebenen leer werden. Ihren Kommissionierern wird es an nichts fehlen.", "Trois vols par jour : 10 h, 15 h et 20 h. Les colis express, marqués d’un avion, doivent être chargés dans les conteneurs aériens avant le décollage.": "Drei Flüge pro Tag: 10 Uhr, 15 Uhr und 20 Uhr. Express-Pakete, mit einem Flugzeug markiert, müssen vor dem Start in die Luftfrachtcontainer geladen werden.", "Puis appuie sur <b>« Commander les articles sous le seuil »</b>. Avec un WMS, ces commandes partiront toutes seules, mais toujours selon TES seuils.": "Drück dann auf <b>„Artikel unter Meldebestand bestellen“</b>. Mit einem WMS gehen diese Bestellungen automatisch raus, aber immer nach DEINEN Meldebeständen.", "du prix, et il n’atteint son plein rendement qu’après plusieurs semaines (40 à 60 % le premier mois). La maintenance coûte 10 à 15 % du prix par an.": "des Preises, und er erreicht seine volle Leistung erst nach mehreren Wochen (40 bis 60 % im ersten Monat). Die Wartung kostet 10 bis 15 % des Preises pro Jahr.", "Hors du froid, un produit frais s’abîme en <b>2 heures</b> sur une palette, et en 1 h 30 si on le transporte. Range-le vite dans la chambre froide.": "Außerhalb der Kühlung verdirbt ein Frischprodukt auf einer Palette in <b>2 Stunden</b>, beim Transport in 1 h 30. Lagere es schnell im Kühlhaus ein.", "Les <b>fiches du manager</b> (Bureau › Pilotage) expliquent les formules : point de commande, stock de sécurité… Elles se débloquent au fil du jeu.": "Die <b>Managerkarten</b> (Büro › Steuerung) erklären die Formeln: Meldebestand, Sicherheitsbestand … Sie werden im Lauf des Spiels freigeschaltet.", "Une commande standard arrive au premier créneau situé au moins 3 h plus tard. Prévois donc le stock nécessaire pendant ce délai : c’est le rôle du": "Eine Standardbestellung kommt im ersten Zeitfenster an, das mindestens 3 h später liegt. Plane also den in dieser Zeit benötigten Bestand ein: Das ist die Aufgabe des", "Chaque colis est vérifié avant fermeture : 90 % des erreurs de préparation sont rattrapées, mais l’emballage prend environ 15 % de temps en plus.": "Jedes Paket wird vor dem Verschließen geprüft: 90 % der Kommissionierfehler werden abgefangen, aber das Verpacken dauert etwa 15 % länger.", "L’intérim réservé arrive chaque matin pour toute la semaine (×1,35 sur le salaire). En urgence, le jour même, il coûte ×1,6 et n’est pas garanti.": "Gebuchte Zeitarbeit kommt jeden Morgen für die ganze Woche (×1,35 auf das Gehalt). Dringend am selben Tag kostet sie ×1,6 und ist nicht garantiert.", "Un colis qui rate son vol attend le suivant et perd 30 % de sa valeur. Un vol complet (4 colis ou plus) parti sans retard compte pour l’objectif.": "Ein Paket, das seinen Flug verpasst, wartet auf den nächsten und verliert 30 % seines Werts. Ein voller Flug (4 Pakete oder mehr), der pünktlich abhebt, zählt für das Ziel.", "Active le <b>contrôle qualité au poste d’emballage</b> (Bureau › Stock › Règles) : il rattrape 90 % des erreurs, mais l’emballage est plus lent.": "Aktiviere die <b>Qualitätskontrolle am Packplatz</b> (Büro › Bestand › Regeln): Sie fängt 90 % der Fehler ab, aber das Verpacken wird langsamer.", "Avant d’utiliser un chariot élévateur, on le contrôle chaque jour : freins, fourches, klaxon, fuites. C’est obligatoire, et ça évite les pannes.": "Vor der Nutzung wird ein Gabelstapler täglich geprüft: Bremsen, Gabeln, Hupe, Lecks. Das ist Pflicht und verhindert Ausfälle.", "Chaque carton a une <b>date limite</b> : 3 jours pour le frais, 12 pour le surgelé. Commande juste ce qu’il faut, sinon il finira à la poubelle.": "Jeder Karton hat ein <b>Verfallsdatum</b>: 3 Tage für Frischware, 12 für Tiefkühlware. Bestell nur so viel wie nötig, sonst landet es im Müll.", "Les objectifs du palier se vérifient sur <b>une semaine complète</b> : accélérer le temps ne suffit pas. Suis-les dans <b>Bureau › Pilotage</b>.": "Die Stufenziele werden über <b>eine ganze Woche</b> geprüft: Die Zeit zu beschleunigen reicht nicht. Verfolge sie unter <b>Büro › Steuerung</b>.", "Des élévateurs automatiques servent tous les niveaux à hauteur d’homme : tout le monde accède au niveau haut, et chaque niveau gagne 6 cartons.": "Automatische Lifte bedienen alle Ebenen auf Greifhöhe: Alle erreichen die obere Ebene, und jede Ebene fasst 6 Kartons mehr.", "Deux : les entreprises. Recrutez une commerciale, et elle décrochera des contrats B2B : des palettes entières à livrer avant une heure précise.": "Zweitens: die Unternehmen. Stellen Sie eine Vertriebsmitarbeiterin ein, und sie holt B2B-Verträge rein: ganze Paletten, die bis zu einer bestimmten Uhrzeit zu liefern sind.", "Lyon-Est est devenue la meilleure plateforme du réseau. Le siège prépare déjà la suite : un hub portuaire, avec des conteneurs du monde entier…": "Lyon-Est ist die beste Plattform des Netzwerks geworden. Die Zentrale plant schon den nächsten Schritt: einen Hafen-Hub mit Containern aus aller Welt …", "Le goulot d’étranglement est l’étape où les commandes s’accumulent : c’est là qu’il faut ajouter des bras, un poste ou changer l’organisation.": "Der Engpass ist der Schritt, an dem sich die Aufträge stauen: Dort braucht es mehr Hände, einen weiteren Arbeitsplatz oder eine andere Organisation.", "Paris-Sud, 5 h 55. Un hangar blanc immaculé, un sol bleu, et un léger bourdonnement électrique. Les robots attendent leurs premières missions.": "Paris-Sud, 5:55 Uhr. Eine makellos weiße Halle, ein blauer Boden und ein leises elektrisches Summen. Die Roboter warten auf ihre ersten Aufträge.", "Ton premier <b>robot préparateur</b> est en service. Il travaille jour et nuit, sans salaire, mais il consomme de l’énergie (charges du soir).": "Dein erster <b>Kommissionierroboter</b> ist in Betrieb. Er arbeitet Tag und Nacht, ohne Gehalt, verbraucht aber Energie (Abendkosten).", "Les articles les plus vendus (classe A) sont rangés près de l’emballage, les moins vendus (C) au fond. Moins de marche pour les préparateurs.": "Die meistverkauften Artikel (Klasse A) liegen nahe dem Packplatz, die am wenigsten verkauften (C) hinten. Weniger Laufwege für die Kommissionierer.", "Rassemble les articles sur la <b>palette B2B</b> (zone orange, près de l’emballage). Tes préparateurs aident quand ils n’ont pas de commande.": "Sammle die Artikel auf der <b>B2B-Palette</b> (orange Zone, nahe dem Packplatz). Deine Kommissionierer helfen, wenn sie keinen Auftrag haben.", "Tu peux aussi <b>parler à chaque opérateur</b> : approche-toi, mains vides. Ils te disent comment ils vont… et ce qui coince sur le terrain.": "Du kannst auch <b>mit jedem Mitarbeiter sprechen</b>: Geh mit leeren Händen hin. Sie erzählen dir, wie es ihnen geht … und wo es in der Halle hakt.", "Un chariot élévateur et ta formation CACES R489 (obligatoire pour le conduire) : 12 cartons, plus rapide, et accès au niveau haut des racks.": "Ein Gabelstapler und deine CACES-R489-Ausbildung (Staplerschein, Pflicht zum Fahren): 12 Kartons, schneller, und Zugang zur oberen Regalebene.", "Aujourd’hui, vous dirigez la logistique de Colibox de la Terre jusqu’aux étoiles. Le conseil d’administration vous nomme directeur général.": "Heute leiten Sie die Logistik von Colibox von der Erde bis zu den Sternen. Der Vorstand ernennt Sie zum Geschäftsführer.", "Bonne nouvelle : tu peux maintenant recruter des <b>caristes</b> (Bureau › Équipe). Ils rangent en réserve et réapprovisionnent tout seuls.": "Gute Nachricht: Du kannst jetzt <b>Staplerfahrer</b> einstellen (Büro › Team). Sie lagern in die Reserve ein und füllen selbstständig nach.", "Charge les colis express dans les <b>conteneurs aériens</b> (zone rouge du quai). Le convoyeur et le tri automatique savent aussi le faire.": "Lade die Express-Pakete in die <b>Luftfrachtcontainer</b> (rote Zone an der Rampe). Das Förderband und die automatische Sortierung können das auch.", "La chambre froide est prête. Le frais rapporte peu par article, mais les clients en commandent tous les jours. Attention aux dates limites.": "Das Kühlhaus ist bereit. Frischware bringt pro Artikel wenig ein, aber die Kunden bestellen sie jeden Tag. Achtung auf die Verfallsdaten.", "À gauche, les <b>baies à conteneurs</b>. Toutes les 4 heures, un navire y dépose les conteneurs de tes commandes en <b>import maritime</b>.": "Links die <b>Containerbuchten</b>. Alle 4 Stunden setzt ein Schiff dort die Container deiner <b>Seeimport</b>-Bestellungen ab.", "Dernière étape : le <b>bureau</b> (à gauche, ou le bouton « Bureau » en haut) sert à commander du stock, recruter et améliorer l’entrepôt.": "Letzter Schritt: Das <b>Büro</b> (links, oder der Knopf „Büro“ oben) dient zum Bestellen von Ware, Einstellen und Ausbauen des Lagers.", "Chef, la réception déborde : le camion attend et le stock n’arrive plus en rayon. Il nous faut un réceptionnaire de plus, ou un cariste.": "Chef, der Wareneingang quillt über: Der Lkw wartet und die Ware kommt nicht mehr ins Regal. Wir brauchen noch einen Lageristen im Wareneingang oder einen Staplerfahrer.", "Cinq minutes debout devant le tableau : chacun sait quoi faire, et l’équipe démarre plus soudée (+5 % de rythme sur ce poste, moral +3).": "Fünf Minuten im Stehen vor der Tafel: Jeder weiß, was zu tun ist, und das Team startet geschlossener (+5 % Tempo in dieser Schicht, Moral +3).", "Trois : négociez avec vos fournisseurs. Objectifs : 12 gammes, 8 contrats B2B livrés, 4,3 ★, 35 000 € et un stock fiable à plus de 97 %.": "Drittens: Verhandeln Sie mit Ihren Lieferanten. Ziele: 12 Sortimente, 8 gelieferte B2B-Verträge, 4,3 ★, 35 000 € und ein zuverlässiger Bestand über 97 %.", "Chef, je ne vais pas vous mentir, l’ambiance est tendue. On enchaîne sans souffler… Une salle de pause ou une prime, ça ferait du bien.": "Chef, ich will Ihnen nichts vormachen, die Stimmung ist angespannt. Wir arbeiten ohne Verschnaufpause … Ein Pausenraum oder eine Prämie würden guttun.", "Nouvelles gammes aussi : la pharmacie, avec un contrôle qualité à l’emballage, et le luxe, qui doit être rangé dans une cage sécurisée.": "Auch neue Sortimente: Apotheke, mit Qualitätskontrolle beim Verpacken, und Luxus, das in einem gesicherten Käfig gelagert werden muss.", "Prépare-toi : du stock en avance, toutes les équipes au complet. Moins de 15 % d’annulations, et l’événement est une réussite (+0,3 ★).": "Bereite dich vor: Bestand im Voraus, alle Schichten vollzählig. Unter 15 % Stornierungen, und das Event ist ein Erfolg (+0,3 ★).", "Les représentants du personnel demandent une hausse de salaire : « On tient la cadence, on veut que ça se voie sur la fiche de paie. »": "Die Personalvertreter fordern eine Lohnerhöhung: „Wir halten das Tempo, das wollen wir auf der Lohnabrechnung sehen.“", "Palette complète : <b>filme-la</b> (ou laisse faire un expéditeur). Elle partira avec le prochain camion. Attention à l’heure limite !": "Palette voll: <b>stretch sie</b> (oder lass es einen Versandmitarbeiter machen). Sie geht mit dem nächsten Lkw raus. Achtung auf die Abfahrtszeit!", "Tes drones livrent les petites commandes urgentes (une seule pièce, étiquette « drone ») en 20 minutes. Elles rapportent 30 % de plus.": "Deine Drohnen liefern die kleinen Eilaufträge (ein einzelnes Teil, Etikett „Drohne“) in 20 Minuten. Sie bringen 30 % mehr ein.", "Titulaire du CACES R489, conduit un chariot élévateur : range en réserve (niveau haut) et réapprovisionne les emplacements de picking.": "Inhaber des CACES R489 (Staplerschein), fährt einen Gabelstapler: lagert in die Reserve (obere Ebene) ein und füllt die Kommissionierplätze nach.", "Calcule pour chaque article un seuil et une quantité de commande à partir de ses ventes réelles et du niveau de service que tu vises.": "Berechne für jeden Artikel einen Meldebestand und eine Bestellmenge aus seinen tatsächlichen Verkäufen und dem angestrebten Servicegrad.", "Chaque membre d’équipage consomme de l’oxygène. Sous 30 %, tout le monde ralentit et le moral chute. La jauge est en haut de l’écran.": "Jedes Crewmitglied verbraucht Sauerstoff. Unter 30 % werden alle langsamer, und die Moral sinkt. Die Anzeige ist oben am Bildschirm.", "Range un carton tout en haut avec ton chariot : approche-toi d’un emplacement et range, le chariot remplit d’abord le bas puis monte.": "Lagere einen Karton ganz oben mit deinem Stapler ein: Geh zu einem Lagerplatz und lagere ein – der Stapler füllt zuerst unten und dann weiter oben.", "démissionné. Un moral trop bas pendant plusieurs jours fait fuir les gens : pense aux pauses, aux primes et aux plannings équilibrés.": "hat gekündigt. Eine zu niedrige Moral über mehrere Tage vertreibt die Leute: Denk an Pausen, Prämien und ausgewogene Schichtpläne.", "Achète des <b>cartouches</b> (onglet Améliorer) ou installe un <b>recycleur d’oxygène</b>. Au niveau 3, la station devient autonome.": "Kauf <b>Kartuschen</b> (Reiter Verbessern) oder installiere einen <b>Sauerstoff-Recycler</b>. Auf Stufe 3 wird die Station autark.", "Apporte le bac au <b>poste d’emballage</b> (la machine à droite) : l’article y est mis dans un carton d’expédition, c’est ton colis.": "Bring die Kiste zum <b>Packplatz</b> (die Maschine rechts): Dort kommt der Artikel in einen Versandkarton – das ist dein Paket.", "Pose les colis marqués « drone » sur la <b>piste des drones</b> (en bas). Les drones décollent seuls, puis se rechargent 15 minutes.": "Leg die mit „Drohne“ markierten Pakete auf die <b>Drohnenpiste</b> (unten). Die Drohnen starten selbstständig und laden dann 15 Minuten.", "Chef, une palette B2B doit partir dans moins de deux heures ! Si on la rate, le client paiera moins… et il ne nous rappellera pas.": "Chef, eine B2B-Palette muss in weniger als zwei Stunden raus! Wenn wir sie verpassen, zahlt der Kunde weniger … und ruft uns nicht wieder an.", "Monte ton colis sur une <b>palette d’expédition</b> du quai (zone verte). Un camion part toutes les 30 minutes avec les palettes.": "Bring dein Paket auf eine <b>Versandpalette</b> an der Rampe (grüne Zone). Alle 30 Minuten fährt ein Lkw mit den Paletten ab.", "Le chauffeur décharge une palette : 6 cartons sont écrasés, le film est déchiré. Il attend ta signature sur le bon de livraison.": "Der Fahrer entlädt eine Palette: 6 Kartons sind zerdrückt, die Folie ist gerissen. Er wartet auf deine Unterschrift auf dem Lieferschein.", "Lyon-Est, 5 h 50. Trois quais, des semi-remorques qui manœuvrent, une chambre froide qui ronronne. Les néons s’allument un à un.": "Lyon-Est, 5:50 Uhr. Drei Rampen, rangierende Sattelzüge, ein brummendes Kühlhaus. Die Neonröhren gehen eine nach der anderen an.", "Quand une équipe part, la suivante prend la relève. Pour finir le palier, il te faudra <b>3 équipes d’au moins 2 personnes</b>.": "Wenn eine Schicht geht, übernimmt die nächste. Um die Stufe abzuschließen, brauchst du <b>3 Schichten mit mindestens 2 Personen</b>.", "Zone artisanale de Valmont, 7 h 58. Un vieil entrepôt aux murs lavande, un parking vide… et une pancarte : « Colibox recrute ».": "Gewerbegebiet Valmont, 7:58 Uhr. Ein altes Lager mit lavendelfarbenen Wänden, ein leerer Parkplatz … und ein Schild: „Colibox stellt ein“.", ") est sous l’objectif : trop de commandes en retard ou annulées. Regarde où ça coince : réception, préparation ou emballage ?": ") liegt unter dem Ziel: zu viele verspätete oder stornierte Aufträge. Schau, wo es hakt: Wareneingang, Kommissionierung oder Verpackung?", "Sofia, commerciale. J’ai déjà trois clients en tête : un hôtel, une mairie, un camping. Je vous envoie les offres au bureau !": "Sofia, Vertrieb. Ich habe schon drei Kunden im Kopf: ein Hotel, ein Rathaus, einen Campingplatz. Ich schicke Ihnen die Angebote ins Büro!", "Sofia va décrocher des <b>contrats B2B</b> : des commandes d’entreprises, à valider dans le bureau, onglet <b>Commandes</b>.": "Sofia wird <b>B2B-Verträge</b> an Land ziehen: Firmenaufträge, die du im Büro, Reiter <b>Aufträge</b>, bestätigst.", "Après plusieurs accidents, l’inspection du travail visite le site : formation, équipements, organisation… tout est vérifié.": "Nach mehreren Unfällen besucht die Arbeitsaufsicht den Standort: Schulung, Ausrüstung, Organisation … alles wird geprüft.", "La <b>maintenance préventive</b> divise les pannes par deux, et les <b>panneaux solaires</b> allègent la facture d’énergie.": "Die <b>vorbeugende Wartung</b> halbiert die Ausfälle, und <b>Solarmodule</b> senken die Energierechnung.", "On y est. La première station logistique en orbite. Colibox livre désormais la Lune, Mars… et tous ceux qui vivent là-haut.": "Wir sind da. Die erste Logistikstation im Orbit. Colibox beliefert jetzt den Mond, den Mars … und alle, die dort oben leben.", "Un trieur envoie chaque colis directement à sa bonne destination (quai, avion, piste des drones), plus besoin d’expéditeur.": "Ein Sorter schickt jedes Paket direkt an sein Ziel (Rampe, Flugzeug, Drohnenpiste) – kein Versandmitarbeiter mehr nötig.", "Cent trente lancements parfaits plus tard, le dernier vaisseau de la journée s’éloigne vers Mars dans un éclat de lumière.": "Hundertdreißig perfekte Starts später entfernt sich das letzte Raumschiff des Tages in einem Lichtblitz Richtung Mars.", "Contrôle douanier sur ce conteneur. Il restera fermé quelques heures… à moins que vous ne régliez les frais tout de suite.": "Zollkontrolle bei diesem Container. Er bleibt einige Stunden verschlossen … es sei denn, Sie zahlen die Gebühren sofort.", "Le siège vient de me nommer directrice nationale. Et j’ai besoin de vous à Lyon-Est : notre nouvelle plateforme régionale.": "Die Zentrale hat mich gerade zur nationalen Direktorin ernannt. Und ich brauche Sie in Lyon-Est: unserer neuen regionalen Plattform.", "La gamme <b>Luxe</b> se range uniquement dans la <b>cage sécurisée</b> (à gauche). Équipe-la au bureau avant de l’ouvrir.": "Das Sortiment <b>Luxus</b> wird nur im <b>gesicherten Käfig</b> (links) gelagert. Rüste ihn im Büro aus, bevor du es startest.", "Premier colis livré ! Nos clients adorent les livraisons rapides : chaque colis à l’heure fait monter votre satisfaction.": "Erstes Paket geliefert! Unsere Kunden lieben schnelle Lieferungen: Jedes pünktliche Paket steigert Ihre Zufriedenheit.", "Roissy, zone cargo, 5 h 30. Le grondement des réacteurs couvre tout. Sur le tarmac, un avion-cargo attend, soute ouverte.": "Roissy, Frachtzone, 5:30 Uhr. Das Dröhnen der Triebwerke übertönt alles. Auf dem Vorfeld wartet ein Frachtflugzeug mit offenem Laderaum.", "Des emplacements de picking sont vides alors qu’il reste du stock en réserve. Il faudrait descendre la réserve plus tôt.": "Kommissionierplätze sind leer, obwohl noch Bestand in der Reserve ist. Die Reserve müsste früher heruntergeholt werden.", "Fos-sur-Mer, 5 h 45. L’odeur de sel, le cri des mouettes, et un porte-conteneurs qui manœuvre lentement le long du quai.": "Fos-sur-Mer, 5:45 Uhr. Salzgeruch, Möwengeschrei und ein Containerschiff, das langsam am Kai entlang manövriert.", "Voici le centre le plus moderne de Colibox. Ici, vous pourrez tout automatiser : préparation, réception, emballage, tri.": "Das ist das modernste Zentrum von Colibox. Hier können Sie alles automatisieren: Kommissionierung, Wareneingang, Verpackung, Sortierung.", "des lignes de commande sont arrivées sans stock. Revois tes seuils de commande : délai fournisseur et stock de sécurité.": "der Auftragspositionen kamen ohne Bestand an. Überprüfe deine Meldebestände: Lieferzeit und Sicherheitsbestand.", "Les palettes d’expédition pleines sont filmées automatiquement, et toutes les palettes juste avant le départ du camion.": "Volle Versandpaletten werden automatisch gestretcht, und alle Paletten kurz vor Abfahrt des Lkw.", "Parfait ! Vous avez fait tout le circuit d’une commande. À partir de maintenant, les clients vont commander en continu.": "Perfekt! Sie haben den kompletten Ablauf eines Auftrags durchlaufen. Ab jetzt bestellen die Kunden laufend.", "Quand un conteneur arrive, va le <b>dépoter</b> : approche-toi de sa porte et prends les cartons comme sur une palette.": "Wenn ein Container ankommt, <b>entlade</b> ihn: Geh zu seiner Tür und nimm die Kartons wie von einer Palette.", "Sans WMS, c’est toi qui déclenches les commandes : bouton « Commander les articles sous le seuil » dans chaque gamme.": "Ohne WMS löst du die Bestellungen selbst aus: Knopf „Artikel unter Meldebestand bestellen“ in jedem Sortiment.", ": recrutement coûteux (annonces, entretiens), arrive dans 2 jours, payé même les jours calmes et pendant ses arrêts,": ": teure Rekrutierung (Anzeigen, Gespräche), kommt in 2 Tagen, wird auch an ruhigen Tagen und bei Krankheit bezahlt,", "Chef… on a dû jeter des produits frais. Il faut les ranger au froid plus vite, et ne pas trop en commander d’avance.": "Chef … wir mussten Frischware wegwerfen. Sie muss schneller gekühlt werden, und wir sollten nicht zu viel im Voraus bestellen.", "Un gros client annonce un audit demain : il vérifiera tes erreurs de préparation et la propreté (5S) de l’entrepôt.": "Ein Großkunde kündigt für morgen ein Audit an: Er prüft deine Kommissionierfehler und die Ordnung (5S) im Lager.", "Une vraie équipe du soir ! C’est là que les clients commandent le plus : vous allez le sentir dans la satisfaction.": "Eine echte Spätschicht! Dann bestellen die Kunden am meisten: Das werden Sie an der Zufriedenheit merken.", "Pour le faire baisser : moins de déplacements (ABC), moins d’attentes (réappro, flux équilibrés), moins d’erreurs.": "Um ihn zu senken: weniger Wege (ABC), weniger Wartezeiten (Nachschub, ausgeglichene Flüsse), weniger Fehler.", "On tombe souvent sur des emplacements vides alors que l’écran dit qu’il y a du stock. Un inventaire serait utile.": "Wir stoßen oft auf leere Lagerplätze, obwohl der Bildschirm Bestand anzeigt. Eine Inventur wäre nützlich.", "Les premiers colis de Lyon-Est sont partis ! Les semi-remorques passent toutes les 15 minutes, on a de la marge.": "Die ersten Pakete aus Lyon-Est sind raus! Die Sattelzüge kommen alle 15 Minuten, wir haben Spielraum.", "Chef, il y a des cartons qui volent dans l’allée ! Je les attrape, mais il faudrait vraiment arrimer ces racks.": "Chef, im Gang fliegen Kartons herum! Ich fange sie ein, aber diese Regale müssten wirklich gesichert werden.", "Je me souviens de vous, seul dans ce petit entrepôt lavande de Valmont, avec un transpalette et trois palettes.": "Ich erinnere mich an Sie, allein in diesem kleinen lavendelfarbenen Lager in Valmont, mit einem Hubwagen und drei Paletten.", "Station Horizon, orbite basse. 400 kilomètres sous vos pieds, la Terre tourne lentement, bleue et silencieuse.": "Station Horizon, niedriger Orbit. 400 Kilometer unter Ihren Füßen dreht sich die Erde langsam, blau und still.", "Un chariot élévateur ! Vous allez pouvoir stocker en hauteur. Les racks sont maintenant disponibles au bureau.": "Ein Gabelstapler! Sie können jetzt in die Höhe lagern. Die Regale sind jetzt im Büro verfügbar.", "Ouvre le <b>Bureau</b>, onglet <b>Équipe</b> : tu y vois chaque équipe, avec l’énergie et le moral de chacun.": "Öffne das <b>Büro</b>, Reiter <b>Team</b>: Dort siehst du jede Schicht mit Energie und Moral jedes Einzelnen.", "Apporte ici les colis emballés pour monter les palettes d’expédition : un camion part toutes les 30 minutes.": "Bring die verpackten Pakete hierher, um die Versandpaletten aufzubauen: Alle 30 Minuten fährt ein Lkw ab.", "Il fait 36 °C dans l’entrepôt. Les équipes se fatiguent beaucoup plus vite et le risque d’accident augmente.": "Im Lager sind es 36 °C. Die Teams ermüden viel schneller, und das Unfallrisiko steigt.", "J’ai mal au dos depuis quelques jours… Porter et me pencher toute la journée, ça commence à faire beaucoup.": "Mir tut seit ein paar Tagen der Rücken weh … Den ganzen Tag tragen und bücken, das wird langsam zu viel.", "Recrute une chargée de communication (bureau agrandi niveau 3) pour organiser soldes, Black Friday et Noël.": "Stell eine Kommunikationsbeauftragte ein (erweitertes Büro Stufe 3), um Schlussverkauf, Black Friday und Weihnachten zu organisieren.", "Trois quais, des semi-remorques et une chambre froide. L’entrepôt tourne de 6 h à minuit en trois équipes.": "Drei Rampen, Sattelzüge und ein Kühlhaus. Das Lager läuft von 6 Uhr bis Mitternacht in drei Schichten.", "Un intérimaire coûte 60 % de plus et travaille moins vite. Sinon, c’est à toi de compenser sur le terrain.": "Ein Leiharbeiter kostet 60 % mehr und arbeitet langsamer. Sonst musst du in der Halle selbst ausgleichen.", "Bienvenue au hub portuaire ! D’ici, Colibox importe des meubles et du matériel de jardin du monde entier.": "Willkommen im Hafen-Hub! Von hier importiert Colibox Möbel und Gartenausstattung aus aller Welt.", "Merci d’avoir joué à Warehouse. Tu peux continuer à faire tourner la station aussi longtemps que tu veux.": "Danke, dass du Warehouse gespielt hast. Du kannst die Station so lange weiterbetreiben, wie du willst.", "Six mois plus tard. Valmont est devenu le site modèle de Colibox, et le téléphone sonne un dimanche soir.": "Sechs Monate später. Valmont ist der Musterstandort von Colibox geworden, und an einem Sonntagabend klingelt das Telefon.", "Le convoyeur tourne : vos colis partent seuls vers le quai. On commence à parler de votre site au siège.": "Das Förderband läuft: Ihre Pakete fahren allein zur Rampe. In der Zentrale spricht man langsam über Ihren Standort.", "Les articles de <b>pharmacie</b> demandent un contrôle qualité : leur emballage prend 3 minutes de plus.": "Artikel aus der <b>Apotheke</b> erfordern eine Qualitätskontrolle: Ihr Verpacken dauert 3 Minuten länger.", "Un peu de comptage chaque jour (50 à 120 €/jour) : la précision du stock remonte au lieu de se dégrader.": "Jeden Tag ein wenig zählen (50 bis 120 €/Tag): Die Bestandsgenauigkeit steigt, statt zu sinken.", "Le WMS commande seul chaque article dont le stock (y compris ce qui est en route) passe sous son seuil.": "Das WMS bestellt jeden Artikel selbst, dessen Bestand (einschließlich unterwegs befindlicher Ware) unter seinen Meldebestand fällt.", "Beaucoup de commandes attendent un article en rupture. Les seuils de commande sont peut-être trop bas.": "Viele Aufträge warten auf einen Artikel im Fehlbestand. Die Meldebestände sind vielleicht zu niedrig.", "Les transports en commun seront en grève demain : plusieurs salariés risquent de ne pas pouvoir venir.": "Morgen wird im öffentlichen Nahverkehr gestreikt: Mehrere Mitarbeiter können womöglich nicht kommen.", "Pour la suite, le siège regarde vers le ciel : une base aérienne, des drones… On en reparle très vite.": "Für die Zukunft blickt die Zentrale zum Himmel: ein Luftfrachtstützpunkt, Drohnen … Wir sprechen sehr bald darüber.", "Un montant de rack est tordu : le risque d’accident est multiplié par 1,8 tant qu’il n’est pas réparé.": "Ein Regalständer ist verbogen: Das Unfallrisiko ist ×1,8, solange er nicht repariert ist.", "Un transitaire s’occupe des formalités : les contrôles douaniers sont rares et ne durent qu’une heure.": "Ein Spediteur kümmert sich um die Formalitäten: Zollkontrollen sind selten und dauern nur eine Stunde.", "Une influenceuse vient de parler de vos produits. Le service client prévoit +40 % de commandes demain.": "Eine Influencerin hat gerade über Ihre Produkte gesprochen. Der Kundenservice erwartet morgen +40 % Bestellungen.", "devient chef d’équipe : il épaule son équipe (+5 % de rythme, moral meilleur) contre +15 % de salaire.": "wird Teamleiter: Er unterstützt sein Team (+5 % Tempo, bessere Moral) gegen +15 % Gehalt.", "L’oxygène baisse dangereusement. L’équipe s’essouffle : il faut des cartouches ou un recycleur, vite.": "Der Sauerstoff sinkt gefährlich. Das Team kommt außer Atem: Wir brauchen Kartuschen oder einen Recycler, schnell.", "Objectif final : 18 gammes, 130 lancements réussis, 4,3 ★ et 250 000 €. Après ça… vous aurez tout vu.": "Endziel: 18 Sortimente, 130 erfolgreiche Starts, 4,3 ★ und 250 000 €. Danach … haben Sie alles gesehen.", "Bastien, maintenance. Un robot qui tousse, un tapis qui grince : je m’en occupe. Vous, vous pilotez.": "Bastien, Wartung. Ein hustender Roboter, ein quietschendes Band: Darum kümmere ich mich. Sie steuern.", "Le chariot élévateur fuit et refuse de lever. Sans lui, personne n’accède au niveau haut des racks.": "Der Gabelstapler leckt und hebt nicht mehr. Ohne ihn erreicht niemand die obere Regalebene.", "Ton chariot n’a pas été contrôlé : une fuite hydraulique n’a pas été vue, il est immobilisé demain.": "Dein Stapler wurde nicht geprüft: Ein Hydraulikleck wurde übersehen, er steht morgen still.", "Vous voilà dans la cour des grands : la livraison express mondiale. Ici, l’avion n’attend personne.": "Jetzt spielen Sie in der obersten Liga: weltweiter Expressversand. Hier wartet das Flugzeug auf niemanden.", "Gère les absences (intérimaires appelés automatiquement), suit le moral et l’améliore chaque jour.": "Kümmert sich um Abwesenheiten (Leiharbeiter werden automatisch angefordert), verfolgt die Moral und verbessert sie jeden Tag.", "Les <b>racks magnétiques</b> (Améliorer) gardent les cartons arrimés : cinq fois moins de dérives.": "Die <b>Magnetregale</b> (Verbessern) halten die Kartons gesichert: fünfmal weniger Abdriften.", "Aïe, des colis express ont raté leur vol. Les clients vont les recevoir plus tard… et moins cher.": "Autsch, Express-Pakete haben ihren Flug verpasst. Die Kunden bekommen sie später … und günstiger.", "est arrêté 5 jours : troubles musculo-squelettiques. La pénibilité de son poste était trop forte.": "ist 5 Tage krankgeschrieben: Muskel-Skelett-Erkrankungen. Die Belastung an seinem Arbeitsplatz war zu hoch.", "La logistique est plus accidentogène que la moyenne, et les accidents y sont plus graves (INRS).": "Die Logistik ist unfallträchtiger als der Durchschnitt, und die Unfälle sind dort schwerer (INRS).", "Le camion fournisseur attend depuis plus d’une heure : frais d’immobilisation facturés (30 €/h).": "Der Lieferanten-Lkw wartet seit über einer Stunde: Standgeld wird berechnet (30 €/h).", "Objectifs : 16 gammes, 90 vols complets à l’heure, 400 livraisons par drone, 4,3 ★ et 200 000 €.": "Ziele: 16 Sortimente, 90 volle Flüge pünktlich, 400 Drohnenlieferungen, 4,3 ★ und 200 000 €.", "Bonjour ! Je suis Mme Laurent, directrice régionale de Colibox. Bienvenue dans votre entrepôt.": "Hallo! Ich bin Frau Laurent, Regionaldirektorin von Colibox. Willkommen in Ihrem Lager.", "Tables élévatrices, préhenseurs, tapis anti-fatigue : la pénibilité des postes baisse de 40 %.": "Hubtische, Greifhilfen, Anti-Ermüdungsmatten: Die Belastung an den Arbeitsplätzen sinkt um 40 %.", "Un centre robotisé rentable, des clients ravis et des équipes sereines. Je suis fière de vous.": "Ein rentables Roboterzentrum, begeisterte Kunden und entspannte Teams. Ich bin stolz auf Sie.", "du travail cette semaine. La fatigue, les heures sup et les racks abîmés augmentent le risque.": "bei der Arbeit in dieser Woche. Ermüdung, Überstunden und beschädigte Regale erhöhen das Risiko.", "Chef, regardez la taille de ces conteneurs… On va avoir besoin de bras pour dépoter tout ça !": "Chef, schauen Sie sich die Größe dieser Container an … Wir brauchen Leute, um das alles zu entladen!", "Honnêtement, je ne me sens pas trop reconnu ici. On fait le boulot, mais personne ne le voit.": "Ehrlich gesagt fühle ich mich hier nicht besonders anerkannt. Wir machen die Arbeit, aber keiner sieht es.", "La banque te laisse jusqu’à demain soir pour repasser au-dessus de −300 €. Limite les achats.": "Die Bank gibt dir bis morgen Abend Zeit, wieder über −300 € zu kommen. Schränk die Käufe ein.", "commandes de plus par jour une fois lancée (démarrage progressif sur 5 jours) · marge moyenne": "Aufträge mehr pro Tag nach dem Start (schrittweiser Anlauf über 5 Tage) · durchschnittliche Marge", "Ça déborde ! Pensez à recruter au bureau : un préparateur et un emballeur vous soulageraient.": "Es läuft über! Denken Sie daran, im Büro einzustellen: Ein Kommissionierer und ein Packer würden Sie entlasten.", "Recrute une commerciale (bureau agrandi niveau 2) pour décrocher des contrats d’entreprises.": "Stell eine Vertriebsmitarbeiterin ein (erweitertes Büro Stufe 2), um Firmenverträge an Land zu ziehen.", "Un chariot a heurté un montant de rack : il est tordu. Les racks abîmés peuvent s’effondrer.": "Ein Stapler hat einen Regalständer angefahren: Er ist verbogen. Beschädigte Regale können einstürzen.", "Décroche des contrats B2B : de grosses commandes d’entreprises, livrées sur palette filmée.": "Hol B2B-Verträge rein: große Firmenaufträge, geliefert auf gestretchter Palette.", "Un carton trop lourd (plus de 25 kg), on le porte à deux ou avec une aide à la manutention.": "Einen zu schweren Karton (über 25 kg) trägt man zu zweit oder mit einer Handhabungshilfe.", "Les caristes viennent ici recharger leur chariot et faire leur contrôle avant utilisation.": "Die Staplerfahrer laden hier ihren Stapler und machen vor der Nutzung ihre Kontrolle.", "Très belle semaine : clients servis, équipes en forme, comptes au vert. Continue comme ça.": "Sehr schöne Woche: Kunden bedient, Teams fit, Zahlen im grünen Bereich. Weiter so.", "Vous avez fait de Roissy une référence mondiale. Il ne reste qu’une frontière à franchir…": "Sie haben Roissy zu einer weltweiten Referenz gemacht. Es bleibt nur noch eine Grenze zu überschreiten …", "Chef ! J’ai demandé ma mutation, avec quelques anciens de Valmont. On ne vous lâche pas.": "Chef! Ich habe meine Versetzung beantragt, mit ein paar alten Hasen aus Valmont. Wir lassen Sie nicht im Stich.", "La trésorerie est restée dans le rouge deux jours de suite. La direction ferme le site.": "Die Liquidität war zwei Tage hintereinander im Minus. Die Geschäftsführung schließt den Standort.", "Les équipements sont livrés et installés de nuit : ils fonctionnent le lendemain matin.": "Die Ausrüstung wird nachts geliefert und installiert: Sie funktioniert am nächsten Morgen.", "Prélève les articles des commandes (niveaux bas et milieu) et les dépose à l’emballage.": "Kommissioniert die Artikel der Aufträge (untere und mittlere Ebene) und bringt sie zum Packplatz.", "Toutes les palettes sont pleines ou filmées : filme-les, ou attends le prochain départ.": "Alle Paletten sind voll oder gestretcht: Stretch sie oder warte auf die nächste Abfahrt.", "Recompter une partie des emplacements remet la précision du stock à jour (actuellement": "Ein Teil der Lagerplätze nachzuzählen bringt die Bestandsgenauigkeit auf den neuesten Stand (aktuell", "Réserves notées sur le bon de livraison : le fournisseur rembourse les cartons abîmés.": "Vorbehalte auf dem Lieferschein vermerkt: Der Lieferant erstattet die beschädigten Kartons.", "Le premier drone est revenu sans une égratignure. Je surveille les batteries, promis.": "Die erste Drohne ist ohne einen Kratzer zurückgekommen. Ich behalte die Akkus im Auge, versprochen.", "Ton chariot a été contrôlé aujourd’hui. Les caristes rechargent ici leurs batteries.": "Dein Stapler wurde heute geprüft. Die Staplerfahrer laden hier ihre Batterien.", "Un avion rien que pour nos colis… Chef, vous vous rendez compte d’où on est partis ?": "Ein Flugzeug nur für unsere Pakete … Chef, ist Ihnen klar, wo wir angefangen haben?", ": les préparateurs trouvent des emplacements vides. Fais des inventaires tournants.": ": Die Kommissionierer finden leere Lagerplätze. Mach permanente Inventuren.", "Le chauffeur refuse les palettes non filmées : elles attendront le prochain départ.": "Der Fahrer lehnt nicht gestretchte Paletten ab: Sie warten auf die nächste Abfahrt.", "Toutes les palettes B2B sont occupées : agrandis la zone B2B ou termine un contrat.": "Alle B2B-Paletten sind belegt: Vergrößere die B2B-Zone oder schließe einen Vertrag ab.", "Accepte un contrat B2B au bureau (onglet Commandes) pour préparer une palette ici.": "Nimm im Büro (Reiter Aufträge) einen B2B-Vertrag an, um hier eine Palette vorzubereiten.", "Chariots : on ne circule jamais dans une allée où travaille un préparateur à pied.": "Stapler: Man fährt nie in einen Gang, in dem ein Kommissionierer zu Fuß arbeitet.", "Chef ! Un des robots s’est figé au milieu de l’allée. On fait quoi, on le pousse ?": "Chef! Einer der Roboter ist mitten im Gang erstarrt. Was machen wir, schieben wir ihn?", "Port de charges : on plie les jambes, le dos reste droit, la charge près du corps.": "Lasten tragen: Knie beugen, Rücken gerade, Last nah am Körper.", "pour la journée : il recompte une trentaine d’emplacements sans ralentir l’équipe.": "für den Tag: Er zählt etwa dreißig Lagerplätze nach, ohne das Team zu bremsen.", "Gratuit pour l’instant, mais risque d’accident ×1,8 tant que ce n’est pas réparé.": "Vorerst kostenlos, aber Unfallrisiko ×1,8, solange nicht repariert.", "Inventaire : 8 emplacements à recompter (📋). Va devant et appuie sur « Compter ».": "Inventur: 8 Lagerplätze nachzählen (📋). Geh davor und drück auf „Zählen“.", "Les salariés fatigués y récupèrent leur énergie, et le moral remonte chaque jour.": "Müde Mitarbeiter tanken hier Energie, und die Moral steigt jeden Tag.", "Produits futuristes, apesanteur et un vaisseau qui vient chercher la marchandise.": "Futuristische Produkte, Schwerelosigkeit und ein Raumschiff, das die Ware abholt.", "Des robots… Bon. Tant qu’ils ne prennent pas ma place à la machine à café, chef.": "Roboter … Na gut. Solange sie mir nicht meinen Platz an der Kaffeemaschine wegnehmen, Chef.", "Lance d’abord ton activité actuelle correctement : taux de service de la semaine": "Bring erst deinen aktuellen Betrieb richtig zum Laufen: Servicegrad der Woche", "Rien n’entre en stock, le fournisseur la reprend et relivre au prochain créneau.": "Nichts wird eingelagert, der Lieferant nimmt sie zurück und liefert im nächsten Zeitfenster neu.", "Je vous en reparle très vite. En attendant, profitez : vous l’avez bien mérité.": "Ich melde mich sehr bald wieder. Bis dahin genießen Sie es: Sie haben es sich verdient.", "Taux d’erreur = lignes fausses ÷ lignes préparées. Les bons entrepôts sont sous": "Fehlerquote = falsche Positionen ÷ kommissionierte Positionen. Gute Lager liegen unter", "Un petit hangar, un camion, et toi. Tu apprends tout le circuit d’une commande.": "Eine kleine Halle, ein Lkw und du. Du lernst den kompletten Ablauf eines Auftrags.", ": chaque retour coûte cher. Contrôle au poste d’emballage, formation, ou scan.": ": Jede Retoure kostet viel. Kontrolle am Packplatz, Schulung oder Scan.", "Toutes les baies sont occupées : les conteneurs attendront le prochain navire.": "Alle Buchten sind belegt: Die Container warten auf das nächste Schiff.", "\">Calculer article par article</button> (ventes récentes, délai fournisseur, ": "\">Artikel für Artikel berechnen</button> (letzte Verkäufe, Lieferzeit, ", "Le ravitaillement arrive par <b>navette</b>, à la réception, comme un camion.": "Der Nachschub kommt per <b>Shuttle</b> am Wareneingang an, wie ein Lkw.", "Réception, stockage, préparation, emballage, expédition… je m’occupe de tout.": "Wareneingang, Einlagerung, Kommissionierung, Verpackung, Versand … ich kümmere mich um alles.", "Un montant de rack heurté se signale tout de suite, même s’il a l’air solide.": "Ein angefahrener Regalständer wird sofort gemeldet, auch wenn er stabil aussieht.", "Conteneurs, grues et douane. Les grosses commandes des entreprises arrivent.": "Container, Kräne und Zoll. Die großen Firmenaufträge kommen.", "Un client a reçu un mauvais article. Il est fu
