<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Chef d'Entrepôt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout : jeu plein écran, caméra qui suit le personnage ; interface en surimpression (barre d'état, commandes, joystick, bouton d'action). Thème unique assumé : entrepôt lavande + orange sécurité. */
:root{
  color-scheme:light;
  --ink:#24213a; --panel:#f6f4ff; --card:#ffffff; --muted:#6c6890; --line:#d8d4ee;
  --lav:#8a86c8; --lav-d:#5d58a0; --night:#2b2840; --orange:#f28a1e; --gold:#ffc23d;
  --good:#2f9e5a; --bad:#d8402a; --warn:#d98a12; --blue:#3f7fd8;
  --display:'Baloo 2','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,sans-serif;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--night);color:var(--ink);font:15px/1.4 var(--body);margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.game{position:fixed;inset:0;background:#7aa45c}
.view{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}

.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:linear-gradient(rgba(36,33,58,.92),rgba(36,33,58,.7));color:#fff;z-index:3}
.st{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.st small{font-size:11px;color:#c9c4ef;white-space:nowrap}
.st strong{font-size:16px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.st strong.neg{color:#ff9a86}
.gold{color:var(--gold)}
.speed{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:8px;overflow:hidden;margin-left:auto}
.speed button{background:none;border:0;padding:5px 9px;font-weight:800;font-size:13px;color:#e6e3ff}
.speed button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.btn{color:var(--ink);font-family:inherit;border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:800;box-shadow:0 2px 0 var(--ink)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.primary{background:linear-gradient(#ffd667,#ffb52e)}
.btn.orange{background:linear-gradient(#ffa64a,#ef7d12);color:#fff}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn small{font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}

.orders{position:absolute;right:10px;top:70px;width:min(250px,46vw);display:flex;flex-direction:column;gap:6px;z-index:2;pointer-events:none}
.ord{background:rgba(255,255,255,.94);border:2px solid var(--ink);border-radius:10px;padding:5px 8px;font-size:12.5px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ord-h{display:flex;justify-content:space-between;gap:6px;font-weight:800}
.ord-h span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.ord .chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;padding:0 5px;border-radius:5px;background:#eeecf8}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.35)}
.chip.ok{background:#d9f2e1}
.bar{height:4px;border-radius:2px;background:#e4e1f3;margin-top:4px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--good)}
.ord.late .bar b{background:var(--bad)} .ord.mid .bar b{background:var(--warn)}
.ord.packed{opacity:.75}
.ord-more{font-size:12px;color:#fff;text-shadow:0 1px 2px #000;text-align:right}
.ticker{position:absolute;left:12px;top:70px;max-width:min(520px,calc(100% - 280px));font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.6);pointer-events:none;z-index:1}
.ticker .g{color:#b8f7c8}.ticker .b{color:#ffb6a6}.ticker .w{color:#ffdc8e}.ticker .i{color:#d3e0ff}

.joy{position:absolute;left:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);touch-action:none;z-index:2}
.joy-k{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.9);border:2px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.act{position:absolute;right:18px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:104px;height:104px;border-radius:50%;border:3px solid var(--ink);background:radial-gradient(circle at 40% 35%,#ffd98a,#f28a1e);font:800 15px/1.05 var(--display);color:var(--ink);box-shadow:0 4px 0 var(--ink);touch-action:none;padding:8px;z-index:2}
.act.dim{opacity:.5}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hint-kb{position:absolute;left:150px;bottom:calc(30px + env(safe-area-inset-bottom,0px));font-size:12px;color:#fff;text-shadow:0 1px 2px #000;z-index:1;pointer-events:none}
@media (pointer:coarse){.hint-kb{display:none}}

.tuto{position:absolute;left:50%;transform:translateX(-50%);top:70px;width:min(520px,calc(100% - 20px));display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:9px 12px;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:4}
.face{flex:none;border-radius:10px;border:2px solid var(--ink);background:#bfe1ff no-repeat;image-rendering:auto}
.tuto-t{flex:1;font-size:14.5px;line-height:1.35}
.tuto-skip{flex:none;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:4px}

.picker{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,calc(100% - 24px));max-height:70%;display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:5}
.pick-h{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:2px solid var(--line)}
.pick-h b{font-family:var(--display);font-size:18px}
.pick-b{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.pick{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--ink);border-radius:10px;background:var(--card);padding:7px 10px;box-shadow:0 2px 0 var(--ink)}
.pick:disabled{opacity:.45}
.pick span{flex:1}.pick small{display:block;color:var(--muted);font-size:12.5px}

.dlg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(640px,calc(100% - 20px));display:flex;gap:12px;align-items:stretch;background:var(--panel);border:4px solid var(--ink);border-radius:16px;padding:10px 14px 10px 10px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:7;cursor:pointer}
.dlg-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;position:relative}
.dlg-b b{font-family:var(--display);font-size:18px;color:var(--lav-d)}
.dlg-b p{margin:0;font-size:15.5px;line-height:1.4;min-height:3.9em}
.dlg-more{position:absolute;right:0;bottom:-2px;color:var(--orange);font-size:13px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}

.hub{position:fixed;inset:0;z-index:8;background:rgba(20,18,36,.6);display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.hub-card{background:var(--panel);border:4px solid var(--ink);border-radius:16px;width:min(760px,100%);height:min(720px,100%);display:flex;flex-direction:column;overflow:hidden}
.hub-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--night);color:#fff}
.hub-h b{font-family:var(--display);font-size:22px;color:var(--gold)}
.hub-h span{display:block;font-size:12.5px;color:#c9c4ef}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:2px solid var(--ink);background:#ebe8fb}
.tabs button{background:none;border:0;padding:10px 2px 8px;font:800 13.5px var(--body);color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}
.pane{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.pane h3{font:800 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.row{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
.row.locked{background:transparent;border-style:dashed}
.row-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.row-h b{font-size:16px;display:flex;align-items:center;gap:7px}
.row-h b i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.35)}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14.5px;font-variant-numeric:tabular-nums}
.sum .t{border-top:2px solid var(--ink);padding-top:5px;font-weight:800}
.pos{color:var(--good)} .neg{color:var(--bad)}
.road{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.road li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:5px 0}
.road .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;border:2px solid var(--line);background:var(--card)}
.road .done .n{background:var(--good);color:#fff;border-color:var(--good)}
.road .cur .n{background:var(--orange);color:#fff;border-color:var(--ink)}
.road b{font-size:15px}.road p{margin:0;font-size:13px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.log div{display:flex;gap:8px}.log time{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.log .g{color:var(--good)}.log .b{color:var(--bad)}.log .w{color:var(--warn)}.log .i{color:var(--blue)}
.credits{font-size:12.5px;color:var(--muted);margin:0}
.tuto-b{display:flex;flex-direction:column;gap:4px;align-items:center;flex:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--ink);border-radius:12px;padding:5px 10px;background:var(--card);font-weight:800;font-size:13.5px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.seg button small{font-weight:600;font-size:11.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold)}
.staff{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;align-items:center}
.staff .face{grid-row:span 2}
.gauges{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.gauge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:120px}
.gauge i{width:70px;height:7px;border-radius:4px;background:#e4e1f3;overflow:hidden;display:block}
.gauge i b{display:block;height:100%}
.tag{font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:#eeecf8;color:var(--muted)}
.tag.bad{background:#ffd9d1;color:#a02a14}.tag.ok{background:#d9f2e1;color:#1f6b3d}

.title{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding:20px;background:linear-gradient(rgba(30,26,54,.25),rgba(30,26,54,.85)),url(bg.png) center/cover}
.title-in{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.title-k{margin:0;color:#fff;font-weight:800;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 4px #000}
.title h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(44px,10vw,84px);line-height:.92;color:#fff;text-shadow:0 5px 0 var(--orange),0 9px 0 var(--ink),0 14px 30px rgba(0,0,0,.5)}
.title-btns{display:flex;flex-direction:column;gap:10px;width:min(280px,80vw);margin-top:14px}
.title-btns .btn{font-size:18px;padding:11px 14px}
.title-help{margin:0;color:#fff;font-size:14px;max-width:420px;text-shadow:0 1px 3px #000}

.modal{position:fixed;inset:0;background:rgba(20,18,36,.6);display:grid;place-items:center;padding:16px;z-index:10;overflow-y:auto}
.card{background:var(--panel);border:4px solid var(--ink);border-radius:16px;max-width:480px;width:100%;padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;line-height:1.05}
.card p{margin:0}
.toast{position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 16px;border-radius:12px;font-size:14.5px;font-weight:700;border-left:5px solid var(--gold);max-width:calc(100% - 32px);z-index:11;text-align:center}
@media (max-width:640px){
  .hud{gap:4px 10px}.st strong{font-size:14px}.st.opt{display:none}
  .orders{top:auto;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(210px,52vw)}
  .ticker{max-width:calc(100% - 24px)}
  .tabs button{font-size:12px}
  .hub{padding:0}.hub-card{border-radius:0;border-width:0;height:100%}
}
@media (min-width:641px) and (max-width:1000px){.tuto{left:10px;transform:none;width:calc(100% - 280px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="game">
  <div class="view" id="view"><canvas id="cv" aria-label="L'entrepôt, vue isométrique"></canvas>
    <div class="hud" id="hud">
      <div class="st"><small id="hPhase">Jour 1</small><strong id="hClock">08:00</strong></div>
      <div class="st"><small>Trésorerie</small><strong id="hMoney" class="gold">300 €</strong></div>
      <div class="st"><small>Satisfaction</small><strong id="hRate">★ 3.0</strong></div>
      <div class="st opt"><small id="hShipL">Colis livrés</small><strong id="hShip">0</strong></div>
      <div class="speed" role="group" aria-label="Vitesse du temps">
        <button data-speed="0" id="spd0" aria-label="Pause">II</button>
        <button data-speed="1" id="spd1">×1</button>
        <button data-speed="2" id="spd2">×2</button>
        <button data-speed="4" id="spd4">×4</button>
      </div>
      <button class="btn primary sm" data-act="openhub">Bureau</button>
    </div>
    <div class="ticker" id="ticker"></div>
    <div class="orders" id="orders"></div>
    <div class="tuto" id="tuto" hidden><div class="face" id="tutoF" style="width:46px;height:46px"></div><div class="tuto-t" id="tutoT"></div><div class="tuto-b" id="tutoB"></div></div>
    <div class="joy" id="joy" aria-hidden="true"><div class="joy-k" id="joyK"></div></div>
    <div class="hint-kb">Flèches / ZQSD : marcher · Espace : agir</div>
    <button class="act" id="actBtn" aria-label="Action"><span id="actLbl">Action</span></button>
    <div class="picker" id="picker" hidden><div class="pick-h"><b id="pickT"></b><button class="btn sm" data-act="closepick">Fermer</button></div><div class="pick-b" id="pickB"></div></div>
  </div>
</div>
<div class="dlg" id="dlg" hidden><div class="face" id="dlgF" style="width:84px;height:84px"></div><div class="dlg-b"><b id="dlgN"></b><p id="dlgT"></p><span class="dlg-more" id="dlgMore">▼</span></div></div>
<div class="title" id="title">
  <div class="title-in">
    <p class="title-k">Gestion · Logistique · Optimisation</p>
    <h1>Chef<br>d'Entrepôt</h1>
    <div class="title-btns" id="titleBtns"></div>
    <p class="title-help" id="titleHelp"></p>
  </div>
</div>
<div class="hub" id="hub" hidden>
  <div class="hub-card">
    <div class="hub-h"><div><b>Bureau du chef</b><span id="hubSub">Entrepôt Colibox · Zone artisanale</span></div><button class="btn sm" data-act="closehub">Retour</button></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="pane" id="pane"></div>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="card" id="modalIn"></div></div>
<div class="toast" id="toast" hidden></div>

  if(isOpenHours()&&S.tuto===-1){if(S.t>=S.nextOrder){newOrder();const mean=26/orderRate();S.nextOrder=S.t+Math.max(2,-mean*Math.log(1-Math.random()));}}

  S.packs.forEach((p,i)=>{
    if(i>=packCount())return;
    if(p.oid!=null){
      if(p.who==='me'&&S.me.pack!==i){}
      else if(!(p.who==='robot'&&p.broken)){let k=1;if(p.who==='staff'){const a=packerAt(i);k=a?speedF(a):.5;}
        p.work-=dm*k;if(p.work<=0){const o=finishPack(i);if(p.whoWasMe){S.me.hands.push(-o.id);p.whoWasMe=false;S.me.pack=-1;}else p.out++;}}
    }else if(stationRobot(i)&&!p.broken){startPack(i,'robot');}
  });
  const free_=o=>o.status==='packed'&&!S.me.hands.includes(-o.id)&&!S.staff.some(b=>(b.hands||[]).includes(-o.id));
  if(S.up.sorter&&!S.sorterBroken){S.packs.forEach(p=>{let guard=10;while(p.out>0&&guard--){const o=S.orders.find(free_);if(!o||!routeParcel(o))break;p.out--;}});}
  else if(S.up.conv){S.packs.forEach(p=>{if(p.out>0){S.convT=(S.convT||0)+dm;if(S.convT>2){S.convT=0;const o=S.orders.find(o=>free_(o)&&!o.drone);if(o&&routeParcel(o))p.out--;}}});}
  truckIn(dm);S.touts.forEach((T,i)=>truckOut(T,dm));if(TIER().port)shipTick(dm);if(TIER().air){airTick(dm);droneTick(dm);}if(TIER().space){floatTick(dm);o2Tick(dm);}
  if(S.up.wms)autoReorder();
  coldTick(dm);if(S.tier>=2)b2bTick(dm);if(TIER().auto)breakTick(dm);
  if(S.me.busy){S.me.busy.t-=dm;if(S.me.busy.t<=0){const b=S.me.busy;S.me.busy=null;busyDone(b);}}
  S.staff.forEach(a=>{if(a.here)staffAI(a,dm)});
  if(S.t>=S.day*DAYLEN()&&!S.dayEnded){S.t=S.day*DAYLEN();endDay();}
}

function truckOut(T,dm){

      S.dock=S.dock.map(()=>0);packed.forEach(o=>o.status='shipping');pal.forEach(c=>c.state='shipping');}}

function deliver(ids){
  let sum=0,late=0;
  ids.forEach(id=>{const o=S.orders.find(x=>x.id===id);if(!o)return;
    const onTime=S.t<=o.due+15;const v=onTime?o.value:Math.round(o.value*.6);sum+=v;

function truckIn(dm){
  const T=S.tin;
  S.incoming.forEach(d=>{if(!d.ready&&S.t>=d.eta)d.ready=true;});
  if(T.state==='away'&&S.incoming.some(d=>d.ready)){ // le camion regroupe toutes les commandes prêtes
    const cap=S.tier?90:40,load={boxes:[],n0:0};
    for(const d of S.incoming.filter(d=>d.ready)){const room=cap-load.boxes.length;if(room<=0)break;const part=d.boxes.splice(0,room);load.boxes.push(...part);if(!d.boxes.length)S.incoming.splice(S.incoming.indexOf(d),1);}
    load.n0=load.boxes.length;T.state='come';T.p=0;T.load=load;}
  else if(T.state==='come'){T.p+=dm/8;if(T.p>=1){T.state='unload';T.p=0;}}
  else if(T.state==='unload'){T.p+=dm/4;if(T.p>=1){
      const L=T.load;
      for(const st of S.rec){if(st.cont)continue;while(st.b.length<RECAP()&&L.boxes.length)st.b.push(L.boxes.shift());}
      if(L.boxes.length){T.p=.5;if(!T.warned){log('La réception est pleine : le camion attend qu’on libère des palettes.','w');T.warned=true;}return}
      T.warned=false;log(`Livraison fournisseur déchargée : ${L.n0} cartons.`,'i');T.state='leave';T.p=0;}}
  else if(T.state==='leave'){T.p+=dm/8;if(T.p>=1){T.state='away';T.p=0;T.load=null;}}
}

function shipTick(dm){

  else if(sh.state==='come'){sh.p+=dm/15;if(sh.p>=1){sh.state='dock';sh.p=0;}}
  else if(sh.state==='dock'){sh.p+=dm/10;if(sh.p>=1){
      let n=0;S.rec.forEach(st=>{if(!st.cont||st.b.length||!S.shipQ.length)return;st.b=S.shipQ.splice(0,CONT_CAP);n++;
        const p=S.up.broker?.06:.25;st.lock=Math.random()<p?S.t+(S.up.broker?60:180):0;if(st.lock){log(`Un conteneur est retenu en douane jusqu’à ${clockAt(st.lock-(S.day-1)*DAYLEN())}.`,'w');S.tf.customs=true;}});
      if(n)log(`Le navire a débarqué ${n} conteneur${n>1?'s':''}.`,'i');else if(S.shipQ.length)log('Toutes les baies sont occupées : les conteneurs attendront le prochain navire.','w');
      sh.state='leave';sh.p=0;}}

function stockOf(s){

  S.rec.forEach(st=>st.b.forEach(x=>{if(x===s)n++}));S.shipQ.forEach(x=>{if(x===s)n++});S.floaters.forEach(f=>{if(f.sku===s)n++});

function planRestock(skus,target){

    let L=order.find(l=>lvOk(l,hi)&&lv[l]&&lv[l].sku===s&&lv[l].n<LVC());
    if(L==null)L=order.find(l=>lvOk(l,hi)&&lv[l]&&lv[l].n===0);
    if(L==null)continue;const x=lv[L];

  return same<room||(empty-others)>0&&(same-room)<(empty-others)*LVC();}

    if(room>=small.n&&!S.staff.some(b=>(b.hands||[]).includes(+k)))return{i:small.i,sku:+k,n:small.n};}

}

function blocked(x,z,L){
  const r=S.up.fork?.42:.25;
  if(outB(x,z))return true;
  for(const [a,b,w,h] of L)if(x+r>a&&x-r<a+w&&z+r>b&&z-r<b+h)return true;

function moveMe(dt){
  const me=S.me;if(me.pack>=0||me.busy){me.walking=false;return}
  const L=solids();
  me.stuck=blocked(me.x,me.z,L)&&!outB(me.x,me.z);
  let vx=JOY.x,vy=JOY.y;
  if(KEYS.has('ArrowLeft')||KEYS.has('KeyA')||KEYS.has('KeyQ'))vx-=1;
  if(KEYS.has('ArrowRight')||KEYS.has('KeyD'))vx+=1;
  if(KEYS.has('ArrowUp')||KEYS.has('KeyW')||KEYS.has('KeyZ'))vy-=1;
  if(KEYS.has('ArrowDown')||KEYS.has('KeyS'))vy+=1;
  const l=Math.hypot(vx,vy);me.walking=l>.15;if(!me.walking)return;

  const wx=(vx+vy)/Math.SQRT2,wz=(vy-vx)/Math.SQRT2;
  const sp=(S.up.fork?3.6:2.6)*dt/1000;
  if(me.stuck){me.x=Math.max(M.bounds[0],Math.min(M.bounds[1],me.x+wx*sp));me.z=Math.max(M.bounds[2],Math.min(M.bounds[3],me.z+wz*sp));}
  else{const nx=me.x+wx*sp;if(!blocked(nx,me.z,L))me.x=nx;const nz=me.z+wz*sp;if(!blocked(me.x,nz,L))me.z=nz;}
  me.dir=Math.abs(wx)>Math.abs(wz)?(wx>0?0:1):(wz>0?2:3);
}

function nextDay(){
  S.day++;S.dayEnded=false;S.billed=false;S.today=blank();S.nextOrder=S.t+3;S.lastShift=0;
  S.staff=S.staff.filter(a=>!a.temp);
  expireStock();
  const quit=S.staff.filter(a=>a.low>=2&&!a.robot&&!ROLES[a.role].office);
  quit.forEach(a=>{dropOff(a);S.staff.splice(S.staff.indexOf(a),1);log(`${a.name} a démissionné : son moral était au plus bas.`,'b');});
  S.abs=[];
  S.staff.forEach(a=>{a.energy=100;
    if(a.absent>0){a.absent--;if(a.absent>0)S.abs.push({id:a.id,still:true});return}
    if(TIER().shifts>1&&!a.robot&&!ROLES[a.role].office&&S.day>2){const p=.025+(100-a.morale)/100*.07;if(Math.random()<p){a.absent=Math.random()<.25?2:1;a.reason=REASONS[Math.floor(Math.random()*REASONS.length)];S.abs.push({id:a.id});}}});
  refreshPresence();hideModal();save();log(`Jour ${S.day} : les portes ouvrent.`,'i');
  if(evActive()&&S.day===S.event.start)log(`${EVENTS[S.event.kind].name} : c’est aujourd’hui ! Les commandes vont affluer.`,'g');
  if(quit.length)say([['boss',`${quit.map(a=>a.name).join(' et ')} ${quit.length>1?'ont':'a'} démissionné. Un moral trop bas pendant plusieurs jours fait fuir les gens : pense aux pauses, aux primes et aux plannings équilibrés.`]]);
  if(S.abs.length)showAbsences();

      <div class="btns" id="abs${a.id}">${S.staff.some(t=>t.temp&&t.replaces===a.id)?'<span class="tag ok">Intérimaire en route</span>':`<button class="btn primary sm" data-act="temp" data-id="${a.id}">Appeler un intérimaire<small>${eur(Math.round(ROLES[a.role].sal*TIER_SAL[S.tier]*1.6*(a.shift===2?1.25:1)))}</small></button>`}</div></div>`).join('')}
    <div class="btns"><button class="btn orange" data-act="closemodal">Commencer la journée</button></div>`);

function callTemp(id,auto){const a=S.staff.find(x=>x.id===id);if(!a||S.staff.some(t=>t.temp&&t.replaces===id))return;
  const t=newStaff(a.role,a.shift,{temp:true,replaces:id,name:'Intérim',morale:60,pack:a.pack});S.usedNames[a.role]--;S.staff.push(t);refreshPresence();
  log(`Un intérimaire remplace ${a.name} (${ROLES[a.role].name.toLowerCase()}).`,'i');if(!auto)showAbsences();}

function migrate(s){ // sauvegarde de la version précédente (un seul palier)
  if(!s||s.v!==2)return null;
  const n=fresh(0);Object.assign(n,{t:s.t,day:s.day,money:s.money,rate:s.rate,cats:s.cats,orders:s.orders,oid:s.oid,incoming:s.incoming,tot:s.tot,log:[],seen:s.seen,tuto:s.tuto<0?-1:s.tuto,beats:s.beats,tf:s.tf,dayEnded:s.dayEnded,billed:s.billed,nextOrder:s.nextOrder});
  n.rec=s.rec.map(r=>({b:r.b,warm:0}));n.slots.forEach((sl,i)=>{if(s.slots[i])sl.lv=s.slots[i].lv.map(x=>({sku:x.sku,n:x.n,exp:0}))});
  n.packs=s.packs;n.dock=s.dock;n.me=Object.assign(n.me,s.me,{warm:0});n.tin=s.tin;n.touts=[s.tout];
  Object.keys(s.up).forEach(k=>n.up[k]=s.up[k]);
  s.staff.forEach(a=>{const b=newStaff(a.role,0,{name:a.name,xp:200});if(a.role==='packer')b.pack=a.pack||0;n.staff.push(b)});n.sid=50;
  return n;
}
function patchSave(s){ // complète une sauvegarde d'une version précédente du jeu
  const base=fresh(s.tier||0);for(const k in base)if(!(k in s))s[k]=base[k];for(const k in base.up)if(!(k in s.up))s.up[k]=0;
  s.rec.forEach((st,i)=>{if(st.cont==null)st.cont=!!(M.rec[i]&&M.rec[i][2]);if(st.lock==null)st.lock=0;});while(s.rec.length<M.rec.length)s.rec.push(base.rec[s.rec.length]);
  while(s.slots.length<M.slots.length)s.slots.push(base.slots[s.slots.length]);return s}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const s=JSON.parse(raw);if(s&&s.v===3)return patchSave(s)}
  const old=JSON.parse(localStorage.getItem('chef-entrepot-v2'));if(old){S=fresh(0);const n=migrate(old);if(n)return n}}catch(e){}return null}
function showTitle(){const can=S&&S.seen;$('titleBtns').innerHTML=(can?`<button class="btn orange" data-act="tcontinue">Continuer · ${TIER().name}</button>`:'')+`<button class="btn ${can?'':'orange'}" data-act="tnew">Nouvelle partie</button><button class="btn" data-act="thelp">Comment jouer</button>`;$('titleHelp').textContent='';$('title').hidden=false;}
function startStory(){S=fresh(0);setMap();S.seen=true;S.tin={state:'leave',p:.2,load:null};$('title').hidden=true;hideModal();save();say(CHAPTERS[0].lines,()=>{S.tuto=0;save();});}
function restartTier(){const t=S.tier;if(t===0)return startStory();const tot=S.tot;S=fresh(t);setMap();S.seen=true;S.money=6000;S.tot=tot;S.tuto=-1;S.mt={shifts:-1};hideModal();save();S.nextOrder=S.t+2;}

/* ======================================================================
   BOUCLE
   ====================================================================== */
function boot(){
  S=load()||fresh(0);setMap();refreshPresence();resize();showTitle();
  window.addEventListener('resize',resize);
  let uiAcc=0,saveAcc=0;
  function frame(now){
    const dt=Math.min(200,now-(frame.l||now));frame.l=now;
    const free=!DLG&&$('title').hidden&&$('modal').hidden;
    tickDlg(dt);
    if(free&&S.speed>0&&!S.dayEnded&&$('hub').hidden)moveMe(dt);
    if(free&&S.speed>0&&!S.dayEnded){let dm=dt/TIER().ms*S.speed;while(dm>0&&!S.dayEnded){const s=Math.min(dm,.25);step(s);dm-=s;}}
    if(free){tutoTick();mtTick();checkBeats();}
    draw(now);
    uiAcc+=dt;if(uiAcc>150){uiAcc=0;renderUI();}
    saveAcc+=dt;if(saveAcc>10000){saveAcc=0;if(S.seen)save();}
    requestAnimationFrame(frame);
  }
  renderUI();requestAnimationFrame(frame);
}
boot();

</script>
