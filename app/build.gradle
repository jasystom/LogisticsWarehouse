plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.chefentrepot.app'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.chefentrepot.app'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '4.0'
    }

    // Clé fixe incluse dans le projet : chaque nouvel APK peut mettre à jour le précédent sans perdre la sauvegarde.
    signingConfigs {
        jeu {
            storeFile file('chef-entrepot.jks')
            storePassword 'chefentrepot'
            keyAlias 'chefentrepot'
            keyPassword 'chefentrepot'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.jeu
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Les images du jeu sont déjà optimisées : ne pas les recompresser.
    androidResources { noCompress 'png' }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
